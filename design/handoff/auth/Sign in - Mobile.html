const B = [

  ['Welcome · Coach at sunrise', '6:50 am. Continue opens Coach Home', { role: 'coach', hour: 6.85, start: 'welcome' }],
  ['Welcome · Player at golden hour', '6:35 pm. Continue opens Player Home', { role: 'player', hour: 18.6, start: 'welcome' }],
  ['Welcome · Night, name lookup failed', '10:15 pm. Clubhouse lit, stars out', { role: 'player', hour: 22.25, anon: true, start: 'welcome' }],
  ['Welcome · Empty, all caught up', 'Nothing new since last sign-in', { role: 'coach', hour: 9, start: 'welcome', news: 'none' }],
  ['Welcome · Empty, first sign-in', 'No previous visit to compare', { role: 'player', hour: 15, start: 'welcome', news: 'first' }],
];
function Board({ i, l, s, p }) {
  const [k, setK] = React.useState(0);
  return (
    <div className="qm-board" data-screen-label={String(i + 1).padStart(2, '0') + ' ' + l} style={{ left: 60 + i * 482, top: 60 }}>
      <p className="qm-board__l">{l}</p><p className="qm-board__s">{s}</p>
      {!p.showError && <button type="button" className="lgm-replay" onClick={() => setK(k + 1)}>Replay</button>}
      <IOSDevice dark={p.hour != null && (p.hour > 19.6 || p.hour < 5.6)}><div style={{ position: 'absolute', inset: 0 }}><SignInMobile {...p} uid={String(i)} replayKey={k} /></div></IOSDevice>
    </div>
  );
}
const ONLY = new URLSearchParams(location.search).get('board');
