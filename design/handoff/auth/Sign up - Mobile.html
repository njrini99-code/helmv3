  ['role', 'Player or assistant', 'One tap chooses and moves on'],

  ['grad', 'Player · Class year', 'Year tiles with class labels'],
  ['game', 'Player · Your game', 'Handicap dial, hand, hometown'],
  ['photo', 'Player · Photo', 'Live roster preview'],
  ['done', 'Player · On the roster', 'Member card issued'],
  ['pending', 'Assistant · Waiting', 'Approval timeline'],
  ['program', 'Head coach · Program', 'Division tiles, team'],
  ['cdone', 'Head coach · Team code', 'Share code, member card'],
  ['rwho', 'Request · Who', 'Coach, AD or player'],
  ['sent', 'Request · Sent', 'Summary of the request'],
  ['code:bad', 'Error · Wrong code', 'Slots shake and turn red'],
  ['code:network', 'Error · Offline', 'Code check could not reach the server'],
  ['account:exists', 'Error · Email in use', 'Tap Create account to see it'],
  ['game:state', 'Error · State', 'Two-letter state required'],
  ['done:joinfail', 'Error · Couldn’t join', 'Profile saved, team join failed'],
  ['code:empty', 'Empty · New team', 'Code matched, no players yet'],
  ['done:empty', 'Empty · First player', 'First on the roster'],
];
const ONLY = new URLSearchParams(location.search).get('board');
function Board({ i, id, l, s }) {
  const [k, setK] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => { if (i === 0) return; const t = setTimeout(() => ref.current && ref.current.querySelectorAll('.gs svg').forEach((v) => v.pauseAnimations && v.pauseAnimations()), 400); return () => clearTimeout(t); }, [k]);
  return (
    <div ref={ref} className="qm-board" data-screen-label={String(i + 1).padStart(2, '0') + ' ' + l} style={{ left: 60 + (ONLY == null ? i : 0) * 482, top: 60 }}>
      <p className="qm-board__l">{l}</p><p className="qm-board__s">{s}</p>
      <button type="button" className="lgm-replay" onClick={() => setK(k + 1)}>Reset</button>
      <IOSDevice><div style={{ position: 'absolute', inset: 0 }} className={i === 0 ? '' : 'obm-still'}><OnboardX mobile key={k} preset={id} /></div></IOSDevice>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<>{B.map(([id, l, s], i) => (ONLY == null || +ONLY === i) && <Board key={id} i={i} id={id} l={l} s={s} />)}</>);
