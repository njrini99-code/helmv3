<script type="text/babel">
const KEY = 'gh-signup-rev2';
const JUMP = [['intro', 'Welcome'], ['code', 'Team code'], ['code-ok', 'Code matched'], ['role', 'Player or assistant'], ['name', 'Your name'], ['grad', 'Player · Class year'], ['account', 'Account'], ['game', 'Player · Your game'], ['photo', 'Player · Photo'], ['done', 'Player · On the roster'], ['pending', 'Assistant · Waiting'], ['staffdone', 'Staff invite · Done'], ['title', 'Head coach · Title'], ['program', 'Head coach · Program'], ['cdone', 'Head coach · Team code'], ['rwho', 'Request · Who'], ['rdetails', 'Request · Details'], ['sent', 'Request · Sent'],
  ['code:bad', 'Error · Wrong code'], ['code:network', 'Error · Code check offline'], ['code:rate', 'Error · Too many code attempts'], ['account:exists', 'Error · Email already registered'], ['account:network', 'Error · Account offline'], ['game:state', 'Error · State not 2 letters'], ['photo:error', 'Error · Photo too large'], ['done:joinfail', 'Error · Couldn’t join team'], ['rdetails:network', 'Error · Request offline'],
  ['code:empty', 'Empty · Team with no players'], ['done:empty', 'Empty · First on the roster'], ['name:empty', 'Empty · Name not filled'], ['program:empty', 'Empty · No school yet']];
function App() {
  const [r, setR] = React.useState(() => { const q = new URLSearchParams(location.search).get('step'); return { preset: 'intro', invite: false, ...JSON.parse(localStorage.getItem(KEY) || '{}'), ...(q ? { preset: q } : {}) }; });
  const [open, setOpen] = React.useState(false);
  const [k, setK] = React.useState(0);
  const flow = React.useRef(null);
  const set = (p) => { const n = { ...r, ...p }; setR(n); localStorage.setItem(KEY, JSON.stringify(n)); setK((x) => x + 1); };
  window.__review = { set, flow };
  return (<>
    <OnboardX key={k} preset={r.preset} invite={r.invite} flowRef={flow} />
    <div className="ghp" data-gh-nopress="" data-haptic="none">
      {open && <div className="ghp__body">
        <p className="ghp__k">Reviewer controls. Not part of the product.</p>
        <p className="ghp__k">Try a code</p>
        {[['K7PQX4MN', 'Player or assistant'], ['S4VN8QRT', 'Staff invite'], ['HELM2026', 'New program'], ['ABCD1234', 'Wrong code']].map(([c, l]) => (
          <button key={c} type="button" className="ghp__btn" style={{ background: '#EFECE4', color: '#12110E', textAlign: 'left', padding: '0 10px', display: 'flex', justifyContent: 'space-between' }} onClick={() => flow.current && flow.current.jump('code', { intent: 'code', code: c })}><b style={{ fontWeight: 600, letterSpacing: '.04em' }}>{c}</b><span style={{ fontWeight: 400, color: '#55524B' }}>{l}</span></button>
        ))}
        <p className="ghp__k">Jump to</p>
        <select value={r.preset} onChange={(e) => set({ preset: e.target.value })} style={{ height: 32, borderRadius: 9, border: 0, background: '#EFECE4', padding: '0 8px', font: '500 12.5px/1 var(--font-sans)' }}>{JUMP.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
        <label className="ghp__tg"><input type="checkbox" checked={r.invite} onChange={(e) => set({ invite: e.target.checked, preset: 'intro' })} /><span>Arrived from an invite link</span></label>
        <button type="button" className="ghp__btn" onClick={() => set({ preset: 'intro' })}>Start over</button>
      </div>}
      <button type="button" className="ghp__chip" aria-expanded={open} onClick={() => setOpen(!open)}><i></i><span>Prototype · Sign up</span></button>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
