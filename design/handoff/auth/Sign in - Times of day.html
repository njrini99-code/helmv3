<style>
a{color:#155A39}a:hover{color:#0B3A25}
.td{position:absolute;display:flex;flex-direction:column;gap:12px;font-family:var(--font-sans)}
.td__h{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.td__h b{font:600 24px/1 var(--font-display);letter-spacing:-.03em;color:#1C1B18}
.td__h span{font:500 15px/1 var(--font-sans);color:#55524B}
.td__f{position:relative;width:800px;height:500px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgb(28 25 18/.1),0 20px 40px -24px rgb(0 0 0/.4)}
.td__g{position:absolute;left:28px;top:26px;text-shadow:0 1px 18px rgb(251 250 246/.5);font:600 34px/1 var(--font-display);letter-spacing:-.04em;font-variation-settings:"wdth" 88}

</head><body><div id="root"></div>
<script type="text/babel" src="src/scene.jsx"></script>
<script type="text/babel">
const T = [
  [4.8, 'Before dawn', 'Stars and moon over a dark course. Clubhouse lit.'],
  [6.5, 'Sunrise', 'Sun rising behind the clubhouse, pink and peach clouds, lights going off.'],
  [8.75, 'Morning', 'Warm, pale sky. Sun climbing above the clubhouse.'],
  [12.5, 'Midday', 'High sun, clear blue, the brightest course of the day.'],
  [16, 'Afternoon', 'Sun moving right. Flag shadow swings with it.'],
  [18.6, 'Golden hour', 'Sun low over the right trees, amber light, windows warming.'],
  [19.8, 'Dusk', 'Sun gone, violet sky, first stars, clubhouse fully lit.'],
  [22.5, 'Night', 'Crescent moon, full stars, windows and porch glowing.'],
];
const fmt = (x) => { const h = Math.floor(x), m = Math.round((x % 1) * 60); return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm'); };
const word = (h) => (h >= 4.5 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : 'Good evening');
function Frames() {
  const only = new URLSearchParams(location.search).get('only');
  return <>{T.map(([h, l, d], i) => {
    if (only != null && !only.split(',').includes(String(i))) return null;
    const dark = gsSkyAt(h).ambA > .3;
    return <div key={h} className="td" data-screen-label={String(i + 1).padStart(2, '0') + ' ' + l} style={{ left: 60 + (i % 2) * 880, top: 60 + Math.floor(i / 2) * 640 }}>
      <div className="td__h"><b>{l}</b><span>{fmt(h)} · “{word(h)}”</span></div>
      <div className="td__f"><GolfScene hour={h} uid={'td' + i} /></div>
      <p className="td__p">{d}</p>
    </div>;
  })}</>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Frames />);
setTimeout(() => document.querySelectorAll('.td svg').forEach((s) => s.pauseAnimations && s.pauseAnimations()), 300);
</script></body></html>
