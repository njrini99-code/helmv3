<script type="text/babel">
const { FairwaySidebar, FairwayTopBar, IconButton, PlayerIdentity, Icon } = window.FairwayClubhouseEdition_9c4f4d;
function App() {
  const init = new URLSearchParams(location.search).get('player') || localStorage.getItem('st-player') || '';
  const [player, setPlayer] = React.useState(init);
  const ref = React.useRef(null);
  const open = (id) => { setPlayer(id); localStorage.setItem('st-player', id); if (ref.current) ref.current.scrollTop = 0; };
  const items = GH.items('coach');
  
  const p = window.ROSTER.players.find((x) => x.id === player);
  return (
    <div className="h2-app">
      <FairwaySidebar current="stats" onNavigate={GH.go} items={items}
        header={<div className="h2-brand"><img src="assets/helm-logo-white.png" alt="" /><div className="h2-brand__txt"><span className="fw-sidebar__word">GolfHelm</span><span className="fw-sidebar__team">Varsity · Fall 2026<Icon name="chevrons-up-down" size={13} /></span></div></div>}
        footer={<><div className="h2-next"><div className="h2-next__k"><span>Next event</span><span>In 2 days</span></div><div className="h2-next__t">Pinehurst qualifier</div><div className="h2-next__bar"><span></span></div><div className="h2-next__m">5 of 6 players ready</div></div><PlayerIdentity name="Maya Reyes" meta="Head coach · Varsity" size="sm" /></>} />
      <div className="h2-canvas" ref={ref}>
        <FairwayTopBar crumbs={p ? ['Stats', p.name] : ['Team', 'Stats']} onSearch={() => {}} searchPlaceholder="Search players, rounds, events" actions={<><IconButton icon="bell" label="Notifications" /><IconButton icon="settings" label="Settings" /></>} /><GHLayer />
        {p ? <StatsPlayer key={p.id} id={p.id} back={() => open('')} openPlayer={open} /> : <StatsTeam openPlayer={open} />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
