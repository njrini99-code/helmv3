<!-- @dsCard group="Colors" viewport="700x160" name="Scorecard notation" subtitle="Circle under par, square over — red under, green over" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--bg-page)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-hairline)}.n{font:500 12.5px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:400 11.5px/1.35 var(--font-sans);color:var(--text-tertiary)}</style></head><body class="fairway"><div style="display:flex;gap:34px;align-items:center"><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="fw-score fw-score--eagle" style="transform:scale(1.6);margin:8px">2</span><span class="n" style="margin:0">Eagle</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="fw-score fw-score--birdie" style="transform:scale(1.6);margin:8px">3</span><span class="n" style="margin:0">Birdie</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="fw-score " style="transform:scale(1.6);margin:8px">4</span><span class="n" style="margin:0">Par</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="fw-score fw-score--bogey" style="transform:scale(1.6);margin:8px">5</span><span class="n" style="margin:0">Bogey</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="fw-score fw-score--double" style="transform:scale(1.6);margin:8px">7</span><span class="n" style="margin:0">Double+</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span class="fw-score fw-score--current" style="transform:scale(1.6);margin:8px">4</span><span class="n" style="margin:0">In play</span></div><div style="margin-left:auto;display:flex;flex-direction:column;gap:6px;font:600 26px/1 var(--font-display);letter-spacing:-0.03em"><span style="color:var(--score-under)">−4</span><span>E</span><span style="color:var(--green-600)">+2</span></div></div></body></html>
