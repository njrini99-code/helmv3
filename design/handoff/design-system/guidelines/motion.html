<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--bg-page)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-hairline)}.n{font:500 12.5px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:400 11.5px/1.35 var(--font-sans);color:var(--text-tertiary)}</style></head><body class="fairway"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div><div style="height:4px;border-radius:2px;background:var(--ink-900)"></div><div class="n">90ms</div><div class="v">press</div></div><div><div style="height:4px;border-radius:2px;background:var(--ink-900)"></div><div class="n">150ms</div><div class="v">hover, color</div></div><div><div style="height:4px;border-radius:2px;background:var(--ink-900)"></div><div class="n">220ms</div><div class="v">popover, toast, switch</div></div><div><div style="height:4px;border-radius:2px;background:var(--ink-900)"></div><div class="n">360ms</div><div class="v">modal, sheet</div></div></div><div class="v" style="margin-top:14px">ease-out cubic-bezier(.2,.8,.2,1) · spring only on the switch thumb · no count-ups</div></body></html>
