<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Text on tint — always paired with a word" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--bg-page)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-hairline)}.n{font:500 12.5px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:400 11.5px/1.35 var(--font-sans);color:var(--text-tertiary)}</style></head><body class="fairway"><div class="sw"><div class="s"><div class="c" style="background:var(--positive-100);display:flex;align-items:center;padding:0 14px;font:500 13px var(--font-sans);color:var(--positive-600);box-shadow:none">Improving</div><div class="n">Positive</div><div class="v">positive-600 on positive-100</div></div><div class="s"><div class="c" style="background:var(--warning-100);display:flex;align-items:center;padding:0 14px;font:500 13px var(--font-sans);color:var(--warning-600);box-shadow:none">Early read</div><div class="n">Warning</div><div class="v">warning-600 on warning-100</div></div><div class="s"><div class="c" style="background:var(--danger-100);display:flex;align-items:center;padding:0 14px;font:500 13px var(--font-sans);color:var(--danger-600);box-shadow:none">Failed to sync</div><div class="n">Danger</div><div class="v">danger-600 on danger-100</div></div><div class="s"><div class="c" style="background:var(--info-100);display:flex;align-items:center;padding:0 14px;font:500 13px var(--font-sans);color:var(--info-600);box-shadow:none">Travel day</div><div class="n">Info</div><div class="v">info-600 on info-100</div></div></div></body></html>
