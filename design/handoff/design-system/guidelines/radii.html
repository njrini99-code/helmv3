<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--bg-page)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-hairline)}.n{font:500 12.5px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:400 11.5px/1.35 var(--font-sans);color:var(--text-tertiary)}</style></head><body class="fairway"><div style="display:flex;gap:16px"><div class="s"><div style="height:60px;background:var(--bg-surface);border-radius:5px;box-shadow:var(--shadow-sm)"></div><div class="n">5</div><div class="v">score cells, kbd</div></div><div class="s"><div style="height:60px;background:var(--bg-surface);border-radius:7px;box-shadow:var(--shadow-sm)"></div><div class="n">7</div><div class="v">badges, segments</div></div><div class="s"><div style="height:60px;background:var(--bg-surface);border-radius:10px;box-shadow:var(--shadow-sm)"></div><div class="n">10</div><div class="v">buttons, inputs</div></div><div class="s"><div style="height:60px;background:var(--bg-surface);border-radius:14px;box-shadow:var(--shadow-sm)"></div><div class="n">14</div><div class="v">cards</div></div><div class="s"><div style="height:60px;background:var(--bg-surface);border-radius:20px;box-shadow:var(--shadow-sm)"></div><div class="n">20</div><div class="v">modals</div></div><div class="s"><div style="height:60px;background:var(--bg-surface);border-radius:999px;box-shadow:var(--shadow-sm)"></div><div class="n">full</div><div class="v">avatars, pills</div></div></div></body></html>
