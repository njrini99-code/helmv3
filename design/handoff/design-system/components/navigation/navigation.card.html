<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--bg-page)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-caption);color:var(--text-tertiary);width:78px;flex:none}</style>
</head><body class="fairway"><div id="root" style="padding:24px"></div>
<script type="text/babel">
const NS = window.FairwayClubhouseEdition_9c4f4d;

const { FairwaySidebar, FairwayTopBar, ViewHeader, Button, IconButton, Tabs } = NS;
function App(){const [c,setC]=React.useState('brief');const [t,setT]=React.useState('today');return <div style={{display:'flex',height:372,borderRadius:16,overflow:'hidden',background:'#0A331F',boxShadow:'0 12px 30px -14px rgb(8 43 28 / .5)'}}>
<FairwaySidebar style={{width:196}} current={c} onNavigate={setC} team="Varsity · Fall 2026" user={{name:'Maya Reyes',meta:'Head coach'}} items={[{id:'brief',label:'Brief',icon:'sunrise'},{id:'cal',label:'Calendar',icon:'calendar-days'},{id:'msg',label:'Messages',icon:'message-square',count:3},{id:'roster',label:'Roster',icon:'users',count:14,section:'Team'},{id:'rounds',label:'Rounds',icon:'flag',section:'Team'}]}/>
<div style={{flex:1,minWidth:0,background:'var(--bg-page)',margin:'8px 8px 8px 0',borderRadius:12,overflow:'hidden'}}>
<FairwayTopBar crumbs={['Team','Brief']} searchPlaceholder="Search" actions={<IconButton icon="bell" label="Notifications"/>}/>
<div style={{padding:'22px 24px 0'}}><ViewHeader compact eyebrow="Tuesday, 14 October" title={<>Good morning, <em>Maya.</em></>} lede="Two players need a conversation before Thursday." actions={<Button variant="primary" size="sm" leftIcon="plus">New session</Button>}/>
<Tabs value={t} onChange={setT} tabs={[{value:'today',label:'Today'},{value:'week',label:'This week',count:6},{value:'season',label:'Season'}]}/></div>
</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
