<!-- @dsCard group="Components" viewport="1280x1150" name="Charts" subtitle="Prediction landing zone, score trend + scoreboard, tee-to-hole SG, driver field, putting green, field table, stat plates" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-caption);color:var(--text-tertiary);width:78px;flex:none}</style>
</head><body class="fairway"><div id="root" style="padding:24px"></div>
<script type="text/babel">
const NS = window.FairwayClubhouseEdition_9c4f4d;

const { PredictionCard, ScoreTrend, StrokesGainedRoute, DriveDispersion, PuttingGreen, FieldTable, StatPlate } = NS;
const rounds=[['Aug 9',76],['Aug 16',75],['Aug 23',77],['Aug 30',75],['Sep 6',74],['Sep 13',76],['Sep 20',73],['Sep 27',74],['Oct 2',72],['Oct 5',73],['Oct 9',71],['Oct 12',72]].map(([label,score])=>({label,score}));
const drives=[[-4,281],[6,292],[-12,268],[2,301],[18,276],[-7,288],[9,279],[-22,262],[1,295],[13,284],[-3,273],[24,289],[-9,297],[5,270]].map(([x,y])=>({x,y}));
const putts=[['0–3 ft',48,50,99],['3–6',31,44,80],['6–10',17,38,45],['10–20',9,52,20],['20+',2,34,5]].map(([band,made,attempts,benchmark])=>({band,made,attempts,benchmark}));
const g={display:'grid',gridTemplateColumns:'repeat(12,minmax(0,1fr))',gap:18};
function App(){return <div style={{margin:-24,padding:'28px 32px 36px',background:'var(--bg-page)'}}><div style={g}>
<PredictionCard style={{gridColumn:'span 5'}} title="Next round · Pinehurst No. 2" meta="Thu · Qualifier" score={73} low={70} high={76} confidence={78} average={74.0} reasons={[{text:'Approach play trending up',value:0.8},{text:'Mid-range putting inconsistent',value:-0.4},{text:'Tee accuracy improving, last 3 rounds',value:0.3}]}/>
<ScoreTrend style={{gridColumn:'span 7'}} title="Scoring · last 12 rounds" rounds={rounds} events={[{index:6,text:'New driver'},{index:10,text:'Season best'}]} note="Four strokes better since August. The new driver went in on Sep 20, and every round since is at or under 74."/>
<StrokesGainedRoute style={{gridColumn:'span 4'}} rows={[{label:'Off the tee',value:0.6},{label:'Approach',value:-0.8},{label:'Around green',value:0.2},{label:'Putting',value:0.4}]} note="Approach is the only leg losing strokes, about eight-tenths a round. That is where Thursday is won."/>
<DriveDispersion style={{gridColumn:'span 4'}} shots={drives} note="Carries 283 on average. Both big misses went right, so aim left-center."/>
<PuttingGreen style={{gridColumn:'span 4'}} rows={putts} note="Inside six feet he makes 72%. The team makes 84%, so short putts cost him most."/>
<FieldTable style={{gridColumn:'span 6'}} rows={[{label:'Greens in regulation',you:56,team:57,tour:67,unit:'%'},{label:'Fairways hit',you:61,team:55,tour:60,unit:'%'},{label:'Scrambling',you:55,team:51,tour:59,unit:'%'},{label:'Putts per round',you:31.2,team:30.6,tour:29.0,better:'down'}]} note="Driving is tour-grade. Greens hit is the gap."/>
<div className="fw-yb fw-yb-page" style={{gridColumn:'span 6'}}><header className="fw-yb-page__head"><h3>Season card</h3><span className="fw-yb-page__meta">vs previous 12</span></header><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
<StatPlate label="Scoring avg" value="74.0" delta="−1.3" good/><StatPlate label="Fairways" value="61" unit="%" delta="+4" good/><StatPlate label="Greens in reg." value="56" unit="%" delta="−2" good={false}/><StatPlate label="Putts / round" value="31.2" delta="+0.6" good={false}/></div></div>
</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
