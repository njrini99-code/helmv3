<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-caption);color:var(--text-tertiary);width:78px;flex:none}</style>
</head><body class="fairway"><div id="root" style="padding:24px"></div>
<script type="text/babel">
const NS = window.FairwayClubhouseEdition_9c4f4d;

const { FormField, Input, Select, TextArea, Checkbox, Radio, Switch } = NS;
function App(){return <div className="fw-surface" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 20px',padding:'20px 22px 12px'}}>
<FormField label="Course" help="As printed on the scorecard"><Input defaultValue="Oakmont Country Club"/></FormField>
<FormField label="Tees"><Select options={['Championship','Member','Forward']} defaultValue="Member"/></FormField>
<FormField label="Carry" optional><Input type="number" defaultValue={152} suffix="yds"/></FormField>
<FormField label="Score" error="Enter a score between 1 and 15"><Input invalid defaultValue="0"/></FormField>
<FormField label="Notes" className="" ><TextArea rows={2} placeholder="What to work on before Thursday"/></FormField>
<div className="col" style={{gap:12,paddingTop:22}}><Checkbox defaultChecked label="Share with coach" description="Strokes gained and notes"/><div className="row" style={{gap:18}}><Radio name="h" defaultChecked label="18 holes"/><Radio name="h" label="9 holes"/></div><Switch defaultChecked label="Track putts"/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
