<!DOCTYPE html><html><head><meta charset="utf-8"><title>GolfHelm · Messages</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body class="fairway"><div id="root"></div>
<script src="msg-data.js"></script>
<script type="text/babel" src="messages.jsx"></script>
<script type="text/babel">
const { FairwaySidebar, FairwayTopBar, IconButton, PlayerIdentity, Icon, ToastStack } = window.FairwayClubhouseEdition_9c4f4d;
const M = window.MSG;
function App() {
  const [sel, setSel] = React.useState(() => localStorage.getItem('ms-sel') || 'team');
  const [convs, setConvs] = React.useState(M.convs);
  const [threads, setThreads] = React.useState(M.threads);
  const [filter, setFilter] = React.useState('all');
  const [q, setQ] = React.useState('');
  const [details, setDetails] = React.useState(false);
  const [compose, setCompose] = React.useState(false);
  const [toasts, setToasts] = React.useState([]);
  const toast = (title, icon) => { const id = Date.now() + Math.random(); setToasts((t) => [...t, { id, title, icon }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200); };
  const pick = (id) => { setSel(id); localStorage.setItem('ms-sel', id); setConvs((cs) => cs.map((c) => c.id === id ? { ...c, unread: 0 } : c)); };
  React.useEffect(() => { pick(sel); }, []);
  const conv = convs.find((c) => c.id === sel) || convs[0];
  const send = (text) => {
    const now = new Date(); const t = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    setThreads((th) => ({ ...th, [conv.id]: [...th[conv.id], { from: 'me', t, text, seen: false }] }));
    setConvs((cs) => [{ ...conv, time: t, section: 'today', preview: ['You', text] }, ...cs.filter((c) => c.id !== conv.id)]);
  };
  const react = (idx, r) => setThreads((th) => ({ ...th, [conv.id]: th[conv.id].map((m, i) => { if (i !== idx) return m; const list = m.react ? [...m.react] : []; const j = list.findIndex(([x]) => x === r); if (j < 0) list.push([r, 1, true]); else { const [x, n, mine] = list[j]; list[j] = mine ? [x, n - 1, false] : [x, n + 1, true]; } return { ...m, react: list.filter(([, n]) => n > 0) }; }) }));
  const items = [
    { id: 'home', label: 'Home', icon: 'house' }, { id: 'coachhelm', label: 'CoachHelm', icon: 'sparkles' }, { id: 'calendar', label: 'Calendar', icon: 'calendar-days' }, { id: 'messages', label: 'Messages', icon: 'message-square', count: convs.reduce((a, c) => a + c.unread, 0) || undefined },
    { id: 'roster', label: 'Roster', icon: 'users', count: 6, section: 'Team' }, { id: 'stats', label: 'Stats', icon: 'chart-column', section: 'Team' }, { id: 'rounds', label: 'Rounds', icon: 'flag', section: 'Team' }, { id: 'practice', label: 'Practice', icon: 'target', section: 'Team' }, { id: 'lineups', label: 'Lineups', icon: 'list-ordered', section: 'Team' },
    { id: 'events', label: 'Events', icon: 'trophy', section: 'Program' }, { id: 'scouting', label: 'Scouting', icon: 'binoculars', section: 'Program' },
  ];
  const nav = (id) => { if (id === 'home') location.href = 'Coach Home v3.html'; if (id === 'calendar') location.href = 'Calendar.html'; if (id === 'roster') location.href = 'Roster.html'; if (id === 'stats') location.href = 'Stats.html'; if (id === 'coachhelm') location.href = 'CoachHelm.html'; };
  return (
    <div className="h2-app">
      <FairwaySidebar current="messages" onNavigate={nav} items={items}
        header={<div className="h2-brand"><img src="assets/helm-logo-white.png" alt="" /><div className="h2-brand__txt"><span className="fw-sidebar__word">GolfHelm</span><span className="fw-sidebar__team">Varsity · Fall 2026<Icon name="chevrons-up-down" size={13} /></span></div></div>}
        footer={<><div className="h2-next"><div className="h2-next__k"><span>Next event</span><span>In 2 days</span></div><div className="h2-next__t">Pinehurst qualifier</div><div className="h2-next__bar"><span></span></div><div className="h2-next__m">5 of 6 players ready</div></div><PlayerIdentity name="Maya Reyes" meta="Head coach · Varsity" size="sm" /></>} />
      <div className="h2-canvas is-ms">
        <FairwayTopBar crumbs={['Team', 'Messages']} onSearch={() => {}} searchPlaceholder="Search players, rounds, events" actions={<><IconButton icon="bell" label="Notifications" /><IconButton icon="settings" label="Settings" /></>} />
        <div className="ms has-open">
          <MsgRail convs={convs} sel={conv.id} onSel={pick} filter={filter} setFilter={setFilter} q={q} setQ={setQ} onNew={() => setCompose(true)} />
          <MsgThread conv={conv} msgs={threads[conv.id]} onSend={send} onReact={react} detailsOpen={details} setDetails={setDetails} />
          {details && <MsgDetails conv={conv} onClose={() => setDetails(false)} toast={toast} />}
        </div>
      </div>
      <MsgNew open={compose} onClose={() => setCompose(false)} onCreate={(mode, to) => { setCompose(false); if (mode === 'direct' && to[0] && convs.find((c) => c.id === to[0])) pick(to[0]); toast(mode === 'announce' ? 'Announcement posted to Varsity' : mode === 'group' ? 'Group created' : 'Conversation opened', 'circle-check'); }} />
      <ToastStack toasts={toasts} onDismiss={(id) => setToasts((t) => t.filter((x) => x.id !== id))} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
