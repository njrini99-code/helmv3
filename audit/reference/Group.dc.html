<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: oklch(0.488 0.124 150); }
    a:hover { color: oklch(0.567 0.142 149.6); }
    .fw { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .bub { font-size: 15px; line-height: 22px; }
  </style>
</helmet>
<div class="fw" style="position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; background:
       radial-gradient(132% 92% at 50% -15%, oklch(0.982 0.014 86) 0%, oklch(0.970 0.020 84) 44%, transparent 78%),
       linear-gradient(180deg, oklch(0.973 0.018 85) 0%, oklch(0.955 0.026 83) 52%, oklch(0.948 0.028 82) 100%); color: oklch(0.216 0.007 49); overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 8px; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); border-bottom: 1px solid oklch(0.862 0.013 82 / 0.95);">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"></path></svg>
    </div>
    <div style="display: flex; align-items: center; flex-shrink: 0;">
      <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9999px; background: oklch(0.939 0.045 150); color: oklch(0.488 0.124 150); font-size: 12px; font-weight: 600; border: 2px solid oklch(0.984 0.016 86);">AB</div>
      <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin-left: -12px; border-radius: 9999px; background: oklch(0.963 0.021 84); color: oklch(0.444 0.014 65); font-size: 12px; font-weight: 600; border: 2px solid oklch(0.984 0.016 86);">JR</div>
      <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin-left: -12px; border-radius: 9999px; background: oklch(0.963 0.021 84); color: oklch(0.444 0.014 65); font-size: 11px; font-weight: 600; border: 2px solid oklch(0.984 0.016 86);">+7</div>
    </div>
    <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1; margin-left: 4px;">
      <div style="font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Travel — Kiawah</div>
      <div style="font-size: 12px; line-height: 16px; color: oklch(0.535 0.015 70);">9 members</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.6h.01"></path></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px 16px 8px 16px; overflow: hidden;">

    <div style="display: flex; justify-content: center; padding: 0 0 16px 0;">
      <span style="padding: 5px 12px; border-radius: 9999px; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); border: 1px solid oklch(0.862 0.013 82 / 0.95); font-size: 11px; letter-spacing: 0.06em; font-weight: 600; color: oklch(0.535 0.015 70);">TODAY</span>
    </div>

    <!-- incoming group: name once above, avatar level with the LAST bubble -->
    <div style="display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px;">
      <div style="width: 32px; flex-shrink: 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: oklch(0.939 0.045 150); color: oklch(0.488 0.124 150); font-size: 11px; font-weight: 600;">AB</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0;">
        <span style="padding-left: 6px; font-size: 12px; font-weight: 500; color: oklch(0.444 0.014 65);">Alexis Bennett</span>
        <div class="bub" style="max-width: 268px; padding: 11px 15px; border-radius: 1.25rem 1.25rem 1.25rem 0.375rem; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06);">My clubs are already in the travel case.</div>
        <div style="display: flex; gap: 5px; margin-top: -9px; margin-left: 12px;">
          <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9999px; background: oklch(0.989 0.013 87); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.6), 0 1px 2px oklch(0.18 0.01 60 / 0.06), 0 4px 10px oklch(0.18 0.01 60 / 0.08);">
            <span style="font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; font-size: 12px;">✅</span>
            <span style="font-size: 11px; font-weight: 600; color: oklch(0.444 0.014 65);">6</span>
          </span>
        </div>
        <span class="mono" style="margin-top: 8px; padding-left: 6px; font-size: 11px; color: oklch(0.535 0.015 70);">9:06 AM</span>
      </div>
    </div>

    <!-- a shared file: an existing capability, given a real shape -->
    <div style="display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px;">
      <div style="width: 32px; flex-shrink: 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: oklch(0.963 0.021 84); color: oklch(0.444 0.014 65); font-size: 11px; font-weight: 600;">JR</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0;">
        <span style="padding-left: 6px; font-size: 12px; font-weight: 500; color: oklch(0.444 0.014 65);">Jordan Rivera</span>
        <div style="display: flex; align-items: center; gap: 11px; max-width: 268px; padding: 11px 13px; border-radius: 1.25rem 1.25rem 1.25rem 0.375rem; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06);">
          <div style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 0.625rem; background: oklch(0.971 0.024 150); flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.488 0.124 150)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"></path><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">kiawah-pairings.pdf</span>
            <span class="mono" style="font-size: 11px; color: oklch(0.535 0.015 70);">248 KB</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 4v11"></path><path d="m7.5 11 4.5 4.5 4.5-4.5"></path><path d="M5 20h14"></path></svg>
        </div>
        <span class="mono" style="padding-left: 6px; font-size: 11px; color: oklch(0.535 0.015 70);">9:11 AM</span>
      </div>
    </div>

    <!-- own: no receipt in a group — one member's read is not the group's -->
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
      <div class="bub" style="max-width: 292px; padding: 11px 15px; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; background: linear-gradient(165deg, oklch(0.567 0.142 149.6) 0%, oklch(0.526 0.128 149.8) 100%); color: oklch(0.994 0.006 95); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06);">Bus leaves at six sharp. Bring rain gear.</div>
      <span class="mono" style="padding-right: 4px; font-size: 11px; color: oklch(0.535 0.015 70);">9:15 AM</span>
    </div>
  </div>

  <div style="padding: 10px 16px 26px 16px; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); border-top: 1px solid oklch(0.862 0.013 82 / 0.95);">
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 1.75rem; background: oklch(0.963 0.021 84); border: 1px solid oklch(0.862 0.013 82 / 0.95);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 11.5 12.3 19a4.6 4.6 0 0 1-6.5-6.5l7.7-7.6a3 3 0 1 1 4.3 4.3l-7.7 7.6a1.5 1.5 0 1 1-2.1-2.1l7-7"></path></svg>
      <span style="flex-grow: 1; font-size: 15px; color: oklch(0.535 0.015 70);">Message the group</span>
      <div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 9999px; background: oklch(0.963 0.021 84); border: 1px solid oklch(0.862 0.013 82 / 0.95); flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14"></path><path d="m12.5 6 6 6-6 6"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
