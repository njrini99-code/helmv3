<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: oklch(0.488 0.124 150); }
    a:hover { color: oklch(0.567 0.142 149.6); }
    .fw { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .em { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    .bub { font-size: 15px; line-height: 22px; }
    .lit { box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06); }
    .lit-accent { box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.14), 0 1px 2px oklch(0.18 0.01 60 / 0.07), 0 8px 20px oklch(0.488 0.124 150 / 0.22); }
    .cream { background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); }
    .green { background: linear-gradient(165deg, oklch(0.567 0.142 149.6) 0%, oklch(0.526 0.128 149.8) 100%); color: oklch(0.994 0.006 95); }
    /* a settled reaction rests ON the bubble's lower edge, half-overlapping */
    .rx { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9999px; background: oklch(0.989 0.013 87);
          box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.6), 0 1px 2px oklch(0.18 0.01 60 / 0.06), 0 4px 10px oklch(0.18 0.01 60 / 0.08); }
    .rx-mine { box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.6), 0 0 0 1.5px oklch(0.648 0.149 149.6), 0 4px 10px oklch(0.488 0.124 150 / 0.16); }
    .n { font-size: 11px; font-weight: 600; color: oklch(0.444 0.014 65); }
  </style>
</helmet>

<div class="fw" style="position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; color: oklch(0.216 0.007 49); overflow: hidden;
     background:
       radial-gradient(132% 92% at 50% -15%, oklch(0.982 0.014 86) 0%, oklch(0.970 0.020 84) 44%, transparent 78%),
       linear-gradient(180deg, oklch(0.973 0.018 85) 0%, oklch(0.955 0.026 83) 52%, oklch(0.948 0.028 82) 100%);">

  <!-- settled reactions, above the held message -->
  <div style="display: flex; flex-direction: column; padding: 26px 16px 0 16px; opacity: 0.34;">
    <div style="display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 22px;">
      <div class="bub cream lit" style="max-width: 296px; padding: 12px 16px; border-radius: 1.25rem 1.25rem 1.25rem 0.375rem;">Tee time moved to 7:40 — bus leaves at six.</div>
      <div style="display: flex; gap: 5px; margin-top: -9px; margin-left: 14px;">
        <span class="rx"><span class="em" style="font-size: 12px;">👍</span><span class="n">3</span></span>
        <span class="rx"><span class="em" style="font-size: 12px;">✅</span><span class="n">2</span></span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 10px;">
      <div class="bub green lit-accent" style="max-width: 296px; padding: 12px 16px; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem;">Bring the travel case Thursday night.</div>
      <div style="display: flex; gap: 5px; margin-top: -9px; margin-right: 14px;">
        <span class="rx rx-mine"><span class="em" style="font-size: 12px;">❤️</span><span class="n" style="color: oklch(0.488 0.124 150);">1</span></span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- the held message stays lit; the tray floats above it -->
  <div style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; padding: 0 16px 14px 16px;">
    <!-- the closed five, from message-reactions.ts -->
    <div style="display: flex; align-items: center; gap: 2px; margin-bottom: 10px; padding: 6px; border-radius: 9999px;
         background: rgb(244 232 210 / 0.88); backdrop-filter: blur(36px) saturate(190%); -webkit-backdrop-filter: blur(36px) saturate(190%);
         box-shadow: inset 0 1px 0 rgb(255 248 233 / 0.6), 0 8px 16px oklch(0.15 0.01 55 / 0.10), 0 24px 64px oklch(0.15 0.01 55 / 0.16);">
      <span class="em" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 9999px; font-size: 24px;">👍</span>
      <span class="em" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 9999px; font-size: 24px; background: oklch(0.648 0.149 149.6 / 0.16); box-shadow: inset 0 0 0 1.5px oklch(0.648 0.149 149.6 / 0.5);">❤️</span>
      <span class="em" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 9999px; font-size: 24px;">😂</span>
      <span class="em" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 9999px; font-size: 24px;">👀</span>
      <span class="em" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 9999px; font-size: 24px;">✅</span>
    </div>

    <div class="bub green" style="max-width: 296px; padding: 12px 16px; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), 0 8px 16px oklch(0.15 0.01 55 / 0.12), 0 24px 64px oklch(0.488 0.124 150 / 0.28);">Great — see you at the bus.</div>
  </div>

  <!-- actions below, so the thumb reaches the tray first -->
  <div style="position: relative; z-index: 2; padding: 10px 12px 26px 12px; border-radius: 1.75rem 1.75rem 0 0;
       background: rgb(244 232 210 / 0.88); backdrop-filter: blur(36px) saturate(190%); -webkit-backdrop-filter: blur(36px) saturate(190%);
       box-shadow: inset 0 1px 0 rgb(255 248 233 / 0.6), 0 8px 16px oklch(0.15 0.01 55 / 0.10), 0 24px 64px oklch(0.15 0.01 55 / 0.16);">
    <div style="width: 38px; height: 4px; margin: 2px auto 12px auto; border-radius: 9999px; background: oklch(0.32 0.045 68 / 0.18);"></div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8V4l-7 7 7 7v-4.1c4.2 0 7.1 1.3 9 4.1-.8-4.2-3.2-8.6-9-9z"></path></svg>
        <span style="font-size: 16px; font-weight: 500;">Reply</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"></path></svg>
        <span style="font-size: 16px; font-weight: 500;">Copy</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path></svg>
        <span style="font-size: 16px; font-weight: 500;">Edit</span>
      </div>
      <div style="height: 1px; margin: 6px 12px; background: oklch(0.32 0.045 68 / 0.12);"></div>
      <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.505 0.19 27)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2"></path><path d="M6.5 7 7.5 20a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4L17.5 7"></path></svg>
        <span style="font-size: 16px; font-weight: 500; color: oklch(0.505 0.19 27);">Delete</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
