<!doctype html>
<html>

</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: oklch(0.488 0.124 150); }
    a:hover { color: oklch(0.567 0.142 149.6); }
    .fw { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

</helmet>
<div class="fw" style="position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; background:

       linear-gradient(180deg, oklch(0.973 0.018 85) 0%, oklch(0.955 0.026 83) 52%, oklch(0.948 0.028 82) 100%); color: oklch(0.216 0.007 49); overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 20px 0 20px;">

    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px;">

    <div style="display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 9999px; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); border: 1px solid oklch(0.862 0.013 82 / 0.95); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="oklch(0.488 0.124 150)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-5A8 8 0 1 1 21 11.5z"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 18px; line-height: 24px; font-weight: 600;">No conversations yet</div>
      <div style="font-size: 14px; line-height: 21px; color: oklch(0.444 0.014 65); text-wrap: pretty;">Message a player or start a group for the next trip.</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 9999px; background: linear-gradient(165deg, oklch(0.567 0.142 149.6) 0%, oklch(0.526 0.128 149.8) 100%); color: oklch(0.994 0.006 95); font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.994 0.006 95)" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      New message
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 9999px; background: rgb(244 232 210 / 0.82); backdrop-filter: blur(22px) saturate(190%); -webkit-backdrop-filter: blur(22px) saturate(190%); border: 1px solid oklch(0.862 0.013 82 / 0.95); box-shadow: inset 0 1px 0 rgb(255 248 233 / 0.6), 0 2px 4px oklch(0.18 0.01 60 / 0.07), 0 18px 44px oklch(0.18 0.01 60 / 0.15);">
    <div style="display: flex; align-items: center; justify-content: center; height: 46px; flex-grow: 1; border-radius: 9999px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 46px; flex-grow: 1; border-radius: 9999px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3.5"></path><path d="m5.6 5.6 2.5 2.5"></path><path d="M3 12h3.5"></path><circle cx="12" cy="13" r="5"></circle></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; flex-grow: 2.1; border-radius: 9999px; background: oklch(0.994 0.006 95); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 1px 2px oklch(0.18 0.01 60 / 0.05), 0 4px 10px oklch(0.18 0.01 60 / 0.06);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.488 0.124 150)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-5A8 8 0 1 1 21 11.5z"></path></svg>
      <span style="font-size: 14px; font-weight: 600; color: oklch(0.216 0.007 49);">Messages</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 46px; flex-grow: 1; border-radius: 9999px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 11h18"></path></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 46px; flex-grow: 1; border-radius: 9999px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.535 0.015 70)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
    </div>
  </div>
</div>
