<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: oklch(0.488 0.124 150); }
    a:hover { color: oklch(0.567 0.142 149.6); }
    .fw { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .bub { font-size: 15px; line-height: 22px; }
  </style>
</helmet>
<div class="fw" style="position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; background:
       radial-gradient(132% 92% at 50% -15%, oklch(0.982 0.014 86) 0%, oklch(0.970 0.020 84) 44%, transparent 78%),
       linear-gradient(180deg, oklch(0.973 0.018 85) 0%, oklch(0.955 0.026 83) 52%, oklch(0.948 0.028 82) 100%); color: oklch(0.216 0.007 49); overflow: hidden;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px 16px 16px 16px;">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; margin-bottom: 16px; opacity: 0.32;">
      <div class="bub" style="max-width: 300px; padding: 11px 15px; border-radius: 1.25rem 1.25rem 1.25rem 0.375rem; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%);">My clubs are already in the travel case.</div>
      <span class="mono" style="padding-left: 4px; font-size: 11px; color: oklch(0.535 0.015 70);">9:06 AM</span>
    </div>

    <!-- the held message stays lit; everything else recedes -->
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
      <div class="bub" style="max-width: 300px; padding: 11px 15px; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; background: linear-gradient(165deg, oklch(0.567 0.142 149.6) 0%, oklch(0.526 0.128 149.8) 100%); color: oklch(0.994 0.006 95); box-shadow: inset 0 1px 0 rgb(255 248 233 / 0.6), 0 2px 4px oklch(0.18 0.01 60 / 0.07), 0 18px 44px oklch(0.18 0.01 60 / 0.15);">Great — see you at the bus.</div>
    </div>
  </div>

  <!-- the sheet: four actions, one destructive, thumb-reachable -->
  <div style="padding: 10px 12px 26px 12px; border-radius: 1.75rem 1.75rem 0 0; background: linear-gradient(180deg, oklch(0.989 0.013 87) 0%, oklch(0.980 0.017 86) 100%); border-top: 1px solid oklch(0.862 0.013 82 / 0.95); box-shadow: inset 0 1px 0 rgb(255 248 233 / 0.6), 0 2px 4px oklch(0.18 0.01 60 / 0.07), 0 18px 44px oklch(0.18 0.01 60 / 0.15);">
    <div style="width: 38px; height: 4px; margin: 2px auto 14px auto; border-radius: 9999px; background: oklch(0.862 0.013 82 / 0.95);"></div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"></path></svg>
        <span style="font-size: 16px; font-weight: 500;">Copy</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8V4l-7 7 7 7v-4.1c4.2 0 7.1 1.3 9 4.1-.8-4.2-3.2-8.6-9-9z"></path></svg>
        <span style="font-size: 16px; font-weight: 500;">Reply</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.444 0.014 65)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path></svg>
        <span style="font-size: 16px; font-weight: 500;">Edit</span>
      </div>
      <div style="height: 1px; margin: 6px 12px; background: oklch(0.862 0.013 82 / 0.95);"></div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-radius: 0.875rem;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.505 0.19 27)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2"></path><path d="M6.5 7 7.5 20a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4L17.5 7"></path></svg>
        <span style="font-size: 16px; font-weight: 500; color: oklch(0.505 0.19 27);">Delete</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
