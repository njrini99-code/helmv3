# Changed-path classes for dorny/paths-filter — the ONE copy of these lists.
#
# Read by .github/workflows/detect-changes.yml (the reusable "Detect changes"
# job other workflows call) AND, since 2026-09-23, by each heavy ci.yml job's
# own first steps (`Unit tests`, `Next build`, `Supabase lint + RLS tests`),
# which decide for themselves instead of queueing behind detect-changes for a
# second runner slot. One file, so the two can never disagree about what
# "code" means. Editing this file counts as a code change (it is in `code`).
code:
  - 'src/**'
  - 'supabase/**'
  - 'e2e/**'
  - 'package.json'
  - 'package-lock.json'
  - 'next.config.*'
  - 'tsconfig*.json'
  - 'vitest.config.ts'
  - 'eslint.config.mjs'
  - 'tailwind.config.*'
  - 'postcss.config.*'
  - 'middleware.ts'
  - 'scripts/**/*.ts'
  - 'scripts/**/*.mjs'
  - '.github/workflows/ci.yml'
  - '.github/workflows/detect-changes.yml'
  - '.github/path-filters.yml'
frontend:
  - 'src/**'
  - 'app/**'
  - 'components/**'
  - 'lib/**'
  - 'e2e/**'
  - 'public/**'
  - 'playwright.config.ts'
  - 'package.json'
  - 'package-lock.json'
  - '.github/workflows/ci.yml'
  - '.github/workflows/detect-changes.yml'
  - '.github/workflows/playwright.yml'
  - '.github/path-filters.yml'
e2e:
  - 'src/**'
  - 'e2e/**'
  - 'public/**'
  - 'playwright.config.ts'
  - 'package.json'
  - 'package-lock.json'
  - '.github/workflows/ci.yml'
  - '.github/workflows/detect-changes.yml'
  - '.github/path-filters.yml'
migrations:
  - 'supabase/migrations/**'
python:
  - '**/*.py'
  - 'requirements*.txt'
  - 'pyproject.toml'
actions:
  - '.github/**'
