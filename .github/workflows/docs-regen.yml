name: Docs Regen

# Auto-regenerate inventory sections of memory/glossary.md and
# memory/projects/golfhelm.md from sources of truth (database.ts,
# src/app/ tree, src/hooks/). Opens a follow-up PR with the diff so
# the inventory never rots.
#
# Hand-curated narrative outside AUTOGEN markers is preserved.
#
# SECURITY: zero untrusted user input. The only github.* expression
# in any run: block is github.sha (40-char hex commit ID). All PR
# title/body are static strings or that same SHA. No event.issue/PR/
# comment titles or bodies anywhere.

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/types/database.ts'
      - 'src/app/**/page.tsx'
      - 'src/app/**/page.ts'
      - 'src/app/**/actions/**/*.ts'
      - 'src/hooks/**/*.ts'
      - 'scripts/regen-docs.mjs'
  workflow_dispatch: {}

concurrency:
  group: docs-regen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    name: Regenerate inventory docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Regenerate inventory blocks
        run: node scripts/regen-docs.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet memory/glossary.md memory/projects/golfhelm.md memory/context/golfhelm-database.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Inventory docs already in sync — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Inventory drift detected — opening auto-PR."
            git diff --stat memory/glossary.md memory/projects/golfhelm.md memory/context/golfhelm-database.md
          fi

      - name: Open auto-PR with regenerated inventory
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        env:
          TRIGGER_SHA: ${{ github.sha }}
        with:
          # GITHUB_TOKEN CANNOT MAKE THIS PR GO GREEN ON ITS OWN. GitHub
          # suppresses `pull_request`-triggered workflow runs (ci.yml,
          # review-gate.yml) on any PR whose triggering event was itself
          # caused by the repo's default GITHUB_TOKEN — that is the
          # recursion-prevention rule documented at
          # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow.
          # #1544 and #1552 both sat with zero CI runs because of exactly
          # this: required checks never posted, so `gh pr merge --auto`
          # could never fire.
          #
          # Closing and reopening the PR is NOT a fix here: peter-evans/
          # create-pull-request's own docs list that as a workaround only
          # when done MANUALLY by a human — an automated close/reopen using
          # this same GITHUB_TOKEN identity is still "triggered by
          # GITHUB_TOKEN" and is suppressed the same way the original PR was.
          #
          # The token's own docs name a PAT (or a GitHub App installation
          # token) as the standard fix: a token that is NOT GITHUB_TOKEN
          # doesn't trip the suppression, so `pull_request` runs fire
          # normally. `secrets.REGEN_PR_PAT` is checked first with a
          # fallback to the default token, so nothing here breaks before the
          # secret exists — but until an owner adds a fine-grained PAT (repo
          # scope: contents:write, pull-requests:write) as
          # `REGEN_PR_PAT` in repo settings, this workflow keeps producing
          # PRs that never go green. See docs/CI_RUNBOOK.md for how to
          # rerun/rescue an auto-regen PR by hand in the meantime.
          token: ${{ secrets.REGEN_PR_PAT || secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: regen inventory blocks

            Auto-generated by .github/workflows/docs-regen.yml.
            Sources: src/lib/types/database.ts, src/app/**/page.tsx,
            src/app/**/actions/**/*.ts, src/hooks/**/*.ts.
          branch: docs/auto-regen-inventory
          delete-branch: true
          title: "docs: regen inventory blocks"
          body: |
            ## Auto-generated inventory update

            Triggered by a push to `main` that touched a source of truth
            for the inventory blocks in `memory/glossary.md` and
            `memory/projects/golfhelm.md`.

            **What changed:** the auto-regenerated sections between
            `<!-- AUTOGEN:* -->` markers. Hand-curated narrative outside
            those markers is preserved.

            **What to do:** review the diff. If it looks sane, squash-merge.
            If something looks wrong, the script lives at
            `scripts/regen-docs.mjs`.

            See `.github/workflows/docs-regen.yml` and the
            "Auto-regen inventory docs" section of `CLAUDE.md`.

            🤖 Generated by GitHub Actions
          labels: |
            docs
            automated
          add-paths: |
            memory/glossary.md
            memory/projects/golfhelm.md
            memory/context/golfhelm-database.md
