name: Docs Regen

# Auto-regenerate inventory sections of memory/glossary.md and
# memory/projects/golfhelm.md from sources of truth (database.ts,
# src/app/ tree, src/hooks/). Opens a follow-up PR with the diff so
# the inventory never rots.
#
# Hand-curated narrative outside AUTOGEN markers is preserved.
#
# SECURITY: zero untrusted user input. The only github.* expression
# in any run: block is github.sha (40-char hex commit ID). All PR
# title/body are static strings or that same SHA. No event.issue/PR/
# comment titles or bodies anywhere.

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/types/database.ts'
      - 'src/app/**/page.tsx'
      - 'src/app/**/page.ts'
      - 'src/app/**/actions/**/*.ts'
      - 'src/hooks/**/*.ts'
      - 'scripts/regen-docs.mjs'
  workflow_dispatch: {}

concurrency:
  group: docs-regen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    name: Regenerate inventory docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20

      - name: Regenerate inventory blocks
        run: node scripts/regen-docs.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet memory/glossary.md memory/projects/golfhelm.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Inventory docs already in sync — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Inventory drift detected — opening auto-PR."
            git diff --stat memory/glossary.md memory/projects/golfhelm.md
          fi

      - name: Open auto-PR with regenerated inventory
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725  # v8.0.0
        env:
          TRIGGER_SHA: ${{ github.sha }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: regen inventory blocks

            Auto-generated by .github/workflows/docs-regen.yml.
            Sources: src/lib/types/database.ts, src/app/**/page.tsx,
            src/app/**/actions/**/*.ts, src/hooks/**/*.ts.
          branch: docs/auto-regen-inventory
          delete-branch: true
          title: "docs: regen inventory blocks"
          body: |
            ## Auto-generated inventory update

            Triggered by a push to `main` that touched a source of truth
            for the inventory blocks in `memory/glossary.md` and
            `memory/projects/golfhelm.md`.

            **What changed:** the auto-regenerated sections between
            `<!-- AUTOGEN:* -->` markers. Hand-curated narrative outside
            those markers is preserved.

            **What to do:** review the diff. If it looks sane, squash-merge.
            If something looks wrong, the script lives at
            `scripts/regen-docs.mjs`.

            See `.github/workflows/docs-regen.yml` and the
            "Auto-regen inventory docs" section of `CLAUDE.md`.

            🤖 Generated by GitHub Actions
          labels: |
            docs
            automated
          add-paths: |
            memory/glossary.md
            memory/projects/golfhelm.md
