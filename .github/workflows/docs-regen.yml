name: Docs Regen
# VERIFICATION ONLY as of 2026-08-29. This workflow no longer opens PRs.
#
# WHAT IT USED TO DO, AND WHY THAT WAS A CONTROL-PLANE LEAK
#
# It regenerated the inventory blocks on every push to main and opened a
# FOLLOW-UP PR with the diff. Two things went wrong with that shape:
#
#   1. `created != integrated`. #1623 sat open while main carried a stale route
#      count (234 vs the real 235, after /admin/self-heal shipped). The
#      correction existed; nothing merged it.
#   2. This file's own former header recorded that PRs created with
#      GITHUB_TOKEN may receive no required CI — so the follow-up PR could not
#      be merged confidently even by someone who noticed it.
#
# Drift is now a REQUIRED PR-time check (`Generated inventory is current` in
# ci.yml, running `npm run docs:inventory-check`). A source change and its
# generated truth land in the same PR, which is where they belong.
#
# This job remains as a backstop for anything that reached main without that
# gate. It FAILS LOUDLY and creates nothing.
#
# SECURITY: no untrusted input; no write permissions; no PR creation.
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/types/database.ts'
      - 'src/app/**/page.tsx'
      - 'src/app/**/page.ts'
      - 'src/app/**/actions/**/*.ts'
      - 'src/hooks/**/*.ts'
      - 'scripts/regen-docs.mjs'
      - 'memory/glossary.md'
      - 'memory/projects/golfhelm.md'
      - 'memory/context/golfhelm-database.md'
  workflow_dispatch: {}
concurrency:
  group: docs-regen-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    name: Generated inventory is current (main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-mutating. Leaves the tree byte-identical and exits non-zero on drift.
      - name: Verify generated inventory
        run: npm run docs:inventory-check
