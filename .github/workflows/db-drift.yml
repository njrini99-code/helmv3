name: Database drift (production)

# Production drift is not something a pull request introduces, so this is
# scheduled rather than per-PR — a PR-blocking job here would fail for reasons
# the PR author cannot fix, which is how a red check becomes background noise.
#
# The CI `supabase` job already runs the SAME invariants against a stack rebuilt
# from migrations on every code PR. That answers "do the migrations produce a
# correct schema". This answers the different question: "has production drifted
# away from what the migrations describe" — the failure mode that motivated the
# script, where production and the migration ledger disagree.
#
# CREDENTIALS. Reaching production Postgres directly needs DATABASE_URL or
# SUPABASE_DB_PASSWORD, and neither exists as a repo secret. SUPABASE_ACCESS_TOKEN
# does, and it authenticates the Supabase Management API, which can run SQL — so
# the script speaks that transport too. Every statement it sends is asserted
# read-only before transmission (see createManagementApiSql and its test).

on:
  schedule:
    # 07:00 UTC daily — after the Monday 06:00 CircleCI weekly window, so a
    # drift failure is not competing for attention with the heavy jobs.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Read-only guard; no write scope needed anywhere.
permissions:
  contents: read

concurrency:
  group: db-drift-production
  cancel-in-progress: false

jobs:
  drift:
    name: Production schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail-closed: the script exits 2 when it cannot reach a database, and
      # exit 2 fails this step. A drift guard that goes green without reaching
      # production is the false-green shape `check:types-drift` already has, and
      # this workflow exists precisely to avoid adding another.
      - name: Check production schema invariants
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: npm run db:drift:check
