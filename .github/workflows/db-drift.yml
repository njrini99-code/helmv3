name: Database drift (production)

# Production drift is not something a pull request introduces, so this is
# scheduled rather than per-PR — a PR-blocking job here would fail for reasons
# the PR author cannot fix, which is how a red check becomes background noise.
#
# The CI `supabase` job already runs the SAME invariants against a stack rebuilt
# from migrations on every code PR. That answers "do the migrations produce a
# correct schema". This answers the different question: "has production drifted
# away from what the migrations describe" — the failure mode that motivated the
# script, where production and the migration ledger disagree.
#
# CREDENTIALS. Reaching production Postgres directly needs DATABASE_URL or
# SUPABASE_DB_PASSWORD, and neither exists as a repo secret. SUPABASE_ACCESS_TOKEN
# does, and it authenticates the Supabase Management API, which can run SQL — so
# the script speaks that transport too. Every statement it sends is asserted
# read-only before transmission (see createManagementApiSql and its test).

on:
  schedule:
    # 07:10 UTC daily — after the Monday 06:00 CircleCI weekly window, so a
    # drift failure is not competing for attention with the heavy jobs, and
    # offset 10 minutes past the hour so it no longer lands in the same
    # minute as the Vercel `integrity-check` cron (`0 7 * * *`) — the 2026-09-06
    # scheduler audit found the two 07:00 production health checks colliding.
    - cron: '10 7 * * *'
  workflow_dispatch:

# Read-only against the DATABASE (only SELECTs ever cross the wire). `issues:
# write` is needed only to open/update the alert issue on failure — nothing
# here writes to the repo's code or touches a PR.
permissions:
  contents: read
  issues: write

concurrency:
  group: db-drift-production
  cancel-in-progress: false

jobs:
  drift:
    name: Production schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail-closed: the script exits 2 when it cannot reach a database, and
      # exit 2 fails this step. A drift guard that goes green without reaching
      # production is the false-green shape `check:types-drift` already has, and
      # this workflow exists precisely to avoid adding another.
      - name: Check production schema invariants
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -o pipefail
          npm run db:drift:check 2>&1 | tee "$RUNNER_TEMP/drift-check.log"

      # D4 second check (db-tooling-drift): object-level drift between the
      # ledger and the live catalog — a version can be "applied" on both
      # sides while the table/function/policy it claims to create is
      # missing. Same read-only transport, same secrets, no new credential.
      - name: Check ledger objects against the live catalog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -o pipefail
          npm run db:ledger-vs-catalog 2>&1 | tee "$RUNNER_TEMP/drift-ledger.log"

      # Alert the owner within the hour of a failure above, instead of
      # waiting for someone to notice a red scheduled run. Two channels,
      # both owner-only, never customer mail:
      #   1. a GitHub issue, opened once and then commented on for repeat
      #      failures rather than duplicated every day
      #   2. one email through the SAME ops-digest transport/env-vars as
      #      src/lib/admin/digest/transport.ts (OPS_DIGEST_RESEND_API_KEY,
      #      OPS_DIGEST_TO) — skipped without failing the workflow if those
      #      secrets are not configured in this repo's Actions, in which
      #      case the issue is the alert of record.
      #
      # ONE ALERT PER DISTINCT FAILURE, NOT PER RUN. The check stays red every
      # day until a known gap is fixed, and it used to comment (and email) on
      # every run: by 2026-09-23 issue #1897 held 18 byte-identical comments
      # for one gap that HELD.md had tracked since 2026-09-05. The failing
      # lines (each "❌" line, its detail line, and each missing-object line)
      # are hashed into a signature; an alert whose signature is already on
      # the open issue is skipped. A NEW or CHANGED failure still alerts on
      # both channels, and the run itself stays red either way.
      - name: Compute the failure signature
        id: signature
        if: failure()
        run: |
          set -euo pipefail
          failing="$(cat "$RUNNER_TEMP"/drift-*.log 2>/dev/null | awk '/^❌/ {print; grab=1; next} grab && /^   / {print; grab=0; next} {grab=0} /^   \[/ {print}' || true)"
          if [ -z "$failing" ]; then
            failing="no failing invariant printed (unreachable database or a crashed check)"
          fi
          signature="$(printf '%s' "$failing" | sha256sum | cut -c1-16)"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          {
            echo 'failing<<DRIFT_EOF'
            printf '%s\n' "$failing"
            echo 'DRIFT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the db-drift alert issue
        id: alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIGNATURE: ${{ steps.signature.outputs.signature }}
          FAILING: ${{ steps.signature.outputs.failing }}
        run: |
          set -euo pipefail
          gh label create db-drift --description "Automated production database drift/advisor alerts" --color B60205 --force >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label db-drift --state open --json number --jq '.[0].number // empty')"
          marker="<!-- db-drift-signature: ${SIGNATURE} -->"
          if [ -n "$existing" ]; then
            seen="$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments --jq '[.body, .comments[].body] | map(select(contains("'"$marker"'"))) | length')"
            if [ "$seen" != "0" ]; then
              echo "Failure signature ${SIGNATURE} is already on issue #${existing}; not alerting again."
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          body="A scheduled Database drift check step failed.

          Run: ${RUN_URL}

          Failing invariants:

          \`\`\`
          ${FAILING}
          \`\`\`

          Later runs with this same failure do not comment again; a new or changed failure does.

          ${marker}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Database drift check failing" --label db-drift --body "$body"
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Email the owner
        if: failure() && steps.alert.outputs.new != 'false'
        env:
          OPS_DIGEST_RESEND_API_KEY: ${{ secrets.OPS_DIGEST_RESEND_API_KEY }}
          OPS_DIGEST_TO: ${{ secrets.OPS_DIGEST_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/db/notify-drift.mjs "Database drift check failing" "A scheduled Database drift check step failed. Run: ${RUN_URL}"
