name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database types are up to date
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # Generate fresh types to a temp file (override the redirect in package.json)
          npx supabase gen types typescript --project-id $SUPABASE_PROJECT_ID > /tmp/generated-types.ts 2>&1 || {
            echo "⚠️  Could not generate types (project ID may be missing or invalid)"
            exit 0  # Don't fail CI if we can't verify
          }
          
          # Compare with committed version (if types file exists)
          if [ -f src/lib/types/database.ts ]; then
            if ! diff -q src/lib/types/database.ts /tmp/generated-types.ts > /dev/null 2>&1; then
              echo "❌ Database types are out of date!"
              echo "Run 'SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID }} npm run db:types' to regenerate"
              echo ""
              echo "Diff preview:"
              diff src/lib/types/database.ts /tmp/generated-types.ts | head -50 || true
              exit 1
            else
              echo "✅ Database types are up to date"
            fi
          else
            echo "⚠️  Warning: database.ts file not found"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
