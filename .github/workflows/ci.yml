name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  gate-map:
    name: Gate map
    runs-on: ubuntu-latest
    steps:
      - name: Write CI summary
        run: |
          {
            echo "## Helm CI Gate Map"
            echo ""
            echo "- Hard/advisory gate matrix: \`docs/operations/GATE_MATRIX.md\`"
            echo "- CI triage runbook: \`docs/operations/CI_RUNBOOK.md\`"
            echo "- Branch protection checklist: \`docs/operations/BRANCH_PROTECTION.md\`"
            echo "- Current repo operating system: \`docs/current/operating-system.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

  db-types:
    name: Database types drift
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated database types
        run: npm run check:types-drift

  schema-invariants:
    name: Schema invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check schema invariants
        run: ./scripts/check-schema-invariants.sh

  knowledge-check:
    name: Feature knowledge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check feature knowledge routing
        run: npm run knowledge:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  lint-ratchet:
    name: Lint ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check warning baseline
        run: |
          set -o pipefail
          npm run lint:ratchet 2>&1 | tee lint-ratchet-report.txt

      - name: Upload lint ratchet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-ratchet-report
          path: lint-ratchet-report.txt
          retention-days: 14

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit test lane
        run: npm run test:run

  build:
    name: Next build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  supabase-rls:
    name: Supabase lint + RLS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Upload Supabase logs on startup failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: supabase-startup-logs
          path: |
            supabase/.branches/**/logs/**
            supabase/.temp/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Lint migrations
        run: supabase db lint --schema public

      - name: Run pgTAP RLS suites
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          shopt -s nullglob
          rls_files=(supabase/tests/rls/*.sql)
          if [ "${#rls_files[@]}" -eq 0 ]; then
            echo "::error::No RLS test files found in supabase/tests/rls"
            exit 1
          fi
          for f in "${rls_files[@]}"; do
            case "$f" in
              */_helpers.sql) continue ;;
            esac
            echo "::group::$f"
            tmp_file="$tmp_dir/$(basename "$f")"
            {
              cat supabase/tests/rls/_helpers.sql
              grep -Ev '^\\i(r)? .*_helpers\.sql$' "$f"
            } > "$tmp_file"
            supabase test db "$tmp_file"
            echo "::endgroup::"
          done

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

  all:
    name: all
    runs-on: ubuntu-latest
    needs:
      - db-types
      - schema-invariants
      - knowledge-check
      - typecheck
      - lint
      - lint-ratchet
      - unit-tests
      - build
      - supabase-rls
    if: always()
    steps:
      - name: Check required CI jobs
        run: |
          test "${{ needs.db-types.result }}" = "success"
          test "${{ needs.schema-invariants.result }}" = "success"
          test "${{ needs.knowledge-check.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.lint-ratchet.result }}" = "success"
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.supabase-rls.result }}" = "success"
          echo "All required CI jobs passed."
