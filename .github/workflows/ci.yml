name: CI

on:
  # merge_group: required for GitHub's merge queue — a queued merge re-runs
  # these checks on the speculative merge result; without this trigger the
  # queue waits forever for contexts that never arrive and every merge times out.
  merge_group:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Per-COMMIT groups on main (playwright.yml's pattern): two merges landing
  # seconds apart used to cancel the first commit's suite mid-flight, and the
  # always()-running aggregate then FAILED on its cancelled needs — every
  # stacked merge painted a red X on a superseded main commit (owner report
  # 2026-08-20 22:15). On PR branches the old behavior stands: a new push
  # supersedes the previous run.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Fall back to a valid-format DUMMY on secretless runs (Dependabot / fork PRs
  # get no repo secrets). It only needs to be non-empty and NOT match
  # `placeholder.supabase.co` so the Supabase client guard doesn't throw — then
  # Next's cookies()->dynamic detection excludes auth/dashboard pages from
  # prerender, so the build makes no network call to it. Real PRs still use the
  # real secret; the dummy is never used at runtime.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  detect-changes:
    name: Detect code-relevant paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths (fail closed to code=true)
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Non-PR events (push to main) always run the full suite.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "non-PR event -> full suite"; exit 0
          fi
          # FAIL CLOSED (e3's criterion): any inability to classify the diff
          # resolves to code=true. A misclassified docs PR wastes one suite; a
          # misclassified code PR ships ungated — so uncertainty must be code.
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "missing base/head sha -> code (fail closed)"; exit 0
          fi
          if ! changed="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA")"; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "git diff failed -> code (fail closed)"; exit 0
          fi
          if [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "empty diff -> code (fail closed)"; exit 0
          fi
          # docs-only = EVERY changed file is under docs/ or ends in .md. If ANY
          # file is outside that set the whole PR is code. Deliberately NARROW:
          # config (ci.yml, settings.json, package.json, migrations, *.yml) is
          # NOT docs-only — it can break the build, so it runs the full suite.
          # Count files that are NOT docs/markdown. Count-based (not grep -q)
          # so the classification is identical on GNU and BSD grep and testable
          # locally. Defaults to 1 (=> code) if the count is somehow empty.
          nondoc="$(echo "$changed" | grep -cvE '^docs/|\.md$' || true)"
          if [ "${nondoc:-1}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "code-relevant paths changed ($nondoc) -> full suite"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "docs/markdown-only diff -> heavy jobs skip"
          fi
          echo "--- changed files ---"; echo "$changed"

  database-types:
    name: Database types drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database types are up to date
        run: npm run check:types-drift

  schema-invariants:
    name: Schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check schema invariants
        run: ./scripts/check-schema-invariants.sh

      # Catches `.limit(N > 1000)` including behind a named constant, which the
      # ast-grep rule cannot see through — that is exactly where the live
      # shot-drivers truncation hid (SHOT_DRIVERS_FETCH_CAP = 25000).
      - name: Check PostgREST row caps
        run: node scripts/check-row-cap-limits.mjs

  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A DEDICATED job, not a step inside another one. These checks were first
    # added under "Feature knowledge", where a control-plane failure would have
    # surfaced under someone else's name — the same mislabeled-signal class as a
    # guard timeout rendering as "GlassCard import exists". A control that
    # reports under the wrong name is a control you will misread.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GENERATED INVENTORY DRIFT — a required PR-time gate as of 2026-08-29.
      #
      # Before this, drift was caught by a scheduled workflow that opened a
      # FOLLOW-UP PR (#1623 sat open while main carried a stale route count),
      # and that workflow's own header records that PRs created with
      # GITHUB_TOKEN may receive no required CI. `created != integrated` is the
      # same class of control this repo keeps finding does not actually run.
      #
      # --check is NON-MUTATING: it computes the expected blocks and compares,
      # leaving the tree byte-identical. The previous `docs:regen && git diff`
      # shape could only tell you the docs were stale by first making them
      # correct, which is unusable as a gate.
      - name: Generated inventory is current
        run: npm run docs:inventory-check

      # REPO-WIDE STATIC GUARDS, with honest outcomes.
      #
      # These ran inside the `unit` project until 2026-08-29, where a sweep that
      # timed out was reported using the same shape as a failed assertion — CI
      # printed red against "no imports of GlassCard ... remain in src" when the
      # guard had never finished asking. The runner distinguishes:
      #   exit 0  PASS
      #   exit 1  POLICY_FAILURE          ran, found violations
      #   exit 2  INFRASTRUCTURE_FAILURE  did not finish — UNKNOWN, not a pass
      - name: Repo-wide static guards
        run: npm run guards

      # THE CONTROL PLANE VERIFIES THE CONTROL PLANE.
      #
      # Static mode only: no user-global config, no network beyond gh, no
      # machine-specific state. READ-ONLY by construction — it regenerates
      # nothing and deletes nothing, so it can report what is wrong instead of
      # quietly fixing it.
      #
      #   exit 0  VERIFIED
      #   exit 1  CONTROL FAILURE   a control that should hold does not
      #   exit 2  UNKNOWN           a required state could not be established
      #
      # UNKNOWN never becomes PASS. Every control this repo lost was lost by
      # being assumed rather than checked.
      - name: Control plane
        run: npm run control-plane:verify:static

  feature-knowledge:
    name: Feature knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check feature knowledge registry
        run: npm run knowledge:check

      # Fails when memory/**, CLAUDE.md, AGENTS.md or .claude/rules/* name a
      # golf_*/baseball_* database object that does not exist in
      # src/lib/types/database.ts.
      #
      # This runs HERE, on the per-PR fast path, on purpose, and it covers a
      # class the inventory check cannot: the inventory check compares the
      # generator to its own output, reads only AUTOGEN blocks, and covers 3
      # files. This one reads the whole knowledge base against the live schema. An audit on 2026-08-19 found
      # 59 identifiers documented as live tables — with columns, FKs and RLS
      # policy names — that returned absent from every catalog in production.
      # Sessions are ordered by CLAUDE.md to read those docs before writing
      # code, so a wrong doc becomes wrong code with no signal in between.
      - name: Check knowledge base against the schema
        run: npm run docs:schema-drift

      # Fails when a navigation doc names a file path that does not resolve.
      # An audit on 2026-08-20 found 47 dead paths across memory/**,
      # .claude/rules/**, CLAUDE.md, AGENTS.md and docs/REPO_MAP.md — components,
      # hooks and tests that moved or were deleted while the docs naming them
      # were not. Those docs read as inventories, so a session treats a dead path
      # as "where the code lives", fails to find it, and either invents a
      # replacement or concludes the feature is missing. Both are confident and
      # wrong.
      - name: Check navigation docs for dead file paths
        run: npm run docs:path-drift

      # The feature router (memory/registry.yml) gates governed edits, but
      # path-drift scans only .md files and skips globs — so the one map the
      # edit gate consults was the one map no gate checked. Fails on any
      # registry entry that resolves to nothing; baseline is ZERO.
      - name: Check the feature router against the tree
        run: npm run knowledge:globs

  # Helm Bridge integration env drift.
  #
  # Runs in --drift mode, which is a no-op while NONE of these secrets are
  # provisioned (CI's situation today) and becomes a hard failure the moment
  # SOME are set and a sibling goes missing. That asymmetry is the point: a
  # partially-configured Bridge degrades SILENTLY — blank panels, and edge
  # errors that never reach admin_events because INTERNAL_LOG_KEY is unset —
  # so a rotated or dropped var otherwise surfaces only during a real
  # incident, which is the worst possible time to discover it.
  #
  # Wiring the secrets into this repo later needs no change here: the job
  # starts enforcing on its own as soon as any one of them exists.
  bridge-env:
    name: Bridge env drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Helm Bridge integration env
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          INTERNAL_LOG_KEY: ${{ secrets.INTERNAL_LOG_KEY }}
        run: node scripts/check-helm-bridge-env.mjs --drift

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # supabase/functions/ is EXCLUDED from tsconfig.json, so `npm run typecheck`
    # has never covered these three Deno edge functions. They are deployed code
    # that sends push notifications and email; until 2026-08-19 nothing checked
    # them at all. The first run of this gate found a real type error in
    # send-fcm-push (crypto.subtle.importKey rejecting a widened Uint8Array).
    #
    # The npm script uses --node-modules-dir=none deliberately. With `auto`,
    # deno resolves npm deps itself and REWRITES node_modules — locally that
    # silently bumped stripe 22.3.2 -> 22.5.0, whose pinned API-version type no
    # longer matched src/lib/stripe/server.ts, so `npm run typecheck` started
    # failing on a file nobody had touched. A type gate must not mutate the
    # tree it is checking.
    #
    # It also passes --minimum-dependency-age=120 (minutes). Deno's default
    # 24h supply-chain age policy failed this job on 2026-08-21 when rollup
    # published 4.62.5 upstream — a red CI day for a docs-only merge, with no
    # code change on our side. 2h keeps the protection against
    # just-published/compromised versions without a day-long outage every
    # time a floating transitive dep ships a release. Owner decision
    # 2026-08-21.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        run: npm run typecheck:functions

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  lint-ratchet:
    name: Lint ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The four ratchet steps below carry continue-on-error so that ONE
      # failure can't mask the others — on 2026-08-18 a stale Supabase
      # baseline hid a fail-open regression for a full CI cycle because the
      # steps ran sequentially and the later ones never ran. Each step still
      # records its real outcome; the aggregator at the end fails the job if
      # ANY ratchet failed, so nothing gets weaker — every failure now just
      # surfaces in the same run.
      - name: Lint ratchet
        id: ratchet_lint
        continue-on-error: true
        run: npm run lint:ratchet

      # A failed Supabase read must not render as an empty one. supabase-js
      # RESOLVES errors as { data: null, error } rather than throwing, so
      # `const { data } = await ...` turns an outage into "no team", "no
      # entries yet", a 404, or a leaderboard with no scores. 15 instances of
      # that were fixed on 2026-08-07 across 12 files.
      #
      # This fails only if the count goes UP, so it blocks new ones without
      # demanding the existing backlog be paid off first.
      - name: Unchecked Supabase reads (ratchet)
        id: ratchet_supabase
        continue-on-error: true
        run: npm run audit:supabase-errors

      # Counts guards whose "the read failed" answer is the same value as their
      # "allow" answer. Three of those shipped before this gate existed, and the
      # unchecked-read ratchet above could not see any of them — all three bound
      # their error correctly and then answered it permissively.
      - name: Fail-open guards (ratchet)
        id: ratchet_failopen
        continue-on-error: true
        run: npm run audit:fail-open

      - name: Unchecked paginated reads (ratchet)
        id: ratchet_paginated
        continue-on-error: true
        run: npm run audit:paginated-reads

      # Duplicate exports had a committed baseline (.duplicate-exports-baseline.json,
      # 27 grandfathered) and a process.exit(1) on anything new — but NO job ran it,
      # so the ratchet could never ratchet and new duplicates landed silently. A
      # baseline nothing compares against is a green that means nothing.
      - name: Duplicate exports (ratchet)
        id: ratchet_dupexports
        continue-on-error: true
        run: npm run lint:duplicate-exports

      - name: Ratchet aggregate (fails if any ratchet failed)
        if: always()
        env:
          O_LINT: ${{ steps.ratchet_lint.outcome }}
          O_SUPABASE: ${{ steps.ratchet_supabase.outcome }}
          O_FAILOPEN: ${{ steps.ratchet_failopen.outcome }}
          O_PAGINATED: ${{ steps.ratchet_paginated.outcome }}
          O_DUPEXPORTS: ${{ steps.ratchet_dupexports.outcome }}
        run: |
          bad=0
          for pair in "lint:$O_LINT" "supabase:$O_SUPABASE" "fail-open:$O_FAILOPEN" "paginated:$O_PAGINATED" "duplicate-exports:$O_DUPEXPORTS"; do
            name="${pair%%:*}"; outcome="${pair#*:}"
            echo "ratchet $name -> $outcome"
            if [ "$outcome" != "success" ]; then bad=1; fi
          done
          exit "$bad"

  unit-tests:
    name: Unit tests
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sharded because the suite is runner-bound, not config-bound: 8,657 tests
    # take ~2.4 min on a 10-core laptop and ~13.9 min on a 4-core hosted runner.
    # `npm ci` is only ~1.2 min of that, so installs are not the lever — cores
    # are. Three shards keeps total runner minutes roughly flat while cutting
    # this job's wall clock from ~15.5 min to ~6.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (shard ${{ matrix.shard }}/3)
        run: npm run test:run -- --shard=${{ matrix.shard }}/3

      # The `integration` project ran in no job of its own. It was still being
      # executed — but only by accident, because `--project business` matched
      # ~870 files instead of its 7 (see the note in vitest.config.ts). Once
      # that project actually filters, this step is what keeps
      # coach-onboarding-staff-row and player-access-action-gate — the auth and
      # access-control tests — running at all.
      - name: Integration tests
        if: matrix.shard == 1
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # The same unit suite, run at a FAR timezone offset.
  #
  # WHY THIS IS NOT HYGIENE. On 2026-07-29 `main` went red at 8pm EDT because two
  # "today" fixtures were anchored to the UTC date while the code under test used a
  # local/team date (#1123). Sweeping for the class found exactly two
  # offset-dependent files in 8,514 tests — and the second one proved the sharper
  # point. Re-injecting the ORIGINAL React #418 hydration bug that
  # `FairwayAgendaView` was hardened against gives:
  #
  #     TZ=America/New_York    -> 4 passed   <- the bug is INVISIBLE
  #     TZ=Pacific/Kiritimati  -> 1 failed
  #     TZ=Asia/Tokyo          -> 1 failed
  #
  # CI runs at UTC, where midday-ET fixtures land on the same calendar day, so that
  # guard was DORMANT: it could not catch the regression it exists to prevent.
  # This job is what wakes it up.
  #
  # WHY A MATRIX OF BOTH EXTREMES. Each caught a different subset — UTC-11 broke one
  # assertion in stage-history-format, UTC+14 broke the other two plus both agenda
  # cases. One offset is enough to detect the class in principle; two is cheap
  # insurance against a fixture that only slips in one direction.
  #
  # COST: runner minutes, not wall-clock — GHA runs these in parallel with the
  # other jobs, so a green PR is not slower. Rejected alternative: banning
  # `toISOString().slice(0, 10)`. There are 216 call sites and most are legitimate
  # (formatting an already-stored date, or intentionally UTC), so a blanket rule
  # would be noise. Running at a shifted offset catches the class regardless of
  # which API produced the date.
  #
  # Verified clean at BOTH offsets on c2ea35695 before this job was added:
  # 892 files / 8,514 tests, identical to the UTC run.
  # ---------------------------------------------------------------------------
  unit-tests-timezone:
    name: Unit tests (shifted timezone)
    # PUSH/MAIN ONLY (owner 2026-08-20, PR throughput): this 2-tz x 3-shard
    # matrix added 6 jobs to every PR and was the dominant PR-time cost. It now
    # runs on push to main only; timezone regressions are caught post-merge
    # (with fast rollback) rather than pre-merge. Revert this `if` to restore the
    # pre-merge gate — see the CI-aggregate note about incident #1123.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Pacific/Kiritimati  # UTC+14, the furthest ahead of UTC
          - Pacific/Midway      # UTC-11, the furthest behind
        # Sharded for the same reason as unit-tests. Unsharded, this job would
        # become the critical path the moment the others got faster.
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests at ${{ matrix.tz }} (shard ${{ matrix.shard }}/3)
        env:
          TZ: ${{ matrix.tz }}
        run: |
          echo "Runner offset: $(date +%z)  ($(date))"
          npm run test:run -- --shard=${{ matrix.shard }}/3

  business-contracts:
    name: Business contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Business contracts
        run: npm run verify:business

  next-build:
    name: Next build
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `next build --webpack` keeps its incremental compilation cache in
      # .next/cache. Only the Playwright browser cache existed before, so every
      # build was cold. Keyed on the lockfile plus source, with a lockfile-only
      # restore-key so a source change still warm-starts.
      - name: Cache Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-build-${{ runner.os }}-

      - name: Build
        run: npm run build

  supabase:
    name: Supabase lint + RLS tests
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_ID: helmv3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.114.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Lint migrations
        run: supabase db lint --schema public

      # Schema invariants, run against the stack this job just rebuilt FROM
      # MIGRATIONS. `db:drift:check` existed in package.json with no workflow
      # caller since it was written — a script nothing invokes is not a gate,
      # which `.claude/rules/quality-gates.md` names explicitly.
      #
      # WHAT THIS DOES AND DOES NOT PROVE. The script's own header frames these
      # as production-correctness invariants, and against production it would
      # answer "has production drifted". It cannot ask that here: the check needs
      # DATABASE_URL or SUPABASE_DB_PASSWORD, and neither exists as a repo secret
      # (verified 2026-08-27 — Actions holds ACCESS_TOKEN, SERVICE_ROLE_KEY,
      # PROJECT_ID, ANON_KEY and no database password).
      #
      # Pointed at the local stack it answers a different and still valuable
      # question: do the migrations, replayed from scratch, produce a schema that
      # satisfies all 12 invariants? Every one of them encodes a real past
      # production defect (#651 missing Baseball columns, #728/#887 stale stat
      # aliases, #732 a phantom rate_limits table, admin rollup gates that must
      # check is_super_admin). This catches a migration that reintroduces one
      # before it is ever applied anywhere.
      #
      # To ALSO gate production drift, add a SUPABASE_DB_PASSWORD repo secret and
      # a second scheduled job — deliberately not per-PR, since production drift
      # is not something a pull request introduces.
      #
      # Fail-closed: exit 2 is "could not connect", and it fails this step rather
      # than passing quietly. A drift guard that goes green when it never reached
      # a database is the exact false-green shape check:types-drift already has.
      - name: Schema invariants (migrations rebuild)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run db:drift:check

      - name: Run pgTAP RLS suites
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          for f in supabase/tests/rls/*.sql; do
            case "$f" in
              */_helpers.sql) continue ;;
            esac
            echo "::group::$f"
            tmp_file="$tmp_dir/$(basename "$f")"
            {
              cat supabase/tests/rls/_helpers.sql
              grep -Ev '^\\i(r)? .*_helpers\.sql$' "$f"
            } > "$tmp_file"
            supabase test db "$tmp_file"
            echo "::endgroup::"
          done

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

  route-hygiene:
    name: Route Hygiene P0/P1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check route hygiene blockers
        run: |
          npm run ui:routes
          npm run routes:hygiene:p0p1

  import-cycles:
    name: Import-cycle ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Value-level import cycles typecheck and build cleanly but can crash at
      # cold runtime (TDZ) — the #803/#804 prod-crash class. Baseline-aware:
      # fails only on cycles not in .cycles-baseline.json.
      - name: Check for new runtime import cycles
        run: npm run check:cycles

  baseball-auth-smoke:
    name: BaseballHelm authenticated smoke
    needs: detect-changes
    # PUSH/MAIN ONLY (owner 2026-08-26, PR throughput): removed from the PR
    # gate after it blocked a golf production hotfix twice in one afternoon —
    # both times the runner died ("shutdown signal") during the TypeScript
    # step of this job's in-job build, before a single test ran. Same
    # mechanism as unit-tests-timezone: it now runs on push to main only, so
    # a baseball smoke regression is caught post-merge (blocking the next
    # promote) instead of gating every PR. To restore the pre-merge gate,
    # revert this `if` AND re-add `- baseball-auth-smoke` to the CI-aggregate
    # `needs` list.
    if: github.event_name == 'push' && needs.detect-changes.outputs.code == 'true'
    # #372: promotes the already-built, already-mandatory baseball-smoke +
    # onboarding-smoke specs (e2e/baseball-smoke.spec.ts,
    # e2e/baseball-onboarding-smoke.spec.ts) from push/workflow_dispatch-only
    # (.github/workflows/playwright.yml's `e2e` job) into a required PR gate —
    # the same mechanism that promoted Supabase RLS tests into `all` (#517)
    # and the import-cycle ratchet (#808).
    #
    # ── 2026-07-30: THIS JOB NO LONGER TOUCHES PRODUCTION ──────────────────
    # It used to run `npm run seed:baseball:ci` with the production Supabase URL
    # and service-role key in its env, on every pull request. It now stands up a
    # throwaway Supabase stack on the runner
    # (.github/actions/local-supabase-stack) and seeds that instead.
    #
    # Three consequences worth knowing:
    #
    # 1. NO SECRETS ARE NEEDED, so the readiness-check / fail-loud steps that
    #    used to sit here are gone, and the fork + Dependabot `if:` skip went
    #    with them. That skip existed only because external PRs "structurally
    #    cannot supply these secrets" — with the secrets gone the reason is gone,
    #    and a required gate that silently skips on forks was a hole in it.
    #
    # 2. THE STEP ORDER MATTERS. `supabase start` must run BEFORE `npm run
    #    build`, because Next.js inlines NEXT_PUBLIC_* at build time — a build
    #    made before the local URL exists would ship the old value into the
    #    client bundle and the smoke run would authenticate against it.
    #
    # 3. IT TESTS THIS PR'S SCHEMA, not production's. `supabase start` applies
    #    everything under supabase/migrations/, so a migration that breaks a
    #    smoke path now fails on the PR that introduces it.
    #
    # COST NOTE: this doubles Playwright-browser-install + a full `npm run
    # build` on every PR, on top of the existing next-build / Smoke-checks
    # builds, and adds ~1-2min of `supabase start` — a real, ongoing CI-minutes
    # tradeoff. Revisit if PR wall-clock time becomes a problem.
    runs-on: ubuntu-latest
    # 45, not 30. Measured on this branch: a CLEAN run is ~17 min (supabase start
    # ~1m45s, build ~9-10 min under container contention, seed ~1 min, the smoke
    # itself ~1m30s). A run where the smoke FAILS costs ~24 min, because every spec
    # retries twice — which left only ~6 min of head-room against 30.
    #
    # That head-room is what produces a diagnosable failure. When the JOB timeout
    # fires first, GitHub cancels the job outright and the `if: always()`
    # report-upload step never runs: exactly how #953 produced three consecutive
    # `cancelled` runs with nothing to debug from (see the note in
    # playwright.yml's `e2e` job). A red run that uploads its Playwright report is
    # worth far more than a cancelled one that finishes 15 minutes sooner.
    timeout-minutes: 45
    env:
      # NOT secrets, and deliberately not read from any. The seed script creates
      # exactly these two accounts on the local stack with exactly these values
      # (scripts/seed-baseball-demo.ts — DEMO_COACH_EMAIL / DEMO_PLAYER_EMAIL /
      # DEMO_PASSWORD, whose own header names this as the intended wiring). They
      # are credentials for a database that is destroyed when the job ends.
      E2E_BASEBALL_COACH_EMAIL: demo-coach@baseballhelmdemo.com
      E2E_BASEBALL_COACH_PASSWORD: BaseballDemo2026
      E2E_BASEBALL_PLAYER_EMAIL: demo-player@baseballhelmdemo.com
      E2E_BASEBALL_PLAYER_PASSWORD: BaseballDemo2026
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything below this point talks to the runner's own Postgres. See the
      # action for why, and for the loopback assertion it ends with.
      - name: Start local Supabase stack
        uses: ./.github/actions/local-supabase-stack

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # MUST come after the stack is up: Next.js inlines NEXT_PUBLIC_* into the
      # client bundle at build time, so building first would bake in whatever the
      # env held before the local URL existed.
      # Separate cache prefix from next-build ON PURPOSE. This build runs after
      # the local Supabase stack is up and inlines DIFFERENT NEXT_PUBLIC_*
      # values, so the two must not share a cache entry.
      - name: Cache Next build (smoke)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-smoke-${{ runner.os }}-

      - name: Build (so dev server boots fast)
        run: npm run build

      # No --allow-prod (see package.json). Against a loopback URL the target
      # guard allows the write with no flag; if production credentials ever leak
      # back into this job's env, the guard refuses instead of seeding prod.
      - name: Seed BaseballHelm CI accounts into the local stack
        run: npm run seed:baseball:ci

      - name: Run BaseballHelm mandatory smoke (blocking)
        run: |
          npx playwright test \
            --project=chromium \
            --project=baseball-coach \
            --project=baseball-player \
            e2e/baseball-onboarding-smoke.spec.ts \
            e2e/baseball-smoke.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseball-auth-smoke-playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

  all:
    # Renamed from the bare `all` (2026-08-19): review-gate.yml's aggregate
    # job was ALSO named `all`, so both workflows posted an identically-named
    # check run and a single required context "all" could not tell them
    # apart — see .github/branch-protection.md and docs/CI_RUNBOOK.md for the
    # PR #1125 incident this caused (a red BaseballHelm smoke merged because
    # Review Gate's "all" reported green while CI's "all" was still running).
    # This job's id stays `all` (nothing references it via `needs:` — grepped
    # repo-wide before renaming) so the diff is name-only; only the `name:`
    # field below is what GitHub uses as the check-run/required-context
    # string, and it must stay globally unique across every workflow.
    name: CI aggregate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `supabase` (Supabase lint + RLS tests) is now part of the hard gate: the
    # baseball pgTAP RLS suite was greened on main by #517 (supersedes #423), so
    # RLS regressions now block merge through the required `all` check instead of
    # being advisory-only — the gap that let the anon-access hole reach main.
    #
    # `baseball-auth-smoke` is NO LONGER in this gate (owner 2026-08-26, PR
    # throughput — see the note on the job itself). Like unit-tests-timezone,
    # it now runs on push to main only; a red baseball smoke on `main` blocks
    # the next production promote rather than every PR merge.
    #
    # `unit-tests-timezone` is NO LONGER in this gate (owner 2026-08-20, PR
    # throughput). It caught a real 8pm-EDT regression (#1123) as a pre-merge
    # gate, but at 6 jobs/PR it was the dominant PR-time cost. It now runs on
    # push to MAIN only (see its `if`), so a timezone regression is caught
    # post-merge with fast rollback rather than blocking every PR. The
    # enforcement point moves accordingly: a red timezone job on `main` now
    # blocks the DEPLOY — it is caught by the pre-promote check of main's CI
    # before a production promote — not the merge. To restore the
    # pre-merge gate, re-add `- unit-tests-timezone` to `needs` below AND remove
    # its `if: github.event_name == 'push'`.
    needs:
      - detect-changes
      - database-types
      - schema-invariants
      - feature-knowledge
      - control-plane
      - bridge-env
      - typecheck
      - edge-functions
      - lint
      - lint-ratchet
      - unit-tests
      - business-contracts
      - next-build
      - route-hygiene
      - supabase
      - import-cycles
    steps:
      - name: Fail if any required CI check failed
        # A skipped heavy job is fine ONLY on a docs-only PR (code=='false').
        # On a code PR or a push, a skip is a real problem and still fails.
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.detect-changes.outputs.code == 'true' && contains(needs.*.result, 'skipped'))
        run: |
          echo "One or more CI checks failed."
          exit 1

      - name: All CI checks green
        run: echo "CI hard gates clean."
