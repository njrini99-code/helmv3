name: CI

# --- SHAPE OF THIS WORKFLOW (2026-09-02, PR throughput) ----------------------
#
# Every pull request used to fan out into 22 jobs here, 15 of which each ran
# their own checkout + setup-node + `npm ci` (68–103 s of install per job,
# measured on run 33637620180) in front of a few seconds of actual checking:
# `Route Hygiene P0/P1` did 0 s of work behind 89 s of install, `Bridge env
# drift` 0 s behind 91 s, `Database types drift` 6 s behind 96 s, `Business
# contracts` 9 s behind 75 s, `Feature knowledge` 3 s behind 81 s. With ~47
# check runs per PR across all workflows and a runner pool that behaves like
# 20 concurrent jobs, two open PRs saturated the account and the third waited
# 40 minutes for a slot before running a single command.
#
# The fix is not fewer CHECKS — every command that ran before still runs, and
# every one still reports under its own name. It is fewer JOBS:
#
#   Static checks   one job, one install, every check below as a named step
#                   (the eight tiny jobs above plus schema invariants and the
#                   Deno type-check, and steps added since — never count
#                   these in a comment, `.claude/rules/shipping.md` §1's
#                   "never write a count into prose" applies to workflow
#                   comments too; count them with `grep -c '^\s*id:'` over
#                   the job body when you need the number). Each step is
#                   continue-on-error and an aggregate step at the end fails
#                   the job naming every step that did not succeed — so one
#                   failure cannot mask another, and a failing control still
#                   surfaces under its own name (the reason `Control plane`
#                   was once a dedicated job is preserved as a step).
#   Lint            ESLint folded into the ratchet job; same aggregate pattern.
#   Next build, Unit tests (3 shards), Supabase lint + RLS   skip when the
#                   PR's diff touches nothing in `detect-changes`'s `code`
#                   filter (src/**, supabase/**, e2e/**, package*.json,
#                   next.config.*, tsconfig*.json, vitest.config.ts,
#                   eslint.config.mjs, tailwind.config.*, postcss.config.*,
#                   middleware.ts, scripts/**/*.{ts,mjs}, or this file
#                   itself) — a docs-only or config-only PR that touches none
#                   of these finishes without paying for a Next build, three
#                   test shards, or a from-scratch Supabase stack. TypeScript,
#                   Lint, and Static checks are NOT gated — they always run,
#                   because a change to `memory/registry.yml`, a rule file,
#                   or any other tracked path outside the `code` filter can
#                   still be exactly what those three gates exist to check
#                   (schema drift, path drift, the feature router, ESLint
#                   rules that read config files, ratchets).
#                   `CI aggregate` treats a SKIPPED gated job as passing only
#                   when `detect-changes` classified the PR as `code=false` —
#                   a skip on a code-relevant PR still fails the aggregate.
#   Next build      restores its webpack cache on every run but SAVES it only
#                   on push to main: the save step alone cost 99 s per PR run.
#
# PR job count here: 22 → 10 (detect, static, typecheck, lint, 3 unit shards,
# build, supabase, aggregate) on a code-relevant PR; detect, static,
# typecheck, lint, aggregate (5) on a docs/config-only PR. Installs per run:
# 15 → 8 (code PR) or 15 → 3 (docs/config-only PR). The push-to-main-only
# jobs (shifted-timezone unit tests, BaseballHelm authenticated smoke) are
# untouched.
#
# `npm ci` itself is NOT cached as a node_modules tarball, deliberately:
# measured 2026-09-02 the tree is 3.7 GB, a restore of that size costs about
# what the install does, and it would evict the Next build cache from the
# repository's 10 GB cache budget within a few runs.
#
# --- 2026-09-06 UPDATE: shared detector, build-once, fast-first ordering ----
#
# `detect-changes` is now a call into .github/workflows/detect-changes.yml —
# the same reusable workflow codeql.yml, feature-awareness.yml and
# migration-lockdown.yml call, replacing four independent copies of
# dorny/paths-filter (or, for feature-awareness, a hand-rolled git-diff
# classifier) with one. Its `code` output is unchanged in meaning and path
# list from the job it replaced.
#
# `next-build` now uploads its `.next` directory (minus `.next/cache`) as
# artifact `next-build-${{ github.sha }}`, 1-day retention. Two ADVISORY jobs
# that used to be separate workflows now live here and consume that artifact
# instead of rebuilding: `pr-smoke-a11y` ("Playwright PR smoke (a11y)",
# formerly pr-smoke.yml) and `sentry-snapshot-capture` ("Capture + upload
# Sentry snapshots", formerly sentry-snapshots.yml). Both `needs: next-build`
# and are gated by `detect-changes`'s `frontend`/`e2e` outputs — neither is in
# `CI aggregate`'s `needs`, and each keeps its test/capture step
# `continue-on-error` so a failure there cannot block a merge, matching the
# advisory status those two workflows always had. playwright.yml (the
# manual/main full suite) is unaffected; it downloads the same artifact when
# one exists for its SHA and falls back to building only when it doesn't.
#
# PARALLEL ORDERING (2026-09-22, owner): `next-build`, the three `unit-tests`
# shards, `unit-tests-timezone`, and `supabase` (Supabase lint + RLS tests)
# need only `detect-changes` and start alongside `typecheck`/`lint`. The
# 2026-09-06 fast-first ordering (`needs: [typecheck, lint]`) saved runner
# minutes, but the repo is public, so Actions minutes are free, and it added
# ~4 min to every code PR's critical path. Nothing is weaker: `CI aggregate`
# still needs `typecheck`, `lint` and every heavy job, so any failure still
# fails the required check.
#
# --- 2026-09-23 UPDATE: red-by-default failures and PR wall time ----------
#
# Measured that day: ~42% of PRs failed their first push, mostly for reasons
# the PR did not cause; queueing was 64% of PR wait against the account's
# 20-job concurrency cap. What changed (docs/CI_RUNBOOK.md has the table):
#
#   - `Database types drift` left `Static checks`; types-regen.yml owns it.
#   - Generated-artifact and dead-reference checks fail a PR only for drift
#     it introduced (scripts/github/pr-drift-gate.mjs, --introduced-since);
#     Docs Regen regenerates on main.
#   - `CI aggregate` excuses cancelled jobs only when the PR head has moved
#     on (superseded run). Drafts still fail it (#2049, owner decision).
#   - NO DETECT HOP: `unit-tests`, `next-build` and `supabase` no longer
#     `needs: detect-changes`; each applies the same `code` filter
#     (.github/path-filters.yml) in its first steps and finishes green with
#     nothing to do on a docs/config-only PR. `detect-changes` still feeds
#     the aggregate and the other workflows.
#   - `typecheck` folded into `lint` ("TypeScript + Lint"); unit tests run in
#     5 shards; `npm ci --prefer-offline --no-audit --no-fund` everywhere.
#   - `unit-tests-timezone` and `baseball-auth-smoke` moved to nightly.yml;
#     `pr-smoke-a11y` / `sentry-snapshot-capture` run on push to main,
#     dispatch, or a PR labelled `ci:e2e`.
#   - Next's .next/cache is saved from main once per UTC day per lockfile.
#   - The Supabase job starts only db/auth/storage and runs pg_prove once.
#
# Code-PR job count: 12 → 11 (detect, static, ts+lint, 5 unit shards,
# build, supabase, aggregate); per merge to main: 20 → 13.
# -----------------------------------------------------------------------------

on:
  # merge_group: required for GitHub's merge queue — a queued merge re-runs
  # these checks on the speculative merge result; without this trigger the
  # queue waits forever for contexts that never arrive and every merge times out.
  merge_group:
  push:
    branches:
      - main
  # ready_for_review (plus the GitHub defaults opened/synchronize/reopened):
  # a draft->ready transition needs its own event to trigger the first real
  # run, since every gated job below skips while github.event.pull_request.draft
  # is true (owner decision, PR throughput — drafts can't be merged, so
  # running the full suite on every draft push only burns Actions queue slots).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The full suite on any branch, including the advisory Playwright/Sentry
  # jobs: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  # Per-COMMIT groups on main (playwright.yml's old pattern): two merges landing
  # seconds apart used to cancel the first commit's suite mid-flight, and the
  # always()-running aggregate then FAILED on its cancelled needs — every
  # stacked merge painted a red X on a superseded main commit (owner report
  # 2026-08-20 22:15). On PR branches the old behavior stands: a new push
  # supersedes the previous run.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Fall back to a valid-format DUMMY on secretless runs (Dependabot / fork PRs
  # get no repo secrets). It only needs to be non-empty and NOT match
  # `placeholder.supabase.co` so the Supabase client guard doesn't throw — then
  # Next's cookies()->dynamic detection excludes auth/dashboard pages from
  # prerender, so the build makes no network call to it. Real PRs still use the
  # real secret; the dummy is never used at runtime.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # Reusable workflow — see .github/workflows/detect-changes.yml. Same
  # pattern codeql.yml/feature-awareness.yml/migration-lockdown.yml now all
  # call: one dorny/paths-filter, one job, outputs read by `if:`/`needs:`
  # below. The job id stays `detect-changes` here (unchanged from before this
  # became a reusable workflow) so nothing downstream needed to change its
  # `needs:`/`if:` references — only `code` is consumed in this file.
  detect-changes:
    name: Detect changes
    uses: ./.github/workflows/detect-changes.yml

  # ---------------------------------------------------------------------------
  # Every repo-wide check that finishes in seconds, behind ONE install.
  #
  # Runs on docs-only PRs too, on purpose: the knowledge-base gates in here
  # (schema drift, path drift, the feature router, the generated inventory)
  # are exactly what a documentation change needs checked, and the whole job
  # is cheaper than the install it replaces eight of.
  #
  # Every step below is `continue-on-error: true` so that ONE failure cannot
  # hide another — the pattern the Lint job established on 2026-08-18 after a
  # stale Supabase baseline hid a fail-open regression for a full CI cycle.
  # The aggregate at the end reads `steps.*.outcome` and fails the job naming
  # every step that did not succeed. A skipped step counts as a failure: a
  # gate that did not run is not a gate that passed.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static checks
    # Skip while draft (owner decision, PR throughput): nothing is required
    # on a draft PR since it can't be merged; marking it ready_for_review
    # re-triggers a full, real run via the added pull_request type above.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by scripts/github/pr-drift-gate.mjs: on a pull_request, a failing
      # drift check is re-run on the base (main) and the PR head to tell
      # "introduced by this PR" from "inherited from main". Empty elsewhere.
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: the feature-knowledge checks read git for file
          # provenance, and the old `Feature knowledge` job fetched it too.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      # supabase/functions/ is EXCLUDED from tsconfig.json, so `npm run typecheck`
      # has never covered these three Deno edge functions. They are deployed code
      # that sends push notifications and email; until 2026-08-19 nothing checked
      # them at all. The first run of this gate found a real type error in
      # send-fcm-push (crypto.subtle.importKey rejecting a widened Uint8Array).
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Schema invariants
        id: schema_invariants
        continue-on-error: true
        run: ./scripts/check-schema-invariants.sh

      # Catches `.limit(N > 1000)` including behind a named constant, which the
      # ast-grep rule cannot see through — that is exactly where the live
      # shot-drivers truncation hid (SHOT_DRIVERS_FETCH_CAP = 25000).
      - name: PostgREST row caps
        id: row_caps
        continue-on-error: true
        run: node scripts/check-row-cap-limits.mjs

      # `Database types drift` (database.ts vs the LIVE production schema) is
      # NOT a PR step any more (2026-09-23): a production apply turned every
      # open PR red at once — 10 of 16 real first-push failures that day.
      # It runs in .github/workflows/types-regen.yml after db-apply, on push
      # to main and every 3h, and opens the regen PR itself.

      # GENERATED INVENTORY DRIFT — a required PR-time gate as of 2026-08-29.
      #
      # Before this, drift was caught by a scheduled workflow that opened a
      # FOLLOW-UP PR (#1623 sat open while main carried a stale route count),
      # and that workflow's own header records that PRs created with
      # GITHUB_TOKEN may receive no required CI. `created != integrated` is the
      # same class of control this repo keeps finding does not actually run.
      #
      # --check is NON-MUTATING: it computes the expected blocks and compares,
      # leaving the tree byte-identical. The previous `docs:regen && git diff`
      # shape could only tell you the docs were stale by first making them
      # correct, which is unusable as a gate.
      #
      # 2026-09-23: through scripts/github/pr-drift-gate.mjs. A PR fails here
      # only for drift it introduced — not when `main` itself is stale
      # (inherited) or when two PRs each regenerated the same block and the
      # merge describes neither tree (skew). Both of those went red on every
      # open PR whenever main moved; Docs Regen now regenerates after merge.
      - name: Generated inventory is current
        id: inventory
        continue-on-error: true
        run: node scripts/github/pr-drift-gate.mjs --allow-merge-skew -- npm run docs:inventory-check

      # REPO-WIDE STATIC GUARDS, with honest outcomes.
      #
      # These ran inside the `unit` project until 2026-08-29, where a sweep that
      # timed out was reported using the same shape as a failed assertion — CI
      # printed red against "no imports of GlassCard ... remain in src" when the
      # guard had never finished asking. The runner distinguishes:
      #   exit 0  PASS
      #   exit 1  POLICY_FAILURE          ran, found violations
      #   exit 2  INFRASTRUCTURE_FAILURE  did not finish — UNKNOWN, not a pass
      - name: Repo-wide static guards
        id: guards
        continue-on-error: true
        run: npm run guards

      # VERCEL UPLOAD COVERAGE. `.vercelignore` REPLACES Vercel's default
      # ignore set, so every gitignored secret is uploaded unless that file
      # names it too — the .env family shipped in every production upload
      # until #1714, found by a hand simulation. config/repo/manifest.yml
      # (vercel.must_ignore) is the maintained list; this fails when any entry
      # is not matched by .vercelignore. It proves the FILE, not the upload —
      # only Vercel can prove the upload — which is the half that rots.
      - name: Vercel upload excludes every secret-bearing path
        run: npm run check:vercelignore

      # THE CONTROL PLANE VERIFIES THE CONTROL PLANE.
      #
      # Static mode only: no user-global config, no network beyond gh, no
      # machine-specific state. READ-ONLY by construction — it regenerates
      # nothing and deletes nothing, so it can report what is wrong instead of
      # quietly fixing it.
      #
      #   exit 0  VERIFIED
      #   exit 1  CONTROL FAILURE   a control that should hold does not
      #   exit 2  UNKNOWN           a required state could not be established
      #
      # UNKNOWN never becomes PASS. Every control this repo lost was lost by
      # being assumed rather than checked. It was a dedicated job until
      # 2026-09-02 so that a failure would surface under its own name; it is a
      # named step now, and the aggregate below prints that name.
      #
      # HELM_CP_SKIP_GENERATED / KNOWLEDGE_CHECK_SKIP_GENERATED: the
      # generated-artifact stages of these two run in "Generated artifacts
      # are current" below instead (moved, not dropped — see that step).
      # Both run through pr-drift-gate WITHOUT --allow-merge-skew: the only
      # failure it excuses for them is one main already has (inherited).
      - name: Control plane
        id: control_plane
        continue-on-error: true
        env:
          HELM_CP_SKIP_GENERATED: '1'
        run: node scripts/github/pr-drift-gate.mjs -- npm run control-plane:verify:static

      - name: Feature knowledge registry
        id: knowledge_check
        continue-on-error: true
        env:
          KNOWLEDGE_CHECK_SKIP_GENERATED: '1'
        run: node scripts/github/pr-drift-gate.mjs -- npm run knowledge:check

      # Every other generated artifact, each compared to its sources through
      # scripts/github/pr-drift-gate.mjs (same rule as the inventory step
      # above): the document inventory and feature map (from knowledge:check),
      # and the enforcement inventory and tool-authority matrix (from the
      # control plane). Every command runs even if an earlier one fails.
      - name: Generated artifacts are current
        id: generated_artifacts
        continue-on-error: true
        run: |
          rc=0
          for check in knowledge:doc-inventory:check knowledge:feature-map:check enforcement:check tool-authority:check; do
            echo "::group::$check"
            node scripts/github/pr-drift-gate.mjs --allow-merge-skew -- npm run "$check" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      # Fails when memory/**, CLAUDE.md, AGENTS.md or .claude/rules/* name a
      # golf_*/baseball_* database object that does not exist in
      # src/lib/types/database.ts.
      #
      # This runs HERE, on the per-PR fast path, on purpose, and it covers a
      # class the inventory check cannot: the inventory check compares the
      # generator to its own output, reads only AUTOGEN blocks, and covers 3
      # files. This one reads the whole knowledge base against the live schema.
      # An audit on 2026-08-19 found 59 identifiers documented as live tables —
      # with columns, FKs and RLS policy names — that returned absent from every
      # catalog in production. Sessions are ordered by CLAUDE.md to read those
      # docs before writing code, so a wrong doc becomes wrong code with no
      # signal in between.
      - name: Knowledge base against the schema
        id: schema_drift
        continue-on-error: true
        run: npm run docs:schema-drift

      # Fails when a navigation doc names a file path that does not resolve.
      # An audit on 2026-08-20 found 47 dead paths across memory/**,
      # .claude/rules/**, CLAUDE.md, AGENTS.md and docs/REPO_MAP.md — components,
      # hooks and tests that moved or were deleted while the docs naming them
      # were not. Those docs read as inventories, so a session treats a dead path
      # as "where the code lives", fails to find it, and either invents a
      # replacement or concludes the feature is missing. Both are confident and
      # wrong.
      - name: Navigation docs for dead file paths
        id: path_drift
        continue-on-error: true
        run: npm run docs:path-drift

      # World Model graph (docs/generated/WORLD_MODEL.{json,md}) — added
      # 2026-09-02 alongside the generator itself. Without this step the
      # committed artifact could go stale on the very next registry.yml edit
      # and nothing would notice: `.claude/rules/quality-gates.md`'s own rule
      # is "a script in package.json with no workflow step is not a gate,"
      # and `npm run knowledge:world-model:check` sat exactly there until
      # this step was added in the same change that introduced it.
      - name: World Model graph is current
        id: world_model
        continue-on-error: true
        run: node scripts/github/pr-drift-gate.mjs --allow-merge-skew -- npm run knowledge:world-model:check

      # The other direction from registry glob coverage in knowledge:check:
      # that check fails when a registry entry points at a path that no
      # longer exists, this one fails when a tracked file under a directory
      # the registry itself claims to fully cover (src/app/admin,
      # src/lib/admin — see check-registry-orphans.mjs's module doc-comment
      # for exactly what earns a directory that claim) maps to zero
      # features. Added 2026-09-03 after the admin_platform split shipped
      # with exactly this defect: src/app/admin/__tests__/** fell through
      # every named routes/tests glob and mapped to no feature at all.
      - name: Registry claims full coverage of what it says it does
        id: registry_orphans
        continue-on-error: true
        run: npm run knowledge:orphans-check

      # The orphan checker's OWN test — pure-logic fixtures via node:test,
      # no real git/filesystem (see the file's header). Wired here rather
      # than left as a script nothing invokes, which is the exact "gate that
      # cannot fail is not a gate" pattern `.claude/rules/quality-gates.md`
      # calls out — `knowledge:journeys-check:test` and `knowledge:bench:test`
      # sit unwired today as a live example of the failure mode this step
      # avoids repeating.
      - name: Registry orphan checker's own tests
        id: registry_orphans_test
        continue-on-error: true
        run: npm run knowledge:orphans-check:test

      # memory/invariants/registry.yml must point at checks that are real
      # and actually wired (Bridge Control Plane Phase D.4.3). Wired here,
      # AND its own test wired right after it, on purpose —
      # `knowledge:journeys-check`/`:test` sit unwired above as the
      # documented example of the "gate that cannot fail is not a gate"
      # pattern this step exists to avoid repeating for a NEW guard.
      - name: Invariant registry citations resolve
        id: invariants_check
        continue-on-error: true
        run: npm run knowledge:invariants-check

      - name: Invariant registry checker's own tests
        id: invariants_check_test
        continue-on-error: true
        run: npm run knowledge:invariants-check:test

      # golden-paths.generated.ts (src/lib/admin/slo/**) must not drift from
      # memory/journeys/golden-paths.yml — the generated module is what
      # golden-path health reads at request time (memory/** is outside the
      # Vercel bundle), same drift-check shape as flags:check for
      # config/feature-flags.yml.
      - name: Golden-path health module is current
        id: golden_paths_generate_check
        continue-on-error: true
        run: npm run knowledge:golden-paths-generate:check

      # memory/analytics/event-contracts.yml — allow-listed properties for
      # every behavioral event before it is written (Phase D.4.4).
      - name: Event contract citations resolve
        id: event_contracts_check
        continue-on-error: true
        run: npm run knowledge:event-contracts-check

      - name: Event contract checker's own tests
        id: event_contracts_check_test
        continue-on-error: true
        run: npm run knowledge:event-contracts-check:test
      # Feature-flag registry governance (config/feature-flags.yml).
      # `flags:check` chains three things: registry.generated.ts is current
      # relative to the YAML (non-mutating drift comparison, same pattern as
      # docs:inventory-check), the node:test suites covering the generator
      # and the CI gate itself pass, then the gate re-parses the YAML
      # independently and fails on an expired-but-active flag, a flag
      # missing owner/cleanup_plan, a temporary_migration flag past (or
      # missing) its expires_at, or a NEVER-GATE violation (auth/RLS/
      # tenancy/membership/persistence). See docs/ai-system/FEATURE_FLAGS.md.
      - name: Feature flags
        id: feature_flags
        continue-on-error: true
        run: npm run flags:check

      # Helm Bridge integration env drift.
      #
      # Runs in --drift mode, which is a no-op while NONE of these secrets are
      # provisioned (CI's situation today) and becomes a hard failure the moment
      # SOME are set and a sibling goes missing. That asymmetry is the point: a
      # partially-configured Bridge degrades SILENTLY — blank panels, and edge
      # errors that never reach admin_events because INTERNAL_LOG_KEY is unset —
      # so a rotated or dropped var otherwise surfaces only during a real
      # incident, which is the worst possible time to discover it.
      #
      # Wiring the secrets into this repo later needs no change here: the step
      # starts enforcing on its own as soon as any one of them exists.
      - name: Bridge env drift
        id: bridge_env
        continue-on-error: true
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          INTERNAL_LOG_KEY: ${{ secrets.INTERNAL_LOG_KEY }}
        run: node scripts/check-helm-bridge-env.mjs --drift

      # The npm script uses --node-modules-dir=none deliberately — and it
      # matters MORE now that this step shares a checkout with `npm ci`. With
      # `auto`, deno resolves npm deps itself and REWRITES node_modules —
      # locally that silently bumped stripe 22.3.2 -> 22.5.0, whose pinned
      # API-version type no longer matched src/lib/stripe/server.ts, so
      # `npm run typecheck` started failing on a file nobody had touched. A
      # type gate must not mutate the tree it is checking.
      #
      # It also passes --minimum-dependency-age=120 (minutes). Deno's default
      # 24h supply-chain age policy failed this job on 2026-08-21 when rollup
      # published 4.62.5 upstream — a red CI day for a docs-only merge, with no
      # code change on our side. 2h keeps the protection against
      # just-published/compromised versions without a day-long outage every
      # time a floating transitive dep ships a release. Owner decision
      # 2026-08-21.
      - name: Edge functions (Deno)
        id: edge_functions
        continue-on-error: true
        run: npm run typecheck:functions

      - name: Business contracts
        id: business_contracts
        continue-on-error: true
        run: npm run verify:business

      - name: Route Hygiene P0/P1
        id: route_hygiene
        continue-on-error: true
        run: |
          npm run ui:routes
          npm run routes:hygiene:p0p1

      # Value-level import cycles typecheck and build cleanly but can crash at
      # cold runtime (TDZ) — the #803/#804 prod-crash class. Baseline-aware:
      # fails only on cycles not in .cycles-baseline.json.
      - name: Import-cycle ratchet
        id: import_cycles
        continue-on-error: true
        run: npm run check:cycles

      # Retrieval bench (Phase 5): scores memory/registry.yml's routing
      # against scripts/knowledge/bench/gold-set.v1.json and fails if
      # docs/generated/RETRIEVAL_BENCH.md / retrieval-bench.json are stale,
      # or if feature_recall drops / wrong_feature_rate rises versus
      # retrieval-bench-baseline.json. The ratchet may only improve;
      # `node scripts/knowledge/bench.mjs --update-baseline` locks in a gain.
      - name: Retrieval bench ratchet
        id: knowledge_bench
        continue-on-error: true
        run: npm run knowledge:bench:check
      # Living dead-reference ratchet (docs reorg Phase 6 / W4). Counts
      # backticked repo-relative paths that resolve to nothing tracked,
      # restricted to the nine "living" categories (REFERENCE,
      # GENERATED_TRUTH, CURRENT_FEATURE, PROCESS_CONTRACT, RUNBOOK, POLICY,
      # DESIGN_SPEC, STATE_SNAPSHOT, AGENT_SKILL) — HISTORY_LEDGER, ARCHIVE,
      # PLAN, AUDIT_SNAPSHOT, ADR, INCIDENT, INDEX and UNKNOWN are excluded
      # because dated/historical records are allowed to name paths that no
      # longer exist. Ratchets against .dead-refs-baseline.json — the
      # baseline may only fall, never rise; a NEW dead reference always
      # fails regardless of the baseline.
      #
      # 2026-09-23: CI asks the "NEW" half directly — `--introduced-since`
      # the PR's base (or the previous main commit on push) fails only for
      # (doc, path) pairs dead now and not dead there. The whole-tree count
      # tripped on main's own total ("REGRESSION 4 -> 6") whenever two PRs
      # landed dead refs back to back, failing every open PR for references
      # none of them wrote. `npm run docs:dead-refs` (the baseline ratchet)
      # is unchanged for local use and `-- --update`.
      - name: Living dead references (none introduced)
        id: dead_refs
        continue-on-error: true
        env:
          DEAD_REFS_SINCE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$DEAD_REFS_SINCE" ] && [ "$DEAD_REFS_SINCE" != "0000000000000000000000000000000000000000" ]; then
            npm run docs:dead-refs -- --introduced-since "$DEAD_REFS_SINCE"
          else
            npm run docs:dead-refs
          fi

      # Lifecycle gate: fails if any living doc outside the attic
      # (docs/archive/, archive/) carries its own Status header reading
      # SUPERSEDED/DONE/COMPLETE — threshold is a hardcoded 0, with an
      # explicit "KEPT FOR HISTORY" exemption for the handful of superseded
      # docs that stay in place on purpose because live docs still cite them
      # by path and line range.
      - name: No done/superseded records outside the attic
        id: lifecycle
        continue-on-error: true
        run: npm run docs:lifecycle

      # `steps` (the context) holds every step above that carries an `id`, with
      # the outcome BEFORE continue-on-error rewrote it. Anything other than
      # `success` — failure, cancelled, or skipped because `npm ci` died first —
      # fails this job and is printed by name.
      - name: Static checks aggregate (fails if any check failed)
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          bad=0
          while IFS=$'\t' read -r id outcome; do
            if [ "$outcome" = "success" ]; then
              echo "ok      $id"
            else
              echo "FAILED  $id -> $outcome"; bad=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.outcome)"' <<< "$STEP_OUTCOMES")
          exit "$bad"

  lint:
    # TypeScript and Lint were two jobs until 2026-09-23 — two runner slots
    # and two `npm ci`s per PR for ~3 min of tsc and ~2 min of ESLint. Folded
    # into one: `tsc` is a named step with the same continue-on-error +
    # aggregate pattern as every ratchet here, so a type error still fails
    # this job under its own step name and cannot hide a lint failure (or the
    # reverse). Sequential total (~6 min) stays under `Next build` (~7.7 min
    # median), so the critical path does not grow.
    #
    # NOT gated on the `code` path filter: a change outside it (a rule file,
    # memory/registry.yml, config/*.yml) can still change what `tsc` reports
    # through an ambient `.d.ts` or a tsconfig `include`/`paths` entry, and
    # ESLint reads config files and the ratchets read the whole tree. Always
    # runs, except while draft (owner decision, PR throughput) — see
    # static-checks above.
    name: TypeScript + Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELM_ESLINT_REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Was the separate `TypeScript` job (see the note on this job).
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      # Parse src + scripts once with the three opt-in audit rules enabled.
      # Each named gate below evaluates this run's report with its own scope.
      # Producer failure is included in the aggregate; consumers never rescan
      # or fall back to a cached result when the report is missing/invalid.
      - name: ESLint shared scan
        id: eslint_scan
        continue-on-error: true
        run: |
          export HELM_ESLINT_REPORT="$RUNNER_TEMP/helm-eslint.json"
          printf 'HELM_ESLINT_REPORT=%s\n' "$HELM_ESLINT_REPORT" >> "$GITHUB_ENV"
          node scripts/lint-ci.mjs --scan

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: node scripts/lint-ci.mjs

      # The ratchet steps below carry continue-on-error so that ONE
      # failure can't mask the others — on 2026-08-18 a stale Supabase
      # baseline hid a fail-open regression for a full CI cycle because the
      # steps ran sequentially and the later ones never ran. Each step still
      # records its real outcome; the aggregator at the end fails the job if
      # ANY ratchet failed, so nothing gets weaker — every failure now just
      # surfaces in the same run.
      - name: Lint ratchet
        id: ratchet_lint
        continue-on-error: true
        run: npm run lint:ratchet

      # A failed Supabase read must not render as an empty one. supabase-js
      # RESOLVES errors as { data: null, error } rather than throwing, so
      # `const { data } = await ...` turns an outage into "no team", "no
      # entries yet", a 404, or a leaderboard with no scores. 15 instances of
      # that were fixed on 2026-08-07 across 12 files.
      #
      # This fails only if the count goes UP, so it blocks new ones without
      # demanding the existing backlog be paid off first.
      - name: Unchecked Supabase reads (ratchet)
        id: ratchet_supabase
        continue-on-error: true
        run: npm run audit:supabase-errors

      # Counts guards whose "the read failed" answer is the same value as their
      # "allow" answer. Three of those shipped before this gate existed, and the
      # unchecked-read ratchet above could not see any of them — all three bound
      # their error correctly and then answered it permissively.
      - name: Fail-open guards (ratchet)
        id: ratchet_failopen
        continue-on-error: true
        run: npm run audit:fail-open

      - name: Unchecked paginated reads (ratchet)
        id: ratchet_paginated
        continue-on-error: true
        run: npm run audit:paginated-reads

      # Duplicate exports had a committed baseline (.duplicate-exports-baseline.json,
      # 27 grandfathered) and a process.exit(1) on anything new — but NO job ran it,
      # so the ratchet could never ratchet and new duplicates landed silently. A
      # baseline nothing compares against is a green that means nothing.
      - name: Duplicate exports (ratchet)
        id: ratchet_dupexports
        continue-on-error: true
        run: npm run lint:duplicate-exports

      - name: Lint aggregate (fails if any check failed)
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          bad=0
          while IFS=$'\t' read -r id outcome; do
            if [ "$outcome" = "success" ]; then
              echo "ok      $id"
            else
              echo "FAILED  $id -> $outcome"; bad=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.outcome)"' <<< "$STEP_OUTCOMES")
          exit "$bad"

  unit-tests:
    name: Unit tests
    # No `needs:` — starts with everything else and applies the `code` path
    # gate itself (see the PATH GATE step). Skips while draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists the PR's files via the API
    # Sharded because the suite is runner-bound, not config-bound: 8,657 tests
    # take ~2.4 min on a 10-core laptop and ~13.9 min on a 4-core hosted runner.
    # `npm ci` is only ~1.2 min of that, so installs are not the lever — cores
    # are. Three shards cut wall clock from ~15.5 min to ~6, but by 2026-09-23
    # a shard took ~9 min median and the unit job paced 66% of runs; five
    # shards (~5.5 min each) put it back under `Next build`.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # PATH GATE, IN-JOB (2026-09-23): this job decides for itself whether
      # the PR touched anything in `code` (.github/path-filters.yml, the same
      # list detect-changes reads) instead of `needs: detect-changes` — that
      # hop cost a second queue wait on every code PR before the heavy work
      # could start. Fail closed: any event but pull_request, or a filter
      # that did not succeed, runs everything. A docs/config-only PR finishes
      # this job green in seconds with every later step skipped.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml

      - name: Code-relevant change? (fail closed)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$FILTER_OUTCOME" = "success" ] && [ "$FILTER_CODE" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code-relevant path changed; nothing for this job to check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests (shard ${{ matrix.shard }}/5)
        if: steps.gate.outputs.run == 'true'
        run: npm run test:run -- --shard=${{ matrix.shard }}/5

      # The `integration` project ran in no job of its own. It was still being
      # executed — but only by accident, because `--project business` matched
      # ~870 files instead of its 7 (see the note in vitest.config.ts). Once
      # that project actually filters, this step is what keeps
      # coach-onboarding-staff-row and player-access-action-gate — the auth and
      # access-control tests — running at all.
      - name: Integration tests
        if: steps.gate.outputs.run == 'true' && (matrix.shard == 1)
        run: npm run test:integration

  next-build:
    name: Next build
    # No `needs:` — in-job `code` path gate, see Unit tests. Skips while draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists the PR's files via the API
    outputs:
      # Whether this run built (and uploaded `next-build-<sha>`). The
      # artifact consumers below check it: a gated-off build has no artifact.
      built: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # PATH GATE, IN-JOB (2026-09-23): this job decides for itself whether
      # the PR touched anything in `code` (.github/path-filters.yml, the same
      # list detect-changes reads) instead of `needs: detect-changes` — that
      # hop cost a second queue wait on every code PR before the heavy work
      # could start. Fail closed: any event but pull_request, or a filter
      # that did not succeed, runs everything. A docs/config-only PR finishes
      # this job green in seconds with every later step skipped.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml

      - name: Code-relevant change? (fail closed)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$FILTER_OUTCOME" = "success" ] && [ "$FILTER_CODE" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code-relevant path changed; nothing for this job to check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # `next build --webpack` keeps its incremental compilation cache in
      # .next/cache. RESTORE on every run (lockfile-exact prefix first, then
      # any); SAVE only on push to main, and only when today's key for this
      # lockfile does not exist yet.
      #
      # 2026-09-23: the key was `...-<sha>`, so EVERY merge to main saved a
      # fresh multi-hundred-MB entry into a 10 GB repository cache that sat
      # at 9.96 GB — GitHub evicted the least-recently-used entries, which
      # were routinely the ones PRs were about to restore, and 27% of builds
      # ran over 7 min cold. Keyed by UTC day + lockfile, main writes at most
      # one entry a day (plus one per lockfile change); a day-old cache is
      # still warm for webpack.
      - name: Next cache key
        if: steps.gate.outputs.run == 'true'
        id: nextkey
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Next build cache
        if: steps.gate.outputs.run == 'true'
        id: nextcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.nextkey.outputs.day }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-build-${{ runner.os }}-

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: npm run build

      - name: Save Next build cache (push to main, once a day per lockfile)
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'push' && steps.nextcache.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.nextkey.outputs.day }}

      # BUILD ONCE (2026-09-06). `.next/cache` is excluded — that's the
      # webpack incremental cache restored/saved above, not needed by anyone
      # consuming this artifact, and it would bloat the upload for nothing.
      # 1-day retention: this artifact only needs to outlive the same run's
      # `pr-smoke-a11y` / `sentry-snapshot-capture` jobs below, and a manual
      # playwright.yml dispatch against the same commit shortly after.
      # `include-hidden-files` and `if-no-files-found` are BOTH load-bearing
      # here. `.next` is dot-prefixed, and upload-artifact skips hidden paths
      # by default — so this step logged "No files were found with the
      # provided path", uploaded nothing, and still SUCCEEDED. Both consumers
      # below then failed on download, every run, for as long as the
      # build-once wiring existed. `error` turns the next silent miss into a
      # failed step instead of two mystery red checks a job away.
      - name: Upload Next build artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  supabase:
    name: Supabase lint + RLS tests
    # No `needs:` — in-job `code` path gate, see Unit tests. Skips while draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: read lets the ghcr.io login step below get the authenticated
    # (higher) pull rate limit for ghcr.io/supabase/* images; the
    # workflow-level `permissions:` block above only grants `contents: read`.
    permissions:
      contents: read
      packages: read
      pull-requests: read  # dorny/paths-filter lists the PR's files via the API
    env:
      SUPABASE_PROJECT_ID: helmv3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # D2 declarative-schema and squawk gates below diff this PR's
          # migration files against the base branch; a shallow (default)
          # checkout doesn't have the base commit to diff against.
          fetch-depth: 0

      # PATH GATE, IN-JOB (2026-09-23): this job decides for itself whether
      # the PR touched anything in `code` (.github/path-filters.yml, the same
      # list detect-changes reads) instead of `needs: detect-changes` — that
      # hop cost a second queue wait on every code PR before the heavy work
      # could start. Fail closed: any event but pull_request, or a filter
      # that did not succeed, runs everything. A docs/config-only PR finishes
      # this job green in seconds with every later step skipped.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml

      - name: Code-relevant change? (fail closed)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$FILTER_OUTCOME" = "success" ] && [ "$FILTER_CODE" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code-relevant path changed; nothing for this job to check."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup Supabase CLI
        if: steps.gate.outputs.run == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.114.0

      # Squawk lints only the migration files this PR adds — pinned version,
      # scoped to the PR diff (see docs/CI_RUNBOOK.md / .circleci/README.md:
      # the weekly CircleCI squawk job stays as an advisory full-history
      # sweep; this is the per-PR blocking gate for NEW migrations).
      - name: Lint new migrations with squawk
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          base="${base:-origin/main}"
          new_migrations="$(git diff --name-only --diff-filter=A "${base}...HEAD" -- supabase/migrations/ | grep -v 'HELD\.md$' || true)"
          if [ -z "$new_migrations" ]; then
            echo "No new migration files in this PR."
            exit 0
          fi
          echo "$new_migrations"
          # Same tool + pin as the weekly CircleCI job (.circleci/config.yml
          # squawk-migrations), but this run is per-PR, scoped to only the
          # migrations this PR adds, and blocking (no `|| true`) — the
          # weekly job stays in place as the full-history advisory sweep
          # (see .circleci/README.md).
          npm install --no-save squawk-cli@2.64.0
          # Rule set: squawk's default minus the two timeout rules (Supabase
          # wraps each file in one transaction, so a per-statement timeout
          # cannot be set). disallowed-lock, require-concurrent-index-creation
          # and changing-column-type stay on; a per-statement exception is one
          # `-- squawk-ignore <rule>` line directly above the statement, with
          # the reason on the line above it.
          echo "$new_migrations" | xargs npx squawk-cli --assume-in-transaction \
            --exclude=require-lock-timeout,require-statement-timeout

      - name: "Declarative schema: new migrations reflected in supabase/schemas"
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/db/check-new-migrations-in-schema.sh "${{ github.event.pull_request.base.sha }}"

      # Authenticated ghcr pulls: anonymous pulls of ghcr.io/supabase/* hit
      # `toomanyrequests` when several PRs start the stack at once.
      - name: Log in to ghcr.io (Supabase images)
        if: steps.gate.outputs.run == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ONLY WHAT THIS JOB USES (2026-09-23). 19 of 26 failures of this job
      # were ghcr.io `toomanyrequests` while `supabase start` pulled ~12
      # images at once. Every step below talks to Postgres directly (db lint,
      # db:drift:check over DATABASE_URL, pg_prove), so the API gateway,
      # PostgREST, Studio, Realtime, the image proxy, edge runtime, logging,
      # mail and pooler containers are never used here. gotrue and
      # storage-api stay: their schemas (auth.*, storage.*) are initialized
      # by those services and migrations + pgTAP suites reference both
      # (e.g. supabase/tests/rls/documents_storage.sql). The mirror fallback
      # in the retry script still covers the images that remain.
      - name: Start local Supabase stack (db, auth, storage only)
        if: steps.gate.outputs.run == 'true'
        run: >-
          bash scripts/db/supabase-start-with-retry.sh
          -x kong,postgrest,postgres-meta,studio,realtime,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor

      - name: Lint migrations
        if: steps.gate.outputs.run == 'true'
        run: supabase db lint --schema public

      # Schema invariants, run against the stack this job just rebuilt FROM
      # MIGRATIONS. `db:drift:check` existed in package.json with no workflow
      # caller since it was written — a script nothing invokes is not a gate,
      # which `.claude/rules/quality-gates.md` names explicitly.
      #
      # WHAT THIS DOES AND DOES NOT PROVE. The script's own header frames these
      # as production-correctness invariants, and against production it would
      # answer "has production drifted". It cannot ask that here: the check needs
      # DATABASE_URL or SUPABASE_DB_PASSWORD, and neither exists as a repo secret
      # (verified 2026-08-27 — Actions holds ACCESS_TOKEN, SERVICE_ROLE_KEY,
      # PROJECT_ID, ANON_KEY and no database password).
      #
      # Pointed at the local stack it answers a different and still valuable
      # question: do the migrations, replayed from scratch, produce a schema that
      # satisfies all 12 invariants? Every one of them encodes a real past
      # production defect (#651 missing Baseball columns, #728/#887 stale stat
      # aliases, #732 a phantom rate_limits table, admin rollup gates that must
      # check is_super_admin). This catches a migration that reintroduces one
      # before it is ever applied anywhere.
      #
      # To ALSO gate production drift, add a SUPABASE_DB_PASSWORD repo secret and
      # a second scheduled job — deliberately not per-PR, since production drift
      # is not something a pull request introduces.
      #
      # Fail-closed: exit 2 is "could not connect", and it fails this step rather
      # than passing quietly. A drift guard that goes green when it never reached
      # a database is the exact false-green shape check:types-drift already has.
      - name: Schema invariants (migrations rebuild)
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run db:drift:check

      # ONE pg_prove run over every suite (2026-09-23). This used to call
      # `supabase test db` once per file — a fresh pg_prove container per
      # suite, most of the step's wall time. pg_prove still runs each file
      # in its own psql session and reports every failure, so isolation and
      # coverage are unchanged; `_helpers.sql` is still inlined into each
      # file (the CLI copies only the named files into the container, so a
      # relative `\i _helpers.sql` cannot resolve there).
      - name: Run pgTAP RLS suites
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # `supabase test db` pulls pg_prove itself; pre-pull it with the
          # mirror fallback so a ghcr.io rate limit can't fail the suite.
          # The tag follows the pinned CLI; a stale tag only skips the
          # pre-pull, and the CLI pulls the image it wants as before.
          bash scripts/db/pull-supabase-image.sh ghcr.io/supabase/pg_prove:3.36 || true
          tmp_dir="$(mktemp -d)"
          count=0
          for f in supabase/tests/rls/*.sql; do
            case "$f" in
              */_helpers.sql) continue ;;
            esac
            {
              cat supabase/tests/rls/_helpers.sql
              grep -Ev '^\\i(r)? .*_helpers\.sql$' "$f"
            } > "$tmp_dir/$(basename "$f")"
            count=$((count + 1))
          done
          echo "Running $count pgTAP suite(s) in one pg_prove invocation."
          supabase test db "$tmp_dir"

      - name: Stop local Supabase stack
        if: always() && steps.gate.outputs.run == 'true'
        run: supabase stop || true

  # ---------------------------------------------------------------------------
  # BUILD ONCE (2026-09-06): the two jobs below used to be entire separate
  # workflows (pr-smoke.yml, sentry-snapshots.yml), each running its own
  # `npm ci` + `next build` on the SAME commit `next-build` above already
  # built. Both now `needs: next-build` and download that artifact instead —
  # they still `npm ci` (node_modules isn't part of the artifact, and
  # `next start` needs the `next` binary + every runtime dependency), but
  # skip the ~8-9 minute build. `next.config.*` and `public/` are read
  # straight from the checkout at runtime same as any `next start`; only the
  # COMPILED OUTPUT under `.next` is what the artifact supplies.
  #
  # ADVISORY, unchanged from before: neither job is in `CI aggregate`'s
  # `needs:` below, and each keeps step-level `continue-on-error` on its
  # test/capture step (not job-level) so the check still reports its own
  # honest pass/fail while being structurally incapable of blocking a merge.
  # Job/check NAMES are unchanged from the workflows they replace, per
  # docs/CI_RUNBOOK.md's table.
  #
  # Both require `needs.next-build.outputs.built == 'true'` — there is no
  # `next-build` artifact on a run whose path gate found nothing
  # code-relevant, so they report SKIPPED there rather than building.
  # ---------------------------------------------------------------------------
  pr-smoke-a11y:
    name: Playwright PR smoke (a11y)
    # PUSH TO MAIN / DISPATCH / LABEL ONLY (2026-09-23, PR throughput). Both
    # are advisory (never in `CI aggregate`) yet ran on most PRs, each taking
    # a runner slot plus an `npm ci` and a Playwright install while PRs
    # queued for slots. They now run on push to main (post-merge signal), on
    # `workflow_dispatch`, and on a PR carrying the `ci:e2e` label — labels
    # are read from the event, so add it BEFORE the push you want covered.
    # A PR run also needs `Next build` to have actually built (its artifact).
    needs: [next-build]
    if: >-
      needs.next-build.outputs.built == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download Next build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: next-build-${{ github.sha }}
          path: .next

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Same shared-server rationale as before (pr-smoke.yml's original
      # comment): one `next start` shared via PLAYWRIGHT_BASE_URL by both
      # test steps below avoids a second `playwright test` invocation racing
      # port 3000 right after the first one's own webServer tears down.
      # `next start` (production server against the DOWNLOADED build)
      # replaces the old `npm run dev` — this job now exercises the same
      # artifact the rest of CI already validated, not a fresh dev compile.
      - name: Start production server (from downloaded build)
        run: |
          set -euo pipefail
          npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 -o /dev/null; then
              echo "Server ready after ${i} attempt(s)."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/next-start.pid)" 2>/dev/null; then
              echo "::error::next start process died during startup"
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::next start did not become ready within 120s"
          cat /tmp/next-start.log
          exit 1

      - name: Run public accessibility smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test e2e/accessibility.spec.ts --project=chromium --reporter=line

      # Blocking within this advisory job (pure layout-geometry assertions,
      # no a11y-debt exemptions) — same as pr-smoke.yml's original.
      - name: Run public mobile viewport checks
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --project=mobile-public --reporter=line

      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-smoke-playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  sentry-snapshot-capture:
    name: Capture + upload Sentry snapshots
    # PUSH TO MAIN / DISPATCH / LABEL ONLY (2026-09-23, PR throughput). Both
    # are advisory (never in `CI aggregate`) yet ran on most PRs, each taking
    # a runner slot plus an `npm ci` and a Playwright install while PRs
    # queued for slots. They now run on push to main (post-merge signal), on
    # `workflow_dispatch`, and on a PR carrying the `ci:e2e` label — labels
    # are read from the event, so add it BEFORE the push you want covered.
    # A PR run also needs `Next build` to have actually built (its artifact).
    needs: [next-build]
    if: >-
      needs.next-build.outputs.built == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOLFHELM_PLAYER_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
      GOLFHELM_PLAYER_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
      E2E_GOLF_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
      E2E_GOLF_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
      E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
      E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
      E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
      E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
      SENTRY_SNAPSHOTS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `if:` cannot read `secrets.*` directly, so this is a STEP inside the
      # job rather than a separate gate job (2026-09-06: folding the old
      # "Check Sentry snapshot prerequisites" job into a step here is exactly
      # the check-row collapse this change is for — every later step in this
      # job gates on `steps.token.outputs.enabled` instead).
      - name: Check for SENTRY_AUTH_TOKEN
        id: token
        env:
          TOKEN_SET: ${{ secrets.SENTRY_SNAPSHOTS_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SET" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN is not set — Sentry snapshot capture and upload are skipped. See docs/observability/SENTRY_SNAPSHOTS.md OWNER ACTION."
          fi

      - name: Setup Node
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.enabled == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download Next build artifact
        if: steps.token.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: next-build-${{ github.sha }}
          path: .next

      - name: Cache Playwright browsers
        if: steps.token.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.token.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      # No manual `next start` here: playwright.config.ts's own `webServer`
      # already runs `npm run start` in CI when PLAYWRIGHT_BASE_URL is unset
      # (unchanged from sentry-snapshots.yml's original — it never manually
      # started a server either). It now serves the DOWNLOADED artifact
      # instead of a build made in this job.
      - name: Capture Sentry snapshot screenshots
        if: steps.token.outputs.enabled == 'true'
        continue-on-error: true
        id: capture
        run: |
          npx playwright test \
            --project=chromium \
            --project=baseball-coach \
            --project=baseball-player \
            e2e/sentry-snapshots.spec.ts \
            e2e/sentry-snapshots-baseball.spec.ts

      - name: Count captured images
        id: count
        if: steps.token.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          dir="test-results/sentry-snapshots"
          if [ -d "$dir" ]; then
            count=$(find "$dir" -name '*.png' | wc -l | tr -d ' ')
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Captured $count image(s) in $dir"

      - name: Upload snapshots to Sentry
        if: steps.token.outputs.enabled == 'true' && steps.count.outputs.count != '0'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SNAPSHOTS_AUTH_TOKEN }}
          SENTRY_ORG: helm-xs
          SENTRY_PROJECT: javascript-nextjs
        run: |
          npx --yes @sentry/cli@3.7.0 snapshots upload test-results/sentry-snapshots \
            --app-id helm-web \
            --project javascript-nextjs

      - name: No images captured
        if: steps.token.outputs.enabled == 'true' && steps.count.outputs.count == '0'
        run: |
          echo "::warning::Sentry snapshots: 0 images captured — nothing uploaded. Check the Playwright report artifact below for the cause (likely a login failure)."

      - name: Upload Playwright report (debugging)
        if: always() && steps.token.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentry-snapshots-playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/sentry-snapshots/
          retention-days: 7
          if-no-files-found: warn

  all:
    # Renamed from the bare `all` (2026-08-19): review-gate.yml's aggregate
    # job was ALSO named `all`, so both workflows posted an identically-named
    # check run and a single required context "all" could not tell them
    # apart — see .github/branch-protection.md and docs/CI_RUNBOOK.md for the
    # PR #1125 incident this caused (a red BaseballHelm smoke merged because
    # Review Gate's "all" reported green while CI's "all" was still running).
    # This job's id stays `all` (nothing references it via `needs:` — grepped
    # repo-wide before renaming) so the diff is name-only; only the `name:`
    # field below is what GitHub uses as the check-run/required-context
    # string, and it must stay globally unique across every workflow.
    name: CI aggregate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read  # the superseded-run check reads the PR's live head
    # `supabase` (Supabase lint + RLS tests) is part of the hard gate: the
    # baseball pgTAP RLS suite was greened on main by #517 (supersedes #423), so
    # RLS regressions block merge through the required aggregate instead of
    # being advisory-only — the gap that let the anon-access hole reach main.
    #
    # `baseball-auth-smoke` and `unit-tests-timezone` are NOT in this gate
    # (owner 2026-08-26 / 2026-08-20, PR throughput) and, since 2026-09-23,
    # not in this workflow: they run nightly in .github/workflows/nightly.yml.
    # A red run there blocks the next release, not a merge.
    #
    # `static-checks` (2026-09-02) carries what used to be nine leaf jobs;
    # `lint` ("TypeScript + Lint", 2026-09-23) carries tsc, ESLint and the
    # ratchets. Nothing left this gate; it got fewer job names.
    # `pr-smoke-a11y` and `sentry-snapshot-capture` are deliberately NOT in
    # this list — both were, and remain, advisory-only.
    #
    # `unit-tests`, `next-build` and `supabase` no longer SKIP on a docs-only
    # PR — they apply the `code` path gate inside the job and finish green.
    # A skip now means a draft (handled first below) or something upstream
    # never ran, which still fails on a code PR.
    needs:
      - detect-changes
      - static-checks
      - lint
      - unit-tests
      - next-build
      - supabase
    steps:
      - name: Fail on a draft PR (full suite runs on ready_for_review)
        # Owner decision 2026-09-23: a draft run skips every gated job, and a
        # green aggregate from that run stayed attached to the head SHA after
        # the PR was marked ready, satisfying branch protection with nothing
        # tested (#2049). Failing here means only a real, non-draft run can
        # ever turn this required check green. (A skipped aggregate would be
        # worse: GitHub counts a skipped required check as passing.)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "Draft PR: gated jobs were skipped. The full suite runs when the PR is marked ready for review."
          exit 1

      # SUPERSEDED RUNS (2026-09-23). A new push to a PR cancels the running
      # suite (concurrency above), and this always() job used to turn that
      # cancellation into a red X on the old commit — noise on every
      # force-push or quick follow-up. A cancelled or skipped result is now
      # excused ONLY when the PR's live head is no longer this run's commit;
      # a cancellation on the current head (manual cancel, job timeout) and
      # any real failure still fail. Fail closed: if the live head cannot be
      # read, nothing is excused.
      - name: Fail if any required CI check failed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CODE: ${{ needs.detect-changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "needs results: $RESULTS (code=$CODE)"
          if jq -e 'index("failure")' <<< "$RESULTS" >/dev/null; then
            echo "One or more CI checks failed."; exit 1
          fi
          incomplete=false
          if jq -e 'index("cancelled")' <<< "$RESULTS" >/dev/null; then incomplete=true; fi
          if [ "$CODE" = "true" ] && jq -e 'index("skipped")' <<< "$RESULTS" >/dev/null; then incomplete=true; fi
          if [ "$incomplete" = "false" ]; then
            echo "CI hard gates clean."; exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            live="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha 2>/dev/null || true)"
            if [ -n "$live" ] && [ "$live" != "$RUN_HEAD" ]; then
              echo "::notice::Superseded: PR head is now ${live:0:12}, this run was for ${RUN_HEAD:0:12}. Cancelled jobs here are not a result."
              exit 0
            fi
          fi
          echo "One or more required CI checks were cancelled or skipped on the current head."
          exit 1
