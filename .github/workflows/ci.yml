name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database types are up to date
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # Generate fresh types to a temp file (override the redirect in package.json)
          npx supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" > /tmp/generated-types.ts 2>&1 || {
            echo "Could not generate types (project ID may be missing or invalid)"
            exit 0  # Don't fail CI if we can't verify
          }

          # Compare with committed version (if types file exists)
          if [ -f src/lib/types/database.ts ]; then
            if ! diff -q src/lib/types/database.ts /tmp/generated-types.ts > /dev/null 2>&1; then
              echo "Database types are out of date!"
              echo "Run SUPABASE_PROJECT_ID=<id> npm run db:types to regenerate"
              echo ""
              echo "Diff preview:"
              diff src/lib/types/database.ts /tmp/generated-types.ts | head -50 || true
              exit 1
            else
              echo "Database types are up to date"
            fi
          else
            echo "Warning: database.ts file not found"
          fi

      - name: Schema invariants (catch golf_team_coach_staff.user_id etc.)
        run: ./scripts/check-schema-invariants.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint ratchet (warnings must not grow per-rule)
        run: npm run lint:ratchet

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  supabase:
    name: Supabase lint + RLS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Lint migrations
        run: supabase db lint --schema public

      - name: Run pgTAP RLS suites
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          for f in supabase/tests/rls/*.sql; do
            # Skip the helpers file — it's included via \i from the others.
            case "$f" in
              */_helpers.sql) continue ;;
            esac
            echo "::group::$f"
            tmp_file="$tmp_dir/$(basename "$f")"
            {
              cat supabase/tests/rls/_helpers.sql
              grep -Ev '^\\i(r)? .*_helpers\.sql$' "$f"
            } > "$tmp_file"
            supabase test db "$tmp_file"
            echo "::endgroup::"
          done

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true
