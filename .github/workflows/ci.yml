name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fall back to a valid-format DUMMY on secretless runs (Dependabot / fork PRs
  # get no repo secrets). It only needs to be non-empty and NOT match
  # `placeholder.supabase.co` so the Supabase client guard doesn't throw — then
  # Next's cookies()->dynamic detection excludes auth/dashboard pages from
  # prerender, so the build makes no network call to it. Real PRs still use the
  # real secret; the dummy is never used at runtime.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  database-types:
    name: Database types drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database types are up to date
        run: npm run check:types-drift

  schema-invariants:
    name: Schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Check schema invariants
        run: ./scripts/check-schema-invariants.sh

  feature-knowledge:
    name: Feature knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check feature knowledge registry
        run: npm run knowledge:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  lint-ratchet:
    name: Lint ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint ratchet
        run: npm run lint:ratchet

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

  business-contracts:
    name: Business contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Business contracts
        run: npm run verify:business

  next-build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  supabase:
    name: Supabase lint + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_ID: helmv3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Lint migrations
        run: supabase db lint --schema public

      - name: Run pgTAP RLS suites
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          for f in supabase/tests/rls/*.sql; do
            case "$f" in
              */_helpers.sql) continue ;;
            esac
            echo "::group::$f"
            tmp_file="$tmp_dir/$(basename "$f")"
            {
              cat supabase/tests/rls/_helpers.sql
              grep -Ev '^\\i(r)? .*_helpers\.sql$' "$f"
            } > "$tmp_file"
            supabase test db "$tmp_file"
            echo "::endgroup::"
          done

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

  route-hygiene:
    name: Route Hygiene P0/P1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check route hygiene blockers
        run: |
          npm run ui:routes
          npm run routes:hygiene:p0p1

  import-cycles:
    name: Import-cycle ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Value-level import cycles typecheck and build cleanly but can crash at
      # cold runtime (TDZ) — the #803/#804 prod-crash class. Baseline-aware:
      # fails only on cycles not in .cycles-baseline.json.
      - name: Check for new runtime import cycles
        run: npm run check:cycles

  baseball-auth-smoke:
    name: BaseballHelm authenticated smoke
    # #372: promotes the already-built, already-mandatory baseball-smoke +
    # onboarding-smoke specs (e2e/baseball-smoke.spec.ts,
    # e2e/baseball-onboarding-smoke.spec.ts) from push/workflow_dispatch-only
    # (.github/workflows/playwright.yml's `e2e` job) into a required PR gate —
    # the same mechanism that promoted Supabase RLS tests into `all` (#517)
    # and the import-cycle ratchet (#808). Steps below are copied verbatim
    # from playwright.yml's readiness-check + fail-loud pattern, not moved:
    # the push/manual job keeps running the full mandatory suite (plus the
    # mobile-viewport regression) unchanged.
    #
    # Skips (does not fail) on fork/Dependabot pull_request runs, which
    # receive no repo secrets from GitHub by design — `all`'s aggregate step
    # only treats 'failure'/'cancelled' as blocking, so a skipped job here
    # never blocks an external contribution that structurally cannot supply
    # these secrets. Same-repo, non-Dependabot pushes and PRs still hard-fail
    # on missing secrets, same as the push-triggered version always has.
    # Dependabot PRs are opened against this repo (not a fork), so the
    # same-repo check alone does not exclude them — `github.actor` is
    # checked explicitly for that reason.
    #
    # COST NOTE: this doubles Playwright-browser-install + a full `npm run
    # build` on every PR from this repo, on top of the existing next-build /
    # Smoke-checks builds — a real, ongoing CI-minutes tradeoff the repo had
    # previously avoided by scoping full E2E to push-only. Revisit if PR
    # wall-clock time becomes a problem.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
      E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
      E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
      E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute BaseballHelm auth readiness
        id: baseball-auth-ready
        run: |
          missing=()
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "$E2E_BASEBALL_COACH_EMAIL" ] && missing+=("E2E_BASEBALL_COACH_EMAIL")
          [ -z "$E2E_BASEBALL_COACH_PASSWORD" ] && missing+=("E2E_BASEBALL_COACH_PASSWORD")
          [ -z "$E2E_BASEBALL_PLAYER_EMAIL" ] && missing+=("E2E_BASEBALL_PLAYER_EMAIL")
          [ -z "$E2E_BASEBALL_PLAYER_PASSWORD" ] && missing+=("E2E_BASEBALL_PLAYER_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "BaseballHelm auth secrets unavailable: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "BaseballHelm auth secrets available."
          fi

      - name: Fail missing BaseballHelm secrets
        if: steps.baseball-auth-ready.outputs.ready != 'true'
        env:
          MISSING_BASEBALL_SECRETS: ${{ steps.baseball-auth-ready.outputs.missing }}
        run: |
          echo "::error::Missing required secret(s): ${MISSING_BASEBALL_SECRETS}"
          echo "BaseballHelm authenticated smoke (#372) is a required PR gate on this repo and needs these secrets configured."
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Seed BaseballHelm CI accounts
        run: npm run seed:baseball:ci

      - name: Run BaseballHelm mandatory smoke (blocking)
        run: |
          npx playwright test \
            --project=chromium \
            --project=baseball-coach \
            --project=baseball-player \
            e2e/baseball-onboarding-smoke.spec.ts \
            e2e/baseball-smoke.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseball-auth-smoke-playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  all:
    name: all
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `supabase` (Supabase lint + RLS tests) is now part of the hard gate: the
    # baseball pgTAP RLS suite was greened on main by #517 (supersedes #423), so
    # RLS regressions now block merge through the required `all` check instead of
    # being advisory-only — the gap that let the anon-access hole reach main.
    #
    # `baseball-auth-smoke` (BaseballHelm authenticated coach/player smoke,
    # #372) is part of the hard gate for the same reason: an authenticated
    # smoke suite that only ran post-merge could not have caught a real
    # regression before it landed on `main`.
    needs:
      - database-types
      - schema-invariants
      - feature-knowledge
      - typecheck
      - lint
      - lint-ratchet
      - unit-tests
      - business-contracts
      - next-build
      - route-hygiene
      - supabase
      - import-cycles
      - baseball-auth-smoke
    steps:
      - name: Fail if any required CI check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI checks failed."
          exit 1

      - name: All CI checks green
        run: echo "CI hard gates clean."
