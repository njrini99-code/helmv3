name: Feature Awareness

# Advisory PR workflow for the repo-native AI feature-awareness layer.
# It maps changed files through memory/registry.yml and uploads a context
# pack that Codex/Claude reviewers can use. Keep this non-blocking
# until registry coverage is stable across normal PR traffic.
#
# Gated on code-relevant paths (added 2026-09-05): the report only makes
# sense for a diff that touches feature code — a docs-only or CI-config PR
# has nothing for memory/registry.yml to map. `detect-changes` below calls
# the same shared .github/workflows/detect-changes.yml every other
# path-gated workflow in this repo calls (2026-09-06) and reads its
# `mapped_feature_code` output (this job's own `code` concept, renamed to
# avoid colliding with the shared workflow's differently-scoped `code`
# output) — same fail-closed rule as before: any inability to classify, or
# any non-pull_request event such as workflow_dispatch, resolves to
# mapped_feature_code=true.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: feature-awareness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reusable workflow (2026-09-06) — see .github/workflows/detect-changes.yml.
  # This job used to run its own hand-rolled git-diff classifier (not
  # dorny/paths-filter, since "every changed file is docs/markdown" isn't an
  # include-list shape); that logic moved into the shared workflow verbatim
  # as its `docs_only`/`mapped_feature_code` outputs — renamed from this
  # job's own `code` output to avoid colliding with ci.yml's differently-
  # scoped `code` output, since both are now produced by the same call.
  detect-changes:
    name: Detect changes
    uses: ./.github/workflows/detect-changes.yml

  report:
    name: Build context pack
    needs: detect-changes
    if: needs.detect-changes.outputs.mapped_feature_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > changed-files.txt
          fi
          cat changed-files.txt

      - name: Build feature-awareness report
        run: |
          node scripts/knowledge/workflow-report.mjs \
            --changed-files changed-files.txt \
            --output-dir feature-awareness-report

      - name: Show summary
        run: cat feature-awareness-report/summary.md

      - name: Upload feature-awareness artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: feature-awareness-report
          path: feature-awareness-report/
          retention-days: 14
