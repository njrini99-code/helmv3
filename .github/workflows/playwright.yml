name: Playwright E2E

# Full browser CI — main branch pushes and manual workflow_dispatch only.
# Pull requests use .github/workflows/pr-smoke.yml (cheap public a11y subset).
#
# SECURITY: zero untrusted user input in run: blocks except github.sha.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run full Playwright E2E suite
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      screenshots:
        description: Capture course picker screenshots
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      baseball_seeded:
        description: Run seeded BaseballHelm smoke
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  E2E_GOLF_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
  E2E_GOLF_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
  E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
  E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
  E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
  COMMIT_SHA: ${{ github.sha }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  smoke:
    name: Smoke checks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (chromium)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Compute BaseballHelm auth readiness
        id: baseball-auth-ready
        run: |
          missing=()
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "$E2E_BASEBALL_COACH_EMAIL" ] && missing+=("E2E_BASEBALL_COACH_EMAIL")
          [ -z "$E2E_BASEBALL_COACH_PASSWORD" ] && missing+=("E2E_BASEBALL_COACH_PASSWORD")
          [ -z "$E2E_BASEBALL_PLAYER_EMAIL" ] && missing+=("E2E_BASEBALL_PLAYER_EMAIL")
          [ -z "$E2E_BASEBALL_PLAYER_PASSWORD" ] && missing+=("E2E_BASEBALL_PLAYER_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "BaseballHelm auth secrets unavailable: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "BaseballHelm auth secrets available."
          fi

      - name: Fail missing BaseballHelm secrets on main runs
        if: steps.baseball-auth-ready.outputs.ready != 'true'
        env:
          MISSING_BASEBALL_SECRETS: ${{ steps.baseball-auth-ready.outputs.missing }}
        run: |
          echo "::error::Missing required secret(s): ${MISSING_BASEBALL_SECRETS}"
          echo "Main-branch Playwright needs BaseballHelm E2E secrets for seeded smoke."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Seed BaseballHelm E2E fixtures (issue 375)
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run seed:baseball:e2e -- --confirm

      - name: Seed BaseballHelm CI accounts
        if: steps.baseball-auth-ready.outputs.ready == 'true'
        run: npm run seed:baseball:ci

      # One invocation = one dev-server lifecycle. The mobile viewport
      # regression projects (blocking; e2e/mobile-viewports.spec.ts — the
      # #799/#806 phone-width defect classes at 320/390/430px) ride the same
      # Playwright process as the mandatory smoke instead of booting a second
      # webServer that could hit port-3000 contention.
      - name: Run BaseballHelm mandatory smoke + mobile viewport regression (blocking)
        if: steps.baseball-auth-ready.outputs.ready == 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --project=baseball-coach \
            --project=baseball-player \
            --project=mobile-public \
            --project=mobile-coach \
            --project=mobile-player \
            e2e/baseball-onboarding-smoke.spec.ts \
            e2e/baseball-smoke.spec.ts \
            e2e/mobile-viewports.spec.ts

      # NOTE: previously `|| echo "Playwright suite has failures..."`, which
      # masked the exit code for every spec in this job — a real failure
      # here looked identical to a clean pass in the GitHub Actions UI
      # (flagged as blocking trust in the e2e gate on #812 review). This job
      # ("Playwright (chromium)") is advisory, not a required check (see
      # docs/CI_RUNBOOK.md / .github/branch-protection.md), so unmasking it
      # cannot newly block a merge — it only makes this job's own status
      # honestly reflect whether the suite passed. The report/results-json
      # upload steps below still run regardless (`if: always()`).
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASEBALL_SEEDED: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && '1' || '' }}
        run: timeout 45m npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-json
          path: test-results/
          retention-days: 3

  picker-screenshots:
    name: Course picker screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Run course-library spec (capture screenshots)
        run: npx playwright test course-library.spec.ts --reporter=line || echo "course-library spec had failures — see screenshots/report artifacts"

      - name: Upload course-picker screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: course-picker-screenshots
          path: e2e-screenshots/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Playwright report (picker)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picker-playwright-report
          path: playwright-report/
          retention-days: 3

  baseball-smoke:
    name: BaseballHelm seeded smoke (advisory)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.baseball_seeded == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASEBALL_SEEDED: ${{ secrets.PLAYWRIGHT_BASEBALL_SEEDED }}
      E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
      E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
      E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
      E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Run baseball-smoke spec
        run: npx playwright test baseball-stats-smoke.spec.ts --reporter=line || echo "baseball-smoke had failures — see report artifact"

      - name: Upload Playwright report (baseball-smoke)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseball-smoke-playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
