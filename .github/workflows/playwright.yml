name: Playwright E2E

# E2E tests against a real Next.js dev server. The playwright.config.ts
# webServer block starts `npm run dev` automatically.
#
# Plan 02 Task 9 in docs/v3-testing-standards.md flagged this as the
# missing required check — this workflow closes that gap.
#
# SECURITY: zero untrusted user input. The only github.* expression in
# any run: block is github.sha (40-char hex commit ID). Secrets are
# passed via env:, not interpolated into shell strings.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared across jobs. Secrets resolve to '' when unset (the Golf authed
# specs then test.skip()). The BaseballHelm mandatory smoke suite (#372)
# runs as a hard gate only when the required secrets are available. GitHub
# withholds repo secrets from Dependabot/fork PRs, so those PRs skip only
# the secret-backed baseball seed/smoke path and still run the rest of E2E.
# NEXT_PUBLIC_REDESIGN renders the Fairway shell — what production serves —
# so authed specs exercise FairwayCoursePicker.
env:
  # Fall back to a valid-format DUMMY on secretless runs (Dependabot / fork PRs
  # get no repo secrets) so the build-only "Smoke checks" job passes. The dummy
  # just has to be non-empty and NOT `placeholder.supabase.co` so the Supabase
  # client guard doesn't throw; cookies()->dynamic keeps auth pages out of
  # prerender, so no network call is made to it. Real PRs use the real secret.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  NEXT_PUBLIC_REDESIGN: 'true'
  E2E_GOLF_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
  E2E_GOLF_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
  # Service-role key for scripts/seed-baseball-e2e.ts (issue #375) and
  # scripts/seed-baseball-demo.ts (issue #372). Same "resolves to '' when
  # unset" pattern as the golf E2E secrets above — the #375 seed step is
  # skipped and its specs self-skip via PLAYWRIGHT_BASEBALL_SEEDED, while
  # the #372 mandatory smoke (below) fails loudly instead, since it's meant
  # to be a hard CI gate rather than an opportunistic/skippable suite.
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # BaseballHelm mandatory smoke (#372) — see e2e/README.md.
  E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
  E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
  E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
  E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
  COMMIT_SHA: ${{ github.sha }}
  # The `npm run build` step (both jobs) OOMs at Node's ~4GB default heap on
  # the CI runner — the same OOM that fails the `build` check. The standard
  # GitHub Linux runner has 16GB RAM; raise the V8 old-space ceiling clear of
  # the build peak. A ceiling (not an allocation) — safe for the dev server +
  # Playwright runner that follow.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    # 30 -> 40: the BaseballHelm mandatory smoke (#372) adds a seed step plus
    # two extra `playwright test` invocations, each of which boots its own
    # `npm run dev` webServer (CI disables reuseExistingServer).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Fails in seconds instead of minutes when a required secret is
      # missing/empty. The BaseballHelm mandatory smoke below is a hard gate
      # (no `|| echo` shim) — without this check a missing secret surfaces
      # 15-20 minutes in as an opaque login/seed failure after `npm ci` +
      # `npm run build` + browser install have already run. Golf's
      # E2E_GOLF_* vars are intentionally NOT checked here: those specs
      # self-skip when unset (see course-library.spec.ts), so an empty value
      # is a valid, supported state for them — only the vars that make a
      # later step unconditionally fail belong in this gate.
      - name: Verify required secrets are present
        run: |
          missing=()
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "$E2E_BASEBALL_COACH_PASSWORD" ] && missing+=("E2E_BASEBALL_COACH_PASSWORD")
          [ -z "$E2E_BASEBALL_PLAYER_PASSWORD" ] && missing+=("E2E_BASEBALL_PLAYER_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            echo "The BaseballHelm mandatory smoke (#372) needs these to seed + log in the CI baseball accounts."
            echo "Set them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets present."

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Seed BaseballHelm E2E fixtures (issue 375)
        # Only runs when SUPABASE_SERVICE_ROLE_KEY is available (not present
        # on fork PRs) — mirrors the existing E2E_GOLF_* secret gating below.
        # --confirm is required by the script itself; without it the script
        # only prints a dry-run plan and writes nothing.
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run seed:baseball:e2e -- --confirm

      - name: Seed BaseballHelm CI accounts
        # Secretless Dependabot/fork PRs cannot run this safely because GitHub
        # does not expose SUPABASE_SERVICE_ROLE_KEY to them. Trusted PRs keep
        # the hard seed/smoke path below. Idempotent: safe to re-run on every
        # CI build with secrets (upserts by deterministic id).
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run seed:baseball:ci

      - name: Run BaseballHelm mandatory smoke (blocking)
        # #372 — on trusted PRs with secrets, these must actually execute for CI
        # to be green. No `|| echo` soft-fail shim: a failure here still fails
        # the job. Secretless Dependabot/fork PRs skip this step explicitly.
        if: >-
          ${{
            env.SUPABASE_SERVICE_ROLE_KEY != '' &&
            env.E2E_BASEBALL_COACH_EMAIL != '' &&
            env.E2E_BASEBALL_COACH_PASSWORD != '' &&
            env.E2E_BASEBALL_PLAYER_EMAIL != '' &&
            env.E2E_BASEBALL_PLAYER_PASSWORD != ''
          }}
        run: |
          npx playwright test --project=baseball-coach --project=baseball-player
          npx playwright test --project=chromium e2e/baseball-onboarding-smoke.spec.ts

      - name: Explain skipped BaseballHelm mandatory smoke
        if: >-
          ${{
            env.SUPABASE_SERVICE_ROLE_KEY == '' ||
            env.E2E_BASEBALL_COACH_EMAIL == '' ||
            env.E2E_BASEBALL_COACH_PASSWORD == '' ||
            env.E2E_BASEBALL_PLAYER_EMAIL == '' ||
            env.E2E_BASEBALL_PLAYER_PASSWORD == ''
          }}
        run: |
          echo "Skipping BaseballHelm mandatory smoke because required E2E secrets are unavailable."
          echo "This is expected for Dependabot and fork pull_request runs."

      - name: Run Playwright tests
        env:
          # Gates the rewritten Camps/Pipeline/Box Score specs onto the
          # fixtures the seed step above just provisioned. Left unset (falsy)
          # when the seed step was skipped, so those specs self-skip instead
          # of failing against an unseeded database.
          PLAYWRIGHT_BASEBALL_SEEDED: >-
            ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && '1' || '' }}
        # Don't fail the build on E2E flake while the suite is being
        # stabilized. Once it's reliably green for a week, replace the
        # `|| echo` shim with a hard `npm run test:e2e` and add as a
        # required status check via .github/branch-protection.md.
        # Scoped to --project=chromium: the BaseballHelm mandatory smoke
        # (setup/baseball-coach/baseball-player projects, run above) is
        # intentionally excluded from this soft-fail path.
        run: npx playwright test --project=chromium || echo "Playwright suite has failures — see report artifact"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-json
          path: test-results/
          retention-days: 14

  # Dedicated, isolated job that runs ONLY the course-library spec (which
  # includes the FairwayCoursePicker screenshot capture) and uploads the
  # images. Separated from `e2e` because the full suite currently has many
  # pre-existing failing specs (auth/baseball) that each retry 3×30s and
  # exhaust the 30-min budget before course-library would ever run — so the
  # screenshots were never produced. This job finishes in ~8 min.
  picker-screenshots:
    name: Course picker screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Run course-library spec (capture screenshots)
        # Never fail the job on a test issue — the deliverable is the images.
        run: npx playwright test course-library.spec.ts --reporter=line || echo "course-library spec had failures — see screenshots/report artifacts"

      - name: Upload course-picker screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: course-picker-screenshots
          path: e2e-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report (picker)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picker-playwright-report
          path: playwright-report/
          retention-days: 14

  # Isolated, advisory job for the seeded BaseballHelm stats-surface smoke
  # (#382). Isolated for the same reason as `picker-screenshots`: the shared
  # `e2e` job's full suite has pre-existing failing specs that would exhaust
  # its 30-min budget before this ever ran, AND baseball-phase1.spec.ts /
  # this spec's Tier-2 assertions are gated by the SAME PLAYWRIGHT_BASEBALL_SEEDED
  # flag — running them in the shared job would make `e2e`'s pass/fail depend
  # on baseball fixture credentials it doesn't otherwise need. The seeded
  # credentials below are therefore scoped to ONLY this job's `env:`, not the
  # workflow-level `env:` block, so no other job's specs see them.
  #
  # ADVISORY/NON-BLOCKING: the `|| echo` guard on the test step means this job
  # can never fail the PR. Promotion path: once it has been green across
  # several consecutive runs (recommend N >= 10, or one week of merges to
  # main), remove the `|| echo "..."` suffix below so a real failure fails the
  # job — at that point also remove `continue-on-error` from any branch
  # protection config that references this job, if one was added.
  #
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   PLAYWRIGHT_BASEBALL_SEEDED   = "1"
  #   E2E_BASEBALL_COACH_EMAIL     (a seeded BaseballHelm college coach, e.g.
  #                                  the Rini demo's njrini99@gmail.com)
  #   E2E_BASEBALL_COACH_PASSWORD
  #   E2E_BASEBALL_PLAYER_EMAIL    (a seeded player on that coach's team, e.g.
  #                                  the Rini demo's rinin376@gmail.com)
  #   E2E_BASEBALL_PLAYER_PASSWORD
  #   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are inherited
  #   from the workflow-level env: block above (same Supabase project the
  #   fixture accounts were seeded into).
  #
  # One-time seeding command (run locally / from a trusted shell against the
  # target Supabase project — needs SUPABASE_SERVICE_ROLE_KEY, which is NOT a
  # CI secret consumed by this job):
  #   DOTENV_CONFIG_PATH=.env.local npx tsx -r dotenv/config \
  #     scripts/seed-rini-baseball-demo.ts --confirm
  baseball-smoke:
    name: BaseballHelm seeded smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASEBALL_SEEDED: ${{ secrets.PLAYWRIGHT_BASEBALL_SEEDED }}
      E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
      E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
      E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
      E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Run baseball-smoke spec
        # Advisory only — see job comment above for the promotion path.
        run: npx playwright test baseball-stats-smoke.spec.ts --reporter=line || echo "baseball-smoke had failures — see report artifact"

      - name: Upload Playwright report (baseball-smoke)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseball-smoke-playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
