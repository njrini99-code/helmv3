name: Playwright E2E

# E2E tests against a real Next.js dev server. The playwright.config.ts
# webServer block starts `npm run dev` automatically.
#
# Plan 02 Task 9 in docs/v3-testing-standards.md flagged this as the
# missing required check — this workflow closes that gap.
#
# SECURITY: zero untrusted user input. The only github.* expression in
# any run: block is github.sha (40-char hex commit ID). Secrets are
# passed via env:, not interpolated into shell strings.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared across jobs. Secrets resolve to '' when unset (the Golf authed
# specs then test.skip()). The BaseballHelm mandatory smoke suite (#372)
# diverges: playwright/baseball-auth.setup.ts THROWS on missing/broken
# E2E_BASEBALL_* secrets here (CI is always truthy on GitHub Actions), so
# that suite fails the job loudly instead of silently skipping.
# NEXT_PUBLIC_REDESIGN renders the Fairway shell — what production serves —
# so authed specs exercise FairwayCoursePicker.
env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_REDESIGN: 'true'
  E2E_GOLF_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
  E2E_GOLF_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
  # Service-role key for scripts/seed-baseball-e2e.ts (issue #375) and
  # scripts/seed-baseball-demo.ts (issue #372). Same "resolves to '' when
  # unset" pattern as the golf E2E secrets above — the #375 seed step is
  # skipped and its specs self-skip via PLAYWRIGHT_BASEBALL_SEEDED, while
  # the #372 mandatory smoke (below) fails loudly instead, since it's meant
  # to be a hard CI gate rather than an opportunistic/skippable suite.
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # BaseballHelm mandatory smoke (#372) — see e2e/README.md.
  E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
  E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
  E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
  E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
  COMMIT_SHA: ${{ github.sha }}
  # The `npm run build` step (both jobs) OOMs at Node's ~4GB default heap on
  # the CI runner — the same OOM that fails the `build` check. The standard
  # GitHub Linux runner has 16GB RAM; raise the V8 old-space ceiling clear of
  # the build peak. A ceiling (not an allocation) — safe for the dev server +
  # Playwright runner that follow.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    # 30 -> 40: the BaseballHelm mandatory smoke (#372) adds a seed step plus
    # two extra `playwright test` invocations, each of which boots its own
    # `npm run dev` webServer (CI disables reuseExistingServer).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Seed BaseballHelm E2E fixtures (issue 375)
        # Only runs when SUPABASE_SERVICE_ROLE_KEY is available (not present
        # on fork PRs) — mirrors the existing E2E_GOLF_* secret gating below.
        # --confirm is required by the script itself; without it the script
        # only prints a dry-run plan and writes nothing.
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run seed:baseball:e2e -- --confirm

      - name: Seed BaseballHelm CI accounts
        # scripts/seed-baseball-demo.ts validates SUPABASE_SERVICE_ROLE_KEY /
        # NEXT_PUBLIC_SUPABASE_URL itself and exits non-zero with a clear
        # message if either is absent — that failure is the "secrets are
        # missing" guard for the blocking step below. Idempotent: safe to
        # re-run on every CI build (upserts by deterministic id).
        run: npm run seed:baseball:ci

      - name: Run BaseballHelm mandatory smoke (blocking)
        # #372 — these must actually execute for CI to be green. No `|| echo`
        # soft-fail shim: a failure here (including baseball-auth.setup.ts
        # throwing on missing/broken E2E_BASEBALL_* secrets) fails the job.
        run: |
          npx playwright test --project=baseball-coach --project=baseball-player
          npx playwright test --project=chromium e2e/baseball-onboarding-smoke.spec.ts

      - name: Run Playwright tests
        env:
          # Gates the rewritten Camps/Pipeline/Box Score specs onto the
          # fixtures the seed step above just provisioned. Left unset (falsy)
          # when the seed step was skipped, so those specs self-skip instead
          # of failing against an unseeded database.
          PLAYWRIGHT_BASEBALL_SEEDED: >-
            ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && '1' || '' }}
        # Don't fail the build on E2E flake while the suite is being
        # stabilized. Once it's reliably green for a week, replace the
        # `|| echo` shim with a hard `npm run test:e2e` and add as a
        # required status check via .github/branch-protection.md.
        # Scoped to --project=chromium: the BaseballHelm mandatory smoke
        # (setup/baseball-coach/baseball-player projects, run above) is
        # intentionally excluded from this soft-fail path.
        run: npx playwright test --project=chromium || echo "Playwright suite has failures — see report artifact"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-json
          path: test-results/
          retention-days: 14

  # Dedicated, isolated job that runs ONLY the course-library spec (which
  # includes the FairwayCoursePicker screenshot capture) and uploads the
  # images. Separated from `e2e` because the full suite currently has many
  # pre-existing failing specs (auth/baseball) that each retry 3×30s and
  # exhaust the 30-min budget before course-library would ever run — so the
  # screenshots were never produced. This job finishes in ~8 min.
  picker-screenshots:
    name: Course picker screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (so dev server boots fast)
        run: npm run build

      - name: Run course-library spec (capture screenshots)
        # Never fail the job on a test issue — the deliverable is the images.
        run: npx playwright test course-library.spec.ts --reporter=line || echo "course-library spec had failures — see screenshots/report artifacts"

      - name: Upload course-picker screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: course-picker-screenshots
          path: e2e-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report (picker)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: picker-playwright-report
          path: playwright-report/
          retention-days: 14
