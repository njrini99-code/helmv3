name: Playwright E2E

# Full browser CI — MANUAL workflow_dispatch only.
#
# Pull requests use .github/workflows/pr-smoke.yml (cheap public a11y subset).
#
# The `smoke` job ("Smoke checks") that used to live here is GONE as of
# 2026-09-02. It was `npm ci` + `npm run build` and nothing else — the exact
# steps ci.yml's `Next build` job already runs on every PR and every push to
# main, with the same env — so every pull request paid for two identical
# 8-to-9-minute builds and two runner slots to learn one fact. It was also a
# required branch-protection context, so removing the JOB without first
# removing the CONTEXT would have made every PR unsatisfiable (the phantom
# check trap in .github/branch-protection.md). The context was dropped from
# main's required set in the same change; `CI aggregate` carries the build
# verdict. Verified by reading the check-run names on a PR head, not by
# assuming: .github/branch-protection.md shows the command.
#
# With `smoke` gone, nothing in this file runs on push or pull_request, so
# those triggers (and the merge_group one) are gone too — a workflow that
# fires on every event and skips every job still costs a run and a line on
# the PR.
#
# SECURITY: zero untrusted user input in run: blocks except github.sha.

on:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run full Playwright E2E suite
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  # One manual run per ref at a time; a newer dispatch supersedes a queued one.
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  E2E_GOLF_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
  E2E_GOLF_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
  COMMIT_SHA: ${{ github.sha }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  e2e:
    name: Playwright (chromium)
    # MANUAL ONLY (owner 2026-08-20): chromium E2E no longer runs automatically
    # on push to main — it was PR-skipped already and its post-merge run also
    # seeded PRODUCTION fixtures. Trigger on demand via the workflow_dispatch
    # "Run full Playwright E2E suite" input when you actually want it.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.full_e2e == 'true'
    runs-on: ubuntu-latest
    # MUST stay comfortably above the `timeout <N>m` on "Run Playwright
    # tests" below, plus the ~25min of setup that precedes it (npm ci,
    # browser install, next build, and the blocking mobile smoke). When the JOB timeout fires first, GitHub cancels
    # the job outright and the `if: always()` artifact-upload steps never
    # run — which is how #953 produced three consecutive `cancelled` runs
    # with no report to diagnose from. Step timeout < job timeout is what
    # keeps a slow suite an honest red instead of a silent cancel.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (the suite serves this build via `next start`)
        run: npm run build

      # ⚠️ THESE TWO STEPS STILL WRITE TO PRODUCTION, and now say so out loud.
      #
      # The per-PR required gate (.github/workflows/ci.yml's
      # `baseball-auth-smoke`) was moved to a throwaway local stack on
      # BASEBALL IS GONE FROM THIS WORKFLOW (owner, 2026-08-20: "get rid of
      # the playwright baseball thing" / "stop seeding baseball every time").
      # The two steps that stood here seeded PRODUCTION baseball fixtures
      # (--allow-prod) before every run — which, while this job still ran on
      # push, meant every merge to main wrote to the live database. The
      # workflow env no longer carries SUPABASE_SERVICE_ROLE_KEY or any
      # E2E_BASEBALL_* secret, so this workflow cannot write to production
      # even if a step is added back by mistake — the specs self-skip without
      # them. Baseball E2E coverage lives in ci.yml's baseball-auth-smoke,
      # which seeds a LOCAL throwaway stack and gates PRs via CI aggregate.
      # One invocation = one webServer lifecycle (CI serves the production
      # build via `next start` — see playwright.config.ts). The mobile viewport
      # regression projects (blocking; e2e/mobile-viewports.spec.ts — the
      # #799/#806 phone-width defect classes at 320/390/430px) ride the same
      # Playwright process as the mandatory smoke instead of booting a second
      # webServer that could hit port-3000 contention.
      - name: Run mobile viewport regression (blocking)
        run: |
          npx playwright test \
            --project=chromium \
            --project=mobile-public \
            --project=mobile-coach \
            --project=mobile-player \
            e2e/mobile-viewports.spec.ts

      # NOTE: previously `|| echo "Playwright suite has failures..."`, which
      # masked the exit code for every spec in this job — a real failure
      # here looked identical to a clean pass in the GitHub Actions UI
      # (flagged as blocking trust in the e2e gate on #812 review). This job
      # ("Playwright (chromium)") is advisory, not a required check (see
      # docs/CI_RUNBOOK.md / .github/branch-protection.md), so unmasking it
      # cannot newly block a merge — it only makes this job's own status
      # honestly reflect whether the suite passed. The report/results-json
      # upload steps below still run regardless (`if: always()`).
      # `--retries=1` overrides the global `retries: CI ? 2` from
      # playwright.config.ts for THIS step only. Per #953, the documented
      # spec-drift backlog means a chunk of this suite fails deterministically
      # — and every one of those burned 3x its timeout re-running a failure
      # that was never going to pass. One retry still absorbs a genuine flake;
      # the second only ever bought us a slower red. The blocking smoke step
      # above deliberately keeps the full 2 retries.
      - name: Run Playwright tests
        run: timeout 60m npx playwright test --project=chromium --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-json
          path: test-results/
          retention-days: 3
