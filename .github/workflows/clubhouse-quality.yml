name: Clubhouse presentation quality

# Development fixtures, no credentials or database seeding. Authenticated
# production and physical iPhone evidence remain separate release checks.
on:
  # ready_for_review plus the GitHub defaults: the job below skips while the PR
  # is a draft (plan 5.4), so marking it ready needs its own event to run it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/clubhouse/**'
      - 'src/app/clubhouse-preview/**'
      - 'e2e/clubhouse-quality.spec.ts'
      - 'e2e/clubhouse-gate.spec.ts'
      - 'e2e/clubhouse-motion-gate.spec.ts'
      - 'e2e/clubhouse-pixels.spec.ts'
      - 'e2e/clubhouse-gate/**'
      - 'e2e/clubhouse-ui-check.spec.ts'
      - 'e2e/clubhouse-ui-check/**'
      - 'e2e/clubhouse-playground.spec.ts'
      - 'e2e/clubhouse-quality.setup.ts'
      - 'playwright.clubhouse.config.ts'
      - 'next.config.mjs'
      - 'src/lib/security/clubhouse-preview-headers.mjs'
      - 'scripts/clubhouse/**'
      - 'config/clubhouse/**'
      - 'config/stylelint.clubhouse.config.mjs'
      - 'scripts/clubhouse/__tests__/a11y.test.mjs'
      - '.github/workflows/clubhouse-quality.yml'
      - 'package.json'
      - 'package-lock.json'
  # Nightly on main (tool-08): the check never ran on main before, so main's state was unknown between PRs (it was red
  # from 13 Nov and nobody saw). The nightly run also renders the pixel baselines every PR run compares against.
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: All popup variants and viewport sizes
        type: boolean
        default: true
      visual:
        description: Compare against externally reviewed baselines (never update)
        type: boolean
        default: false
      baseline_run_id:
        description: Workflow run containing clubhouse-quality-baselines artifact for matching Linux/browser version
        type: string
        required: false
      screens:
        description: Also open every public page and every Clubhouse fixture state, phone and desk, light and dark, into one gallery
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: clubhouse-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-presentation-fixture-only
  NEXT_PUBLIC_SUPABASE_ANON_KEY: local-presentation-fixture-only
  NEXT_TELEMETRY_DISABLED: '1'
  CH_QUALITY: '1'
  CH_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '1' || '0' }}
  CH_VISUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.visual && '1' || '0' }}
  CH_VISUAL_BASELINES: ${{ github.workspace }}/.helm/screenshots/clubhouse/quality-baselines

jobs:
  presentation:
    # Skip while draft, like every gated job in ci.yml (owner decision, PR
    # throughput): a draft cannot merge, so running a 35-minute browser suite on
    # each draft push only burns runner slots. Written so workflow_dispatch,
    # where there is no pull_request payload, still runs.
    # Not on a follow-up push (2026-10-21, runner slots): it runs when the PR
    # is opened, reopened or marked ready, and on demand
    # (`gh workflow run clubhouse-quality.yml --ref <branch>`).
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft != true && github.event.action != 'synchronize')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm
      - run: node --test scripts/clubhouse/__tests__/*.test.mjs
      - name: Component catalog is current
        run: npm run clubhouse:catalog -- --check
      - name: Clubhouse CSS quality
        run: npm run clubhouse:css
      - run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Require reviewed baseline source for visual mode
        if: inputs.visual
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          if ! [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Visual comparison requires a numeric baseline_run_id containing reviewed clubhouse-quality-baselines.'
            exit 1
          fi
      - name: Download reviewed baselines
        if: inputs.visual
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: clubhouse-quality-baselines
          path: .helm/screenshots/clubhouse/quality-baselines
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - name: Smoke normal and reduced motion in Chromium and WebKit
        timeout-minutes: 25
        run: >-
          ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts
          --project chromium-no-preference --project chromium-reduce --project webkit-no-preference --project webkit-reduce
          --output test-results/clubhouse-quality/smoke
      # Boxes leaving their card, clipped text, nested cards, small type and targets, contrast, page edge: at 390x844 in WebKit and
      # 1440x900 in Chromium, light and dark, on stress fixtures. A known failure is marked with its bug and must keep failing until fixed.
      # Each step keeps its own output folder: Playwright empties its output folder when it starts, so a shared one kept
      # only the last step's evidence. The gate runs even when the smoke fails (it is a separate question).
      - name: Presentation gate
        if: ${{ !cancelled() && !inputs.visual }}
        # 144 page loads at about 10 s, and each failing case restarts its worker and loads its page again. With ~70 red
        # cases the 1,296 cases pass 40 minutes, and the step was killed before it printed one reason (24 and 25 Nov 2026).
        timeout-minutes: 60
        env:
          CH_GATE_REPORT: test-results/clubhouse-quality/gate-report.jsonl
        run: ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts --project gate-phone --project gate-desktop --output test-results/clubhouse-quality/gate
      # Motion is a release gate (owner): what animates on every phone gate screen, from its first frame, with and
      # without Reduce Motion, against D-64 (e2e/clubhouse-motion-gate.spec.ts; known breaks may only shrink).
      - name: Motion gate (WebKit, phone)
        if: ${{ !cancelled() && !inputs.visual }}
        # Advisory for its first week on main: its known list was recorded on a Mac, and a week of Linux runs shows
        # whether timing moves any entry. Then remove this line so a new break fails the job.
        continue-on-error: true
        timeout-minutes: 20
        env:
          CH_MOTION_REPORT: test-results/clubhouse-quality/motion-report.jsonl
        run: ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts --project motion-phone --output test-results/clubhouse-quality/motion
      # Pixel regression (advisory). Nightly on main renders the baselines; a PR or dispatch run compares against the
      # newest nightly set from main, so both sides are the same Linux image and browser build.
      - name: Render pixel baselines (nightly on main)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        timeout-minutes: 25
        env:
          CH_PIXELS: '1'
          CH_VISUAL_BASELINES: ${{ github.workspace }}/.helm/screenshots/clubhouse/pixel-baselines
        run: >-
          ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts
          --project pixels-phone --project pixels-desktop --update-snapshots=all
          --output test-results/clubhouse-quality/pixels
      - name: Upload pixel baselines
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clubhouse-pixel-baselines
          path: .helm/screenshots/clubhouse/pixel-baselines/
          if-no-files-found: error
          retention-days: 30
      - name: Fetch the newest pixel baselines from main
        id: baselines
        if: ${{ !cancelled() && github.event_name != 'schedule' && !inputs.visual }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(gh run list -R "$REPO" --workflow clubhouse-quality.yml --branch main --event schedule --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then echo "No nightly baseline run on main yet; pixel comparison skipped."; exit 0; fi
          gh run download "$run_id" -R "$REPO" -n clubhouse-pixel-baselines -D .helm/screenshots/clubhouse/pixel-baselines
          echo "found=1" >> "$GITHUB_OUTPUT"
          echo "Comparing against nightly run $run_id."
      - name: Pixel comparison against main (advisory)
        if: ${{ !cancelled() && steps.baselines.outputs.found == '1' }}
        continue-on-error: true
        timeout-minutes: 25
        env:
          CH_PIXELS: '1'
          CH_VISUAL_BASELINES: ${{ github.workspace }}/.helm/screenshots/clubhouse/pixel-baselines
        run: ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts --project pixels-phone --project pixels-desktop --output test-results/clubhouse-quality/pixels
      # Every screen that needs no session: the public pages of all three products and every Clubhouse fixture state
      # (scripts/screens/sweep.mjs, its own next dev with the env blanked). Mock data only, so the gallery is safe to upload.
      - name: Every public and fixture screen (gallery)
        if: ${{ !cancelled() && inputs.screens }}
        timeout-minutes: 60
        run: node scripts/screens/sweep.mjs --start-dev --access public,fixture --out screens-gallery
      - name: Upload the screen gallery
        if: ${{ !cancelled() && inputs.screens }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screens-gallery-${{ github.run_id }}
          path: screens-gallery/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload diagnostic screenshots, reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clubhouse-quality-evidence
          path: |
            test-results/clubhouse-quality/
            playwright-report/clubhouse-quality/
          if-no-files-found: warn
          retention-days: 14

  # The Clubhouse UI check (design lab dsx-09, GAP-Q1): every live coach and player screen at a phone size (WebKit,
  # iPhone 17 Pro) and a desk size (Chromium, 1440x900) renders without an uncaught error, holds its axe record
  # (WCAG 2.2 A/AA; e2e/clubhouse-ui-check/known-axe.json may only shrink) and leaves a full-page screenshot. About 50
  # page loads on one dev server, so it runs on every non-draft push, unlike `presentation`. It is built to block a
  # merge but is NOT a required check: making it one is the owner's setting in GitHub branch protection (job name
  # "Clubhouse UI check"). As a required check it would also need to report on PRs outside the path filter above.
  ui-check:
    name: Clubhouse UI check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm
      - run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Live screens render, keep their axe record and are photographed (phone and desk)
        timeout-minutes: 30
        run: >-
          ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts
          --project ui-phone --project ui-desktop --output test-results/clubhouse-quality/ui-check
      - name: Upload screenshots and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clubhouse-ui-check
          path: |
            test-results/clubhouse-quality/ui-check/
            playwright-report/clubhouse-quality/
          if-no-files-found: warn
          retention-days: 14
