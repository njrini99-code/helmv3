name: migration-lockdown

# NO `paths:` filter, deliberately. A GitHub required status context must be
# reported on EVERY run of the event it's required for, or a PR that never
# triggers the workflow sits on "Expected — waiting for status to be
# reported" forever (see docs/CI_RUNBOOK.md's `all`/CodeQL phantom-context
# incidents — same failure shape, different cause). With the old
# `pull_request: paths: supabase/migrations/**` filter, a PR that didn't
# touch migrations never started this workflow at all, so
# `block-historical-edits` could never be added to branch protection's
# required contexts without breaking every non-migration PR. Fixed by
# running on every PR and doing the path check as the first STEP instead —
# the job now always reports a conclusion, which is what a required check
# needs.
#
# 2026-09-06: that "first STEP" now reads the shared detect-changes.yml
# workflow's `migrations` output instead of running its own
# changed-files.sh scan — see the `detect-changes` job and the
# `block-historical-edits` job's `if:` guard below for how it stays
# fail-closed even if the shared job errors.
on:
  merge_group:
  pull_request:

# Least privilege: this guard only reads git history.
permissions:
  contents: read

concurrency:
  group: migration-lockdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reusable workflow (2026-09-06) — see .github/workflows/detect-changes.yml.
  # Called unconditionally, with NO `if:` on this job — `block-historical-
  # edits` below must always report a conclusion (that's this whole
  # workflow's reason for running on every PR with no trigger-level `paths:`
  # filter, per the top-of-file comment), so it cannot skip just because this
  # helper job failed.
  detect-changes:
    name: Detect changes
    uses: ./.github/workflows/detect-changes.yml

  block-historical-edits:
    needs: detect-changes
    # ALWAYS runs, even if `detect-changes` itself failed — see the comment
    # on that job above. The one step gated on its output (below) treats a
    # missing/failed `migrations` output as fail-closed true via `!= 'false'`
    # rather than skipping.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same BASE_SHA/HEAD_SHA resolution review-gate.yml uses for its
      # merge_group + pull_request triggers: pull_request reads the PR's own
      # base/head; merge_group falls back to `before`/`sha`, and
      # changed-files.sh further falls back to the immediate parent commit
      # when BASE_SHA can't be resolved at all.
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Replaces the old "Detect changed migration files" step's own
      # .github/scripts/changed-files.sh invocation — that boolean is now
      # the shared detector's `migrations` output. `!= 'false'` (not
      # `== 'true'`) is deliberate: an empty/missing output (detect-changes
      # job failed outright) must still run the deep check below, matching
      # this workflow's fail-closed posture — a security gate must not go
      # quiet because its helper job errored.
      - name: Detect edits to historical migrations
        id: check
        if: needs.detect-changes.outputs.migrations != 'false'
        run: |
          set -euo pipefail
          BASELINE="20260527120000"

          # Files in supabase/migrations/ touched by this PR.
          # --diff-filter=AM restricts to Added/Modified entries — pure renames
          # OUT of supabase/migrations/ (e.g., archive sweeps to
          # supabase/migrations_archive/) and deletions don't count as edits.
          # Renames INTO supabase/migrations/ still show up as A on the target
          # side and are caught. (Deliberately narrower than the previous
          # step's changed-files.sh scan, which uses --diff-filter=ACMRT and
          # exists only to decide whether this step should run at all — a
          # rename-only PR can trip that fast filter and still land here with
          # an empty CHANGED below, which is a harmless extra few seconds of
          # work, not a false positive.)
          # NO `|| true` here, deliberately. `git diff` without --exit-code
          # returns 0 whether or not there are differences, so a trailing
          # `|| true` could never absorb "no changes" — it could ONLY absorb a
          # genuine failure: an unresolvable SHA, a shallow clone missing the
          # base commit, a corrupt object. Every one of those produces an empty
          # CHANGED, which falls into the `exit 0` below and reports "No
          # migration files changed." A security gate would then pass green
          # without ever having looked at a single file. `set -e` is on, so an
          # actual git failure now stops the step loudly instead.
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/*.sql')

          if [ -z "$CHANGED" ]; then
            echo "No migration files changed."
            exit 0
          fi

          VIOLATIONS=""
          while IFS= read -r f; do
            base=$(basename "$f")
            case "$base" in
              20260526070000_widen_insight_type_check_for_v3_generators.sql)
                echo "Allowing replay-safety no-op edit for superseded pre-baseline migration: $f"
                continue
                ;;
              20260526180000_fix_v3_goals_suggestions_rls.sql)
                echo "Allowing replay-safety no-op edit for superseded pre-baseline migration: $f"
                continue
                ;;
            esac
            ts="${base%%_*}"
            # Skip non-timestamped filenames defensively.
            case "$ts" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9])
                if [ "$ts" -le "$BASELINE" ]; then
                  VIOLATIONS="${VIOLATIONS}${f}"$'\n'
                fi
                ;;
            esac
          done <<< "$CHANGED"

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::PR edits historical migrations (timestamp <= $BASELINE)."
            echo "Historical migrations are immutable after the alignment baseline."
            echo "Write a new forward-only migration instead."
            echo "Offending files:"
            printf '%s' "$VIOLATIONS"
            exit 1
          fi

          echo "All migration edits are post-baseline. OK."
