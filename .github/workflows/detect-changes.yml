name: Detect changes

# ONE changed-path detector, called by ci.yml and codeql.yml. It used to be
# called by four workflows (ci, codeql, feature-awareness, migration-lockdown),
# i.e. four runner jobs per PR event for the same answer. Two of those callers
# (feature-awareness, migration-lockdown) now decide for themselves inside a job
# that already has a checkout, so this runs twice per event, not four times
# (2026-10-07, plan 5.10). It cannot run once: CI and CodeQL are separate
# workflows that report required checks by their own names, and the only way to
# share one job's outputs across workflows is to make them reusable workflows of
# a parent, which renames `Analyze (...)` and breaks branch protection.
#
# FAIL CLOSED, uniformly: any inability to classify the diff (a non-`pull_request`
# event, or the paths-filter step itself failing) resolves every boolean output
# to `true` — uncertainty must never turn off a gate. `push`/`schedule`/
# `workflow_dispatch` always classify as "everything changed": a merge to main
# (or a scheduled CodeQL sweep) always gets the full suite. A draft PR resolves
# every output to `false`: nothing is required until ready_for_review.
#
# The path lists live in .github/path-filters.yml, the ONE copy, which ci.yml's
# heavy jobs also read in-job. `knowledge` has no caller of this workflow:
# ci.yml's Static checks reads it in-job (plan 5.6) and it is exposed here for
# the next consumer.

on:
  workflow_call:
    outputs:
      code:
        description: >-
          src/**, supabase/**, e2e/**, and the config files that gate
          ci.yml's Next build / unit-test shards / Supabase lint+RLS, and
          codeql.yml's javascript-typescript CodeQL leg.
        value: ${{ jobs.detect.outputs.code }}
      knowledge:
        description: memory/**, docs/** or scripts/knowledge/** (the World Model graph check).
        value: ${{ jobs.detect.outputs.knowledge }}
      python:
        description: Verbatim from codeql.yml's `changes` job.
        value: ${{ jobs.detect.outputs.python }}
      actions:
        description: Verbatim from codeql.yml's `changes` job (`.github/**`).
        value: ${{ jobs.detect.outputs.actions }}

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      knowledge: ${{ steps.classify.outputs.knowledge }}
      python: ${{ steps.classify.outputs.python }}
      actions: ${{ steps.classify.outputs.actions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The PR merge ref and both parents are enough for the two-dot
          # base/head tree diff below. Full branch/tag history hit the 5m
          # checkout timeout on PR #2155 before classification could start.
          fetch-depth: 2

      # Only meaningful on `pull_request` — dorny/paths-filter diffs the PR's
      # base against its head. `continue-on-error` so a filter failure falls
      # through to the fail-closed branch in "Classify" below rather than
      # failing this job outright.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # The path lists live in .github/path-filters.yml (2026-09-23) so
          # ci.yml's heavy jobs can read the SAME `code` list in-job.
          filters: .github/path-filters.yml

      # Turns the filter verdict into fail-closed outputs. Every boolean here
      # gates a real check somewhere downstream — an unclassifiable diff must
      # not silently turn one off.
      - name: Classify (fail closed)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_KNOWLEDGE: ${{ steps.filter.outputs.knowledge }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          FILTER_ACTIONS: ${{ steps.filter.outputs.actions }}
        run: |
          set -uo pipefail

          # Draft PR (owner decision, PR throughput): nothing is required
          # until ready_for_review, so every path-gated job downstream
          # (ci.yml's unit-tests/next-build/supabase) skips exactly like a
          # docs-only PR. codeql.yml's per-leg scan decides its own draft skip
          # independently, so this branch does not special-case it.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            for out in code knowledge python actions; do
              echo "$out=false"
            done >> "$GITHUB_OUTPUT"
            echo "draft PR -> every output false (nothing required until ready_for_review)"
            exit 0
          fi

          # Non-PR events (push, schedule, workflow_dispatch) always run the
          # full suite everywhere.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            for out in code knowledge python actions; do
              echo "$out=true"
            done >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME) -> full classification"
            exit 0
          fi

          # dorny/paths-filter-backed outputs. FAIL CLOSED (all true) if the
          # filter step itself didn't succeed.
          if [ "$FILTER_OUTCOME" != "success" ]; then
            for out in code knowledge python actions; do
              echo "$out=true"
            done >> "$GITHUB_OUTPUT"
            echo "paths-filter did not succeed ($FILTER_OUTCOME) -> fail closed to true"
          else
            {
              echo "code=${FILTER_CODE:-true}"
              echo "knowledge=${FILTER_KNOWLEDGE:-true}"
              echo "python=${FILTER_PYTHON:-true}"
              echo "actions=${FILTER_ACTIONS:-true}"
            } >> "$GITHUB_OUTPUT"
          fi
