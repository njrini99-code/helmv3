name: TEMP gate diagnostics (remove before merge)

# Temporary: reads why each presentation gate finding fires, in CI's own browsers. Deleted before the PR is ready.
on:
  push:
    branches: [agent/presentation-gate-green]
    paths: ['e2e/tmp-gate-diag.spec.ts', 'tmp-gate-diag.config.ts', '.github/workflows/tmp-gate-diag.yml', 'src/clubhouse/screens/messages/thread/PhoneThread.tsx']

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-presentation-fixture-only
  NEXT_PUBLIC_SUPABASE_ANON_KEY: local-presentation-fixture-only
  NEXT_TELEMETRY_DISABLED: '1'
  CH_QUALITY: '1'

jobs:
  # The control ledgers, clickable map and component catalog, regenerated in CI (they need typescript), printed as a
  # patch to apply on the branch, then the docs gate run on the result.
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-npm
      - run: npm run clubhouse:controls
      - run: npm run clubhouse:clickables
      - run: npm run clubhouse:catalog
      - name: Print the patch
        run: |
          git status --short
          git diff --stat
          git diff --binary | gzip -9 | base64 -w 8000 | sed 's/^/REGEN-PATCH:/'
          echo REGEN-END
      - run: npm run clubhouse:check
