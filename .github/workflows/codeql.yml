# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  # merge_group: required for GitHub's merge queue — a queued merge re-runs
  # these checks on the speculative merge result; without this trigger the
  # queue waits forever for contexts that never arrive and every merge times out.
  merge_group:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '35 23 * * 4'

concurrency:
  # This workflow had NO concurrency block until 2026-09-02, so every push to a
  # PR branch queued three more Analyze jobs and the superseded ones ran to
  # completion — ~11 runner-minutes per stale push, on the account's shared
  # runner budget. Same shape as ci.yml: per-commit on main (every main commit
  # keeps its verdict), per-ref with cancel on branches (a new push supersedes
  # the old run).
  group: codeql-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege DEFAULT for the whole workflow. The `analyze` job below
# declares its own (wider) block, which correctly overrides this — so this line
# changes nothing about today's behaviour. It exists so a job added later
# WITHOUT its own permissions block inherits read-only instead of whatever the
# repository default happens to be. That absence is the whole of Scorecard's
# Token-Permissions 0 for this repo; 11 of 14 workflows already declare one.
permissions:
  contents: read

jobs:
  # Path-gates the three required `Analyze (...)` legs below WITHOUT touching
  # their job/check-run names (branch protection matches by name — see
  # .github/branch-protection.md) and without a workflow-level `paths:`
  # filter (that would make the workflow not start at all for a docs-only
  # PR, leaving the three required contexts "Expected" forever — the exact
  # failure branch-protection.md already documents for `block-historical-edits`
  # and Smoke checks). Instead the workflow always triggers, this job always
  # runs, and each Analyze leg below skips its actual scan (still reporting
  # `success`) when nothing in its language's path set changed.
  #
  # Only gates `pull_request` — push/merge_group/schedule always get a full
  # scan (schedule in particular exists specifically to catch drift a
  # per-PR path filter would miss). If this job itself fails or is skipped
  # for any reason on a PR, each Analyze leg below fails OPEN to a real scan
  # rather than silently skipping.
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            actions:
              - '.github/**'
            javascript-typescript:
              - 'src/**'
              - 'scripts/**'
              - 'e2e/**'
              - '*.ts'
              - '*.tsx'
              - '*.mjs'
              - '*.js'
              - 'package*.json'
              - 'tsconfig*.json'
            python:
              - '**/*.py'
              - 'requirements*.txt'
              - 'pyproject.toml'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # Runs even when `changes` was skipped (non-PR events) or failed (fail
    # open to a real scan on a PR rather than silently skipping) — only a
    # cancelled workflow run should also cancel this job.
    if: ${{ !cancelled() }}
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Swift is intentionally omitted: the iOS sources in this repo are a thin
        # Capacitor bridge, and `autobuild` on macos-latest runners is expensive
        # and prone to failure without cached SPM/CocoaPods dependencies.
        # Re-enable once the iOS layer has substantive native logic to scan.
        # CodeQL supports: actions, c-cpp, csharp, go, java-kotlin,
        # javascript-typescript, python, ruby, rust, and swift.
        # See advanced setup docs for language and build-mode customization:
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Add setup steps before `github/codeql-action/init` if manual builds need them.
      # - name: Setup runtime (example)
      #   uses: actions/setup-example@v1

      - name: Decide whether this leg needs a real scan
        id: should-scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LANGUAGE_CHANGED: ${{ needs.changes.outputs[matrix.language] }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-PR event ($EVENT_NAME) always gets a full scan" >> "$GITHUB_OUTPUT"
          elif [ "$CHANGES_RESULT" != "success" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=path filter did not succeed (result: $CHANGES_RESULT) — failing open to a real scan" >> "$GITHUB_OUTPUT"
          elif [ "$LANGUAGE_CHANGED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ matrix.language }} paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no ${{ matrix.language }} paths changed in this PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.should-scan.outputs.run != 'true'
        env:
          REASON: ${{ steps.should-scan.outputs.reason }}
        run: |
          echo "Skipping CodeQL scan for ${{ matrix.language }} - $REASON."

      - name: Initialize CodeQL
        if: steps.should-scan.outputs.run == 'true'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Path scoping (tests, fixtures, archive, docs, public assets are out)
          # lives in the config file so it is reviewable as data.
          config-file: ./.github/codeql/codeql-config.yml
          # `security-extended` ONLY, as of 2026-09-02. The previous value was
          # `security-extended,security-and-quality`, and the second suite is a
          # SUPERSET of the first — so the line was asking for every security
          # query twice plus the code-quality pack (unused variables, useless
          # conditionals, and the like). Those quality queries were most of the
          # 8.5-minute JavaScript analysis on every PR, and ESLint already
          # gates that class on the same PR (`npm run lint`, --max-warnings 0,
          # plus the lint ratchet). Security coverage is unchanged: every query
          # in `security-extended` still runs. Put `security-and-quality` back
          # here if the Security tab's quality alerts are wanted again.
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.should-scan.outputs.run == 'true'
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          category: "/language:${{matrix.language}}"
