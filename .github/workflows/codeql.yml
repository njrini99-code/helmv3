# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  # merge_group: required for GitHub's merge queue — a queued merge re-runs
  # these checks on the speculative merge result; without this trigger the
  # queue waits forever for contexts that never arrive and every merge times out.
  merge_group:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '35 23 * * 4'

# Least-privilege DEFAULT for the whole workflow. The `analyze` job below
# declares its own (wider) block, which correctly overrides this — so this line
# changes nothing about today's behaviour. It exists so a job added later
# WITHOUT its own permissions block inherits read-only instead of whatever the
# repository default happens to be. That absence is the whole of Scorecard's
# Token-Permissions 0 for this repo; 11 of 14 workflows already declare one.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Swift is intentionally omitted: the iOS sources in this repo are a thin
        # Capacitor bridge, and `autobuild` on macos-latest runners is expensive
        # and prone to failure without cached SPM/CocoaPods dependencies.
        # Re-enable once the iOS layer has substantive native logic to scan.
        # CodeQL supports: actions, c-cpp, csharp, go, java-kotlin,
        # javascript-typescript, python, ruby, rust, and swift.
        # See advanced setup docs for language and build-mode customization:
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Add setup steps before `github/codeql-action/init` if manual builds need them.
      # - name: Setup runtime (example)
      #   uses: actions/setup-example@v1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Prefix this list with "+" to combine it with queries from a config file.
          # Otherwise, queries listed here override any configured elsewhere.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:${{matrix.language}}"
