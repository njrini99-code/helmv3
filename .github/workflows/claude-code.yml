name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude guarded PR agent
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Actions are pinned to a full commit SHA (mutable tags can be moved to
      # attacker-controlled code); the trailing comment records the version.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Refuse unsafe labels before agent run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const labels = issue.labels.map((label) => label.name);
            const blocked = [
              'risk:high',
              'agent:needs-human-review',
              'severity:p0',
              'source:security'
            ];
            const hit = labels.filter((label) => blocked.includes(label));

            if (hit.length > 0) {
              core.setFailed(`Claude auto-run blocked by label(s): ${hit.join(', ')}. Nick must review this manually.`);
            }

      # Fail fast with a clear message if the agent is enabled but no auth secret
      # is configured (secrets can't be read in `if:`, so check them here).
      - name: Verify Claude auth is configured
        if: ${{ vars.ENABLE_CLAUDE_CODE_ACTION == 'true' }}
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error::ENABLE_CLAUDE_CODE_ACTION is true but no auth secret is set (need CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY)."
            exit 1
          fi
          echo "Claude auth secret present."

      # Disabled until repository variable ENABLE_CLAUDE_CODE_ACTION=true.
      # Auth (provide ONE; the action uses whichever secret is set, ignores empty):
      #   - Subscription (Pro/Max): `claude setup-token` -> secret CLAUDE_CODE_OAUTH_TOKEN
      #     (subscription runs draw on your shared Claude usage limits), OR
      #   - API billing: secret ANTHROPIC_API_KEY.
      - name: Run Claude Code
        if: ${{ vars.ENABLE_CLAUDE_CODE_ACTION == 'true' }}
        uses: anthropics/claude-code-action@fad22eb3fa582b7357fc0ea48af6645851b884fd  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 10
            --append-system-prompt "Follow CLAUDE.md and docs/operations/HELM_MISSION_CONTROL_OS.md. Branch + PR only; never push to main. No secrets. High-risk changes require human review."

      - name: Agent safety reminder
        if: always()
        run: |
          echo "Claude agent workflow is intentionally PR-only. High-risk labels must be handled manually."
