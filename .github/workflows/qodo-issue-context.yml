name: Qodo Ticket Context

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  issue-reference:
    name: Ticket references
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for GitHub issue references
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR; Qodo issue context is optional." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ticket_context="$PR_BODY
          $PR_TITLE
          $PR_BRANCH"

          if printf '%s\n' "$ticket_context" | grep -Eq '(#|issues/)[0-9]+|HEL-[0-9]+|linear\.app/helmmmm/issue/HEL-[0-9]+'; then
            echo "Qodo ticket context detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Qodo Ticket Context Missing"
            echo
            echo "Qodo can fetch GitHub Issues and Linear tickets when the PR references them."
            echo
            echo "Add one of these to the PR body, title, or branch name:"
            echo
            echo "- \`Closes #123\`"
            echo "- \`Fixes #123\`"
            echo "- \`Related to #123\`"
            echo "- \`https://github.com/njrini99-code/helmv3/issues/123\`"
            echo "- \`HEL-123\`"
            echo "- \`https://linear.app/helmmmm/issue/HEL-123/slug\`"
            echo
            echo "PR: $PR_TITLE"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Qodo ticket context missing. Add a GitHub issue or Linear ticket reference."
