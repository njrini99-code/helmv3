name: Nightly

# Slow, post-merge-only suites that used to run on EVERY push to main from
# ci.yml (2026-09-23, PR throughput). Moving them here takes 7 jobs off each
# merge — the shifted-timezone matrix (2 zones x 3 shards) and the
# BaseballHelm authenticated smoke — which competed with open PRs for the
# account's 20 concurrent runner slots (queueing was 64% of PR wait time on
# 2026-09-23). Neither was a merge gate; both are release signals, and a
# nightly run on main's head is when that signal is read.
#
# 2026-10-07 (plan 5.1, 5.7): the two advisory browser jobs that ran on every
# push to main (`Playwright PR smoke (a11y)`, `Capture + upload Sentry
# snapshots`) moved here behind one `next-build`, and the BaseballHelm smoke was
# split into a build job and a run job.
#
# Job names are unchanged from ci.yml; none is a required check.
# Run on demand: `gh workflow run nightly.yml` (optionally `--ref <branch>`).

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same as ci.yml: a valid-format dummy on secretless runs. The baseball
  # smoke overwrites both with its local stack's values before it builds.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # ---------------------------------------------------------------------------
  # The same unit suite, run at a FAR timezone offset.
  #
  # WHY THIS IS NOT HYGIENE. On 2026-07-29 `main` went red at 8pm EDT because two
  # "today" fixtures were anchored to the UTC date while the code under test used a
  # local/team date (#1123). Sweeping for the class found exactly two
  # offset-dependent files in 8,514 tests — and the second one proved the sharper
  # point. Re-injecting the ORIGINAL React #418 hydration bug that
  # `FairwayAgendaView` was hardened against gives:
  #
  #     TZ=America/New_York    -> 4 passed   <- the bug is INVISIBLE
  #     TZ=Pacific/Kiritimati  -> 1 failed
  #     TZ=Asia/Tokyo          -> 1 failed
  #
  # CI runs at UTC, where midday-ET fixtures land on the same calendar day, so that
  # guard was DORMANT: it could not catch the regression it exists to prevent.
  # This job is what wakes it up.
  #
  # WHY A MATRIX OF BOTH EXTREMES. Each caught a different subset — UTC-11 broke one
  # assertion in stage-history-format, UTC+14 broke the other two plus both agenda
  # cases. One offset is enough to detect the class in principle; two is cheap
  # insurance against a fixture that only slips in one direction.
  #
  # COST: runner minutes, not wall-clock — GHA runs these in parallel with the
  # other jobs, so a green PR is not slower. Rejected alternative: banning
  # `toISOString().slice(0, 10)`. There are 216 call sites and most are legitimate
  # (formatting an already-stored date, or intentionally UTC), so a blanket rule
  # would be noise. Running at a shifted offset catches the class regardless of
  # which API produced the date.
  #
  # Verified clean at BOTH offsets on c2ea35695 before this job was added:
  # 892 files / 8,514 tests, identical to the UTC run.
  # ---------------------------------------------------------------------------
  unit-tests-timezone:
    name: Unit tests (shifted timezone)
    # NIGHTLY (2026-09-23, PR throughput). Off the PR gate since 2026-08-20;
    # until today it still ran on EVERY push to main — six jobs per merge
    # competing with open PRs for the account's 20 concurrent runner slots,
    # for a check whose own history (#1123) is a date-boundary class that a
    # once-a-day run at both offsets catches as well as a per-merge one. A
    # red run here blocks the next release, not a merge.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Pacific/Kiritimati  # UTC+14, the furthest ahead of UTC
          - Pacific/Midway      # UTC-11, the furthest behind
        # Sharded for the same reason as unit-tests. Unsharded, this job would
        # become the critical path the moment the others got faster.
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm

      - name: Unit tests at ${{ matrix.tz }} (shard ${{ matrix.shard }}/3)
        env:
          TZ: ${{ matrix.tz }}
        run: |
          echo "Runner offset: $(date +%z)  ($(date))"
          npm run test:run -- --shard=${{ matrix.shard }}/3

  # ---------------------------------------------------------------------------
  # BaseballHelm authenticated smoke, split in two (plan 5.7, 2026-10-07).
  #
  # It was ONE job: Supabase stack, Playwright browser install, a full
  # `next build`, the seed and the specs, in 45 minutes of headroom, so a build
  # that ran long ("~9-10 min under container contention") starved the part that
  # produces a diagnosable failure, and a red run could not say which half broke.
  # The halves are now separate jobs with their own timeouts:
  #
  #   baseball-smoke-build   stack (for its URL and anon key) -> `next build`
  #   baseball-auth-smoke    stack -> seed -> Playwright against the built output
  #
  # WHY THE BUILD STILL STARTS A STACK. Next inlines NEXT_PUBLIC_* at build
  # time, so the bundle must be built with the stack's URL and anon key. Those
  # come from `supabase status` and are the CLI's fixed local-demo values, but
  # that is a fact about the CLI, not something this file controls. So the build
  # job records the pair it built with (`stack.env`, shipped inside the
  # artifact), and the smoke job REFUSES to run if its own stack reports a
  # different pair, instead of authenticating against a bundle built for another.
  #
  # The ghcr.io `toomanyrequests` retry with backoff and mirror fallback lives in
  # scripts/db/supabase-start-with-retry.sh, which the stack action runs. There
  # is no Docker Hub secret in this repository, so there is no docker/login-action
  # step to add; the ghcr.io login uses the job's GITHUB_TOKEN.
  # ---------------------------------------------------------------------------
  baseball-smoke-build:
    name: BaseballHelm smoke build
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm

      # Only for its NEXT_PUBLIC_* values: the stack must be up BEFORE the build
      # (see above). Nothing is seeded or exercised here.
      - name: Start local Supabase stack
        uses: ./.github/actions/local-supabase-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the stack values this bundle is built with
        run: |
          set -euo pipefail
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_ANON_KEY" > stack.env

      # No .next/cache (2026-09-23): the dedicated next-smoke cache was dropped
      # to keep the repository's 10 GB cache budget for ci.yml's Next build.
      - name: Build
        run: npm run build

      - name: Upload build and stack values
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: baseball-smoke-build-${{ github.run_id }}
          path: |
            .next
            !.next/cache
            stack.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

  baseball-auth-smoke:
    name: BaseballHelm authenticated smoke
    needs: [baseball-smoke-build]
    # packages: read lets the local-supabase-stack composite action's ghcr.io
    # login step get the authenticated (higher) pull rate limit for
    # ghcr.io/supabase/* images; the workflow-level `permissions:` block above
    # only grants `contents: read`, so a job needs this to use the token for
    # anything else.
    permissions:
      contents: read
      packages: read
    # NIGHTLY (2026-09-23, PR throughput). Removed from the PR gate on
    # 2026-08-26 after it blocked a golf production hotfix twice in one
    # afternoon (the runner died during the in-job build). Until 2026-09-23 it
    # ran on every push to main; it now runs nightly and on dispatch
    # (`gh workflow run nightly.yml`). A red run blocks the next release, not a
    # merge. It promotes the already-built baseball-smoke and onboarding-smoke
    # specs (e2e/baseball-smoke.spec.ts, e2e/baseball-onboarding-smoke.spec.ts,
    # #372) into a release signal.
    #
    # NO PRODUCTION ACCESS (2026-07-30). It used to run `npm run
    # seed:baseball:ci` with the production Supabase URL and service-role key
    # in its env, on every pull request. It stands up a throwaway Supabase stack
    # on the runner (.github/actions/local-supabase-stack) and seeds that, so no
    # secrets are needed and it tests THIS commit's schema (`supabase start`
    # applies supabase/migrations/), not production's.
    runs-on: ubuntu-latest
    # With the build in its own job a clean run is ~6 min here (stack ~1m45s,
    # seed ~1 min, specs ~1m30s); a run where the smoke FAILS costs ~13 min,
    # because every spec retries twice. 30 leaves room for a slow pull and still
    # lets the `if: always()` report upload run: when a JOB timeout fires first,
    # GitHub cancels the job outright and nothing is uploaded (how #953 produced
    # three `cancelled` runs with nothing to debug from).
    timeout-minutes: 30
    env:
      # NOT secrets, and deliberately not read from any. The seed script creates
      # exactly these two accounts on the local stack with exactly these values
      # (scripts/seed-baseball-demo.ts — DEMO_COACH_EMAIL / DEMO_PLAYER_EMAIL /
      # DEMO_PASSWORD, whose own header names this as the intended wiring). They
      # are credentials for a database that is destroyed when the job ends.
      E2E_BASEBALL_COACH_EMAIL: demo-coach@baseballhelmdemo.com
      E2E_BASEBALL_COACH_PASSWORD: BaseballDemo2026
      E2E_BASEBALL_PLAYER_EMAIL: demo-player@baseballhelmdemo.com
      E2E_BASEBALL_PLAYER_PASSWORD: BaseballDemo2026
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm

      # Everything below this point talks to the runner's own Postgres. See the
      # action for why, and for the loopback assertion it ends with.
      - name: Start local Supabase stack
        uses: ./.github/actions/local-supabase-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build and stack values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: baseball-smoke-build-${{ github.run_id }}
          path: .

      # The bundle inlined the build job's URL and anon key. Refuse to run the
      # specs against a stack that reports different ones.
      - name: Assert this stack matches the one the bundle was built for
        run: |
          set -euo pipefail
          built_url="$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' stack.env | cut -d= -f2-)"
          built_key="$(grep -E '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' stack.env | cut -d= -f2-)"
          if [ "$built_url" != "$NEXT_PUBLIC_SUPABASE_URL" ] || [ "$built_key" != "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::The local stack's URL or anon key differs from the pair baseball-smoke-build baked into the bundle (built=$built_url, now=$NEXT_PUBLIC_SUPABASE_URL)."
            echo "::error::The Supabase CLI's local values are no longer fixed; build and run in one job again."
            exit 1
          fi
          echo "Stack matches the bundle ($built_url)."

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No --allow-prod (see package.json). Against a loopback URL the target
      # guard allows the write with no flag; if production credentials ever leak
      # back into this job's env, the guard refuses instead of seeding prod.
      - name: Seed BaseballHelm CI accounts into the local stack
        run: npm run seed:baseball:ci

      # playwright.config.ts's webServer runs `npm run start` in CI, serving the
      # downloaded `.next`.
      - name: Run BaseballHelm mandatory smoke (blocking)
        run: |
          npx playwright test \
            --project=chromium \
            --project=baseball-coach \
            --project=baseball-player \
            e2e/baseball-onboarding-smoke.spec.ts \
            e2e/baseball-smoke.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: baseball-auth-smoke-playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

  # ---------------------------------------------------------------------------
  # ADVISORY BROWSER JOBS (moved here from ci.yml 2026-10-07, plan 5.1).
  #
  # `Playwright PR smoke (a11y)` and `Capture + upload Sentry snapshots` are
  # advisory: neither was ever in `CI aggregate`, and each keeps step-level
  # `continue-on-error` on its test/capture step so it reports an honest
  # pass/fail while being structurally incapable of blocking anything. They ran
  # on every push to main, after a `Next build` that the push already paid for;
  # that was two runners, two `npm ci`s and two Playwright installs per merge
  # for a post-merge signal a nightly run gives as well.
  #
  # BUILD ONCE still holds, one level up: `next-build` below builds main once
  # for both and hands them the `.next` output as an artifact (node_modules is
  # not part of it, so each job still runs `npm ci`). Check names are unchanged
  # from the workflows they replaced (docs/CI_RUNBOOK.md's table).
  # ---------------------------------------------------------------------------
  next-build:
    name: Next build (advisory browser jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm

      # No .next/cache restore or save: once a night does not repay an entry in
      # the repository's 10 GB cache budget, which ci.yml's Next build owns.
      - name: Build
        run: npm run build

      # `include-hidden-files` and `if-no-files-found: error` are BOTH
      # load-bearing: `.next` is dot-prefixed and upload-artifact skips hidden
      # paths by default, which once uploaded nothing and still succeeded.
      - name: Upload Next build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-next-build-${{ github.run_id }}
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pr-smoke-a11y:
    name: Playwright PR smoke (a11y)
    # NIGHTLY / DISPATCH ONLY (2026-10-07). Advisory, never in `CI aggregate`,
    # and until today also run on every push to main, each taking a runner slot
    # plus an `npm ci` and a Playwright install while PRs queued for slots. It
    # now runs once a night against main, and on demand against any branch:
    # `gh workflow run nightly.yml --ref <branch>`. The `ci:e2e` PR label no
    # longer exists; use the dispatch.
    needs: [next-build]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-ci-build.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key-ci-build-only' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm

      - name: Download Next build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nightly-next-build-${{ github.run_id }}
          path: .next

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Same shared-server rationale as before (pr-smoke.yml's original
      # comment): one `next start` shared via PLAYWRIGHT_BASE_URL by both
      # test steps below avoids a second `playwright test` invocation racing
      # port 3000 right after the first one's own webServer tears down.
      # `next start` (production server against the DOWNLOADED build)
      # replaces the old `npm run dev` — this job now exercises the same
      # artifact the rest of CI already validated, not a fresh dev compile.
      - name: Start production server (from downloaded build)
        run: |
          set -euo pipefail
          npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 -o /dev/null; then
              echo "Server ready after ${i} attempt(s)."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/next-start.pid)" 2>/dev/null; then
              echo "::error::next start process died during startup"
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::next start did not become ready within 120s"
          cat /tmp/next-start.log
          exit 1

      - name: Run public accessibility smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test e2e/accessibility.spec.ts --project=chromium --reporter=line

      # Blocking within this advisory job (pure layout-geometry assertions,
      # no a11y-debt exemptions) — same as pr-smoke.yml's original.
      - name: Run public mobile viewport checks
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --project=mobile-public --reporter=line

      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-smoke-playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  sentry-snapshot-capture:
    name: Capture + upload Sentry snapshots
    # NIGHTLY / DISPATCH ONLY (2026-10-07). Advisory, never in `CI aggregate`,
    # and until today also run on every push to main, each taking a runner slot
    # plus an `npm ci` and a Playwright install while PRs queued for slots. It
    # now runs once a night against main, and on demand against any branch:
    # `gh workflow run nightly.yml --ref <branch>`. The `ci:e2e` PR label no
    # longer exists; use the dispatch.
    needs: [next-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOLFHELM_PLAYER_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
      GOLFHELM_PLAYER_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
      E2E_GOLF_EMAIL: ${{ secrets.E2E_GOLF_EMAIL }}
      E2E_GOLF_PASSWORD: ${{ secrets.E2E_GOLF_PASSWORD }}
      E2E_BASEBALL_COACH_EMAIL: ${{ secrets.E2E_BASEBALL_COACH_EMAIL }}
      E2E_BASEBALL_COACH_PASSWORD: ${{ secrets.E2E_BASEBALL_COACH_PASSWORD }}
      E2E_BASEBALL_PLAYER_EMAIL: ${{ secrets.E2E_BASEBALL_PLAYER_EMAIL }}
      E2E_BASEBALL_PLAYER_PASSWORD: ${{ secrets.E2E_BASEBALL_PLAYER_PASSWORD }}
      SENTRY_SNAPSHOTS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `if:` cannot read `secrets.*` directly, so this is a STEP inside the
      # job rather than a separate gate job (2026-09-06: folding the old
      # "Check Sentry snapshot prerequisites" job into a step here is exactly
      # the check-row collapse this change is for — every later step in this
      # job gates on `steps.token.outputs.enabled` instead).
      - name: Check for SENTRY_AUTH_TOKEN
        id: token
        env:
          TOKEN_SET: ${{ secrets.SENTRY_SNAPSHOTS_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SET" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN is not set — Sentry snapshot capture and upload are skipped. See docs/observability/SENTRY_SNAPSHOTS.md OWNER ACTION."
          fi

      - name: Setup Node and install dependencies
        if: steps.token.outputs.enabled == 'true'
        uses: ./.github/actions/setup-node-npm

      - name: Download Next build artifact
        if: steps.token.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nightly-next-build-${{ github.run_id }}
          path: .next

      - name: Cache Playwright browsers
        if: steps.token.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.token.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      # No manual `next start` here: playwright.config.ts's own `webServer`
      # already runs `npm run start` in CI when PLAYWRIGHT_BASE_URL is unset
      # (unchanged from sentry-snapshots.yml's original — it never manually
      # started a server either). It now serves the DOWNLOADED artifact
      # instead of a build made in this job.
      - name: Capture Sentry snapshot screenshots
        if: steps.token.outputs.enabled == 'true'
        continue-on-error: true
        id: capture
        run: |
          npx playwright test \
            --project=chromium \
            --project=baseball-coach \
            --project=baseball-player \
            e2e/sentry-snapshots.spec.ts \
            e2e/sentry-snapshots-baseball.spec.ts

      - name: Count captured images
        id: count
        if: steps.token.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          dir="test-results/sentry-snapshots"
          if [ -d "$dir" ]; then
            count=$(find "$dir" -name '*.png' | wc -l | tr -d ' ')
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Captured $count image(s) in $dir"

      - name: Upload snapshots to Sentry
        if: steps.token.outputs.enabled == 'true' && steps.count.outputs.count != '0'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SNAPSHOTS_AUTH_TOKEN }}
          SENTRY_ORG: helm-xs
          SENTRY_PROJECT: javascript-nextjs
        run: |
          npx --yes @sentry/cli@3.7.0 snapshots upload test-results/sentry-snapshots \
            --app-id helm-web \
            --project javascript-nextjs

      - name: No images captured
        if: steps.token.outputs.enabled == 'true' && steps.count.outputs.count == '0'
        run: |
          echo "::warning::Sentry snapshots: 0 images captured — nothing uploaded. Check the Playwright report artifact below for the cause (likely a login failure)."

      - name: Upload Playwright report (debugging)
        if: always() && steps.token.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sentry-snapshots-playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/sentry-snapshots/
          retention-days: 7
          if-no-files-found: warn
