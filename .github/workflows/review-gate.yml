name: Review Gate

# Mirrors the pre-merge gate the external AI reviewers used to run, so devs
# catch issues before pushing. Runs the same toolchain (ast-grep, semgrep,
# gitleaks, ruff, shellcheck, actionlint, yamllint, markdownlint, sqlfluff,
# hadolint) scoped to changed paths.
#
# SHAPE (2026-09-02, PR throughput). Until this date every tool here was its
# own job — twelve jobs per pull request, each paying a runner slot and a
# checkout to do between 0 and 45 seconds of work (measured on run
# 33639256848: actionlint 0 s, hadolint 0 s, ruff 0 s, gitleaks 3 s, sqlfluff
# 45 s). On an account whose runner pool behaves like 20 concurrent jobs, that
# was more than half of one PR's entire allowance spent on setup. They are
# now STEPS of one `checks` job: every tool still runs, every tool still
# reports under its own name, and the aggregate step at the end fails the job
# naming each step that did not succeed — so one failure cannot mask another
# (the pattern ci.yml's ratchet job established on 2026-08-18). semgrep keeps
# its own job because it runs inside a pinned container.
#
# SECURITY: This workflow consumes ZERO untrusted user input (no
# github.event.*.title, .body, .message, .ref, etc. in any run: block).
# All ${{ }} expressions are either trusted refs (github.ref for
# concurrency), platform tokens (secrets.GITHUB_TOKEN), job-status
# metadata (needs.*.result), or the steps context (passed through env,
# never interpolated into a script).
#
# Required status check: "Review Gate aggregate" — see
# .github/branch-protection.md. It blocks merge alongside `CI aggregate`.

on:
  # merge_group: required for GitHub's merge queue — a queued merge re-runs
  # these checks on the speculative merge result; without this trigger the
  # queue waits forever for contexts that never arrive and every merge times out.
  merge_group:
  push:
    branches: [main]
  # ready_for_review (plus the GitHub defaults opened/synchronize/reopened):
  # a draft->ready transition needs its own event to trigger the first real
  # run, since `checks`/`semgrep` below skip while
  # github.event.pull_request.draft is true (owner decision, PR throughput).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Per-COMMIT on main, per-ref with cancel on branches — see ci.yml's note.
  group: review-gate-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Review Gate checks
    # Skip while draft (owner decision, PR throughput): nothing is required
    # on a draft PR since it can't be merged; marking it ready_for_review
    # re-triggers a full, real run via the added pull_request type above.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read by .github/scripts/changed-files.sh in every scoped step below.
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      # Every tool, installed once, OUTSIDE the checkout so no archive or
      # binary lands in the tree the scanners below walk.
      - name: Install linters
        run: |
          set -euo pipefail
          tools="$(mktemp -d)"
          cd "$tools"

          # ast-grep: exact release zip, checksum-verified. ast-grep ships no
          # checksum file, so the SHA-256 below is the digest GitHub publishes
          # for app-x86_64-unknown-linux-gnu.zip on the 0.45.3 release page
          # (confirmed against a local download). The binary must report the
          # version we asked for.
          ast_grep_version=0.45.3
          ast_grep_sha256=f8ac830881339d1edee6b2652f54798c0f4da5a827f2db38a08ee31117783ce8
          curl -fsSL "https://github.com/ast-grep/ast-grep/releases/download/${ast_grep_version}/app-x86_64-unknown-linux-gnu.zip" -o ast-grep.zip
          echo "${ast_grep_sha256}  ast-grep.zip" | sha256sum -c -
          unzip -q ast-grep.zip ast-grep
          sudo mv ast-grep /usr/local/bin/sg
          ast_grep_reported="$(sg --version)"
          if [ "$ast_grep_reported" != "ast-grep ${ast_grep_version}" ]; then
            echo "::error::sg reports '$ast_grep_reported', expected 'ast-grep ${ast_grep_version}'"
            exit 1
          fi
          echo "$ast_grep_reported"

          # actionlint: exact release tarball, checksum-verified. This was a
          # piped download-actionlint.bash from the v1.7.12 tag, but that
          # script hard-codes version="1.7.11" unless given an argument, so the
          # gate silently ran 1.7.11. The expected SHA-256 below is copied from
          # the release's actionlint_1.7.12_checksums.txt. It is checked against
          # the downloaded tarball and that file, and the binary must report
          # the version we asked for.
          actionlint_version=1.7.12
          actionlint_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          actionlint_base="https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}"
          actionlint_tgz="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          curl -fsSLO "${actionlint_base}/${actionlint_tgz}"
          curl -fsSLO "${actionlint_base}/actionlint_${actionlint_version}_checksums.txt"
          grep -qx "${actionlint_sha256}  ${actionlint_tgz}" "actionlint_${actionlint_version}_checksums.txt"
          echo "${actionlint_sha256}  ${actionlint_tgz}" | sha256sum -c -
          tar -xzf "$actionlint_tgz" actionlint
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint_reported="$(actionlint -version | sed -n 1p)"
          if [ "$actionlint_reported" != "$actionlint_version" ]; then
            echo "::error::actionlint reports '$actionlint_reported', expected '$actionlint_version'"
            exit 1
          fi
          echo "actionlint $actionlint_reported"

          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version

          # yamllint/ruff/pylint/sqlfluff: exact versions with every transitive
          # dependency hash-locked (.github/requirements-lint.txt). Unpinned,
          # these floated to latest on every run, and the SQLFluff ratchet
          # baseline only means something under the version that measured it.
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/requirements-lint.txt"
          python --version
          yamllint --version
          ruff --version
          pylint --version
          sqlfluff --version

          # markdownlint-cli2 PINNED to the devDependency version
          # (package.json). Unpinned, this floated to latest — and a
          # markdownlint release changes rule behavior, which silently
          # redefines the ratchet baseline: measured 2026-08-20, +102 phantom
          # MD049s between two tool versions with zero doc edits. The
          # baseline is only meaningful under the version that wrote it.
          npm install -g markdownlint-cli2@0.23.2

      # shellcheck: exact release binary, checksum-verified, in its own step.
      # The apt shellcheck from "Install linters" is still installed but is
      # shadowed by this binary (see the PATH check at the end of the step).
      # apt's shellcheck tracks the runner image: Ubuntu 26.04 moves it from
      # 0.9 to 0.11, which would change what the two shellcheck steps below
      # report with no diff in this repo. 0.11.0 is lint-clean on scripts/*.sh
      # and .claude/hooks/*.sh at --severity=warning (checked 2026-10-06). The
      # SHA-256 is GitHub's published digest for the v0.11.0 asset (shellcheck
      # ships no checksum file), confirmed against a local download.
      # /usr/local/bin precedes /usr/bin on PATH, and the check below proves
      # the pinned binary is the one the later steps run.
      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          tools="$(mktemp -d)"
          cd "$tools"
          shellcheck_version=0.11.0
          shellcheck_sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          shellcheck_txz="shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/${shellcheck_txz}"
          echo "${shellcheck_sha256}  ${shellcheck_txz}" | sha256sum -c -
          tar -xJf "$shellcheck_txz"
          sudo install -m 0755 "shellcheck-v${shellcheck_version}/shellcheck" /usr/local/bin/shellcheck
          hash -r
          if [ "$(command -v shellcheck)" != /usr/local/bin/shellcheck ]; then
            echo "::error::shellcheck resolves to $(command -v shellcheck), expected /usr/local/bin/shellcheck"
            exit 1
          fi
          shellcheck --version
          shellcheck --version | grep -qx "version: ${shellcheck_version}"

      - name: ast-grep (project rules)
        id: ast_grep
        continue-on-error: true
        run: |
          set -euo pipefail
          # Exclude rule-pack positive fixtures from CI scans — they exist
          # only to exercise the rules locally and are intentionally broken.
          mapfile -t all_files < <(bash .github/scripts/changed-files.sh \
            | grep -E '\.(ts|tsx)$' \
            | grep -vE '^\.coderabbit/(semgrep|ast-grep)/__test__/' \
            || true)
          if [ "${#all_files[@]}" -eq 0 ]; then
            echo "No changed TypeScript files for ast-grep."
            exit 0
          fi

          # filter_files <include_regex> <exclude_regex>
          # Returns the changed-files list filtered to paths matching the include
          # regex and NOT matching the exclude regex. Both are extended grep
          # regexes; pass "" to skip either filter. Output is one path per line.
          filter_files() {
            local include_re="$1"
            local exclude_re="$2"
            for f in "${all_files[@]}"; do
              if [ -n "$include_re" ] && ! printf '%s\n' "$f" | grep -Eq "$include_re"; then
                continue
              fi
              if [ -n "$exclude_re" ] && printf '%s\n' "$f" | grep -Eq "$exclude_re"; then
                continue
              fi
              printf '%s\n' "$f"
            done
          }

          # Each rule below has a path scope baked in here so the rule fires
          # only on the paths it is meant for. Without this filter the rules
          # ran repo-wide and produced hundreds of false positives. See
          # docs/operations/2026-05-28-coderabbit-fails-investigation.md.
          fail=0

          run_rule() {
            local rule="$1"
            local include_re="$2"
            local exclude_re="$3"
            local label="$4"

            mapfile -t scoped < <(filter_files "$include_re" "$exclude_re")
            echo "::group::$rule (${label})"
            if [ "${#scoped[@]}" -eq 0 ]; then
              echo "No in-scope files for $rule"
              echo "::endgroup::"
              return 0
            fi
            printf '  scope-hit: %s\n' "${scoped[@]}"
            if ! sg scan --rule "$rule" --error "${scoped[@]}"; then
              fail=1
            fi
            echo "::endgroup::"
          }

          # Repo-wide rules — match every changed TS/TSX file.
          run_rule .coderabbit/ast-grep/no-bare-table-names.yml \
            '' '' 'repo-wide'
          run_rule .coderabbit/ast-grep/no-deep-types-import.yml \
            '' '' 'repo-wide'

          # PostgREST row-cap rule — repo-wide on source, never on tests: a test
          # that asserts what the 1,000-row cap DOES has to ask for more than
          # 1,000. The rule carries the same exemption in its own `ignores`,
          # this is belt-and-braces at the scoping layer.
          run_rule .coderabbit/ast-grep/no-limit-above-postgrest-cap.yml \
            '\.(ts|tsx)$' \
            '(\.test\.tsx?$|/__tests__/|^src/test/)' \
            'source-only'

          # Edge-Functions-only rule — Deno runtime, process.env is undefined.
          # Mirrors .coderabbit.yaml > path_instructions for supabase/functions/.
          run_rule .coderabbit/ast-grep/no-process-env-in-edge.yml \
            '^supabase/functions/.*\.ts$' '' 'supabase/functions/**'

          # Service-role rule — must skip admin-only / server-only / cron /
          # rate-limit / push-notification / Edge Function paths. Mirrors the
          # exclude list in .coderabbit/semgrep/helmv3.yml for the equivalent
          # semgrep rule (helmv3-service-role-outside-admin).
          excl='^(src/lib/supabase/admin|src/lib/supabase/keys|src/lib/supabase/service'
          excl+='|src/lib/auth/supabase-rate-limit|src/lib/notifications/push'
          excl+='|src/app/api/admin/|src/app/api/.+/admin/|scripts/|supabase/functions/)'
          run_rule .coderabbit/ast-grep/no-service-role-in-client.yml \
            '\.(ts|tsx)$' \
            "$excl" \
            'no-admin/scripts/edge'

          # Server-action rule — a catch whose entire body returns []/null/{}
          # swallows the failure with nothing an operator could ever see. This
          # scan passes whole changed FILE paths, not diff hunks, so it can
          # only be registered at `error` because the action tree is currently
          # clean of the pattern (verified 2026-08-26). If a legitimate silent
          # fallback is ever needed, log first, then return.
          run_rule .coderabbit/ast-grep/no-silent-catch-fallback.yml \
            '^src/app/.*/actions/.*\.tsx?$' \
            '(\.test\.tsx?$|/__tests__/)' \
            'actions-only'

          exit $fail

      - name: gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action's built-in default scanner is 8.24.3 (src/index.js at the
          # pinned SHA). Match the weekly scan (control-plane-weekly.yml) so
          # both gates run the same rules.
          GITLEAKS_VERSION: 8.30.1

      - name: actionlint
        id: actionlint
        continue-on-error: true
        run: |
          mapfile -t workflows < <(bash .github/scripts/changed-files.sh '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No changed GitHub workflow files for actionlint."
            exit 0
          fi
          actionlint -color "${workflows[@]}"

      - name: yamllint
        id: yamllint
        continue-on-error: true
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '\.ya?ml$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed YAML files for yamllint."
            exit 0
          fi
          yamllint -s -d '{extends: default, rules: {line-length: {max: 200}, document-start: disable, truthy: {check-keys: false}}}' "${files[@]}"

      - name: shellcheck (changed scripts)
        id: shellcheck
        continue-on-error: true
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'scripts/*.sh' 'scripts/*.bash' 'supabase/scripts/*.sh' 'supabase/scripts/*.bash')
          if [ "${#files[@]}" -ne 0 ]; then
            shellcheck --severity=warning --color=always "${files[@]}"
          else
            echo "No changed shell scripts for shellcheck."
          fi

      # .claude/hooks/*.sh were covered by NOTHING. They are few, short and
      # stable, so unlike the rest of the repo they can be checked in FULL on
      # every run rather than only when changed: a hook that stops working is
      # not something to learn about from the diff that happened to touch it.
      # One of them has already shipped a silent bug (a BSD-sed
      # incompatibility that made a rule match nothing while appearing to
      # work).
      #
      # This is a GLOB, deliberately. guard-bash.sh and guard-sql.sh were
      # deleted 2026-08-27 after being unwired, and the step kept passing
      # because it never named them.
      - name: shellcheck (safety hooks, always)
        id: shellcheck_hooks
        continue-on-error: true
        run: |
          # SC2088 is excluded for this glob ONLY. It was a false positive
          # for guard-bash.sh, which inspected the raw command STRING an agent
          # proposed (where `~` is still unexpanded) and so matched a literal
          # tilde on purpose. That hook is gone; the exclusion is kept because
          # a future hook inspecting command text would hit the same thing.
          shellcheck --severity=warning --exclude=SC2088 --color=always .claude/hooks/*.sh

      # Was: changed-files-only lint piped through `|| true`, so this check
      # was structurally incapable of failing no matter what it found —
      # yet it sat in the required aggregate. Measured 2026-08-19:
      # 34,576 pre-existing violations across the full docs/ + CLAUDE.md +
      # AGENTS.md scope (dominated by MD013 line-length and MD060
      # table-column-style — rules this repo has never enforced on prose),
      # far too many to unmask as a hard zero-violations gate. Replaced with
      # a full-scope, per-rule count ratchet (scripts/markdown-lint-ratchet.mjs,
      # same shape as scripts/lint-ratchet.mjs): the existing backlog is
      # grandfathered via .markdownlint-baseline.json, and the step fails
      # only if any rule's count goes UP. Full-scope (not changed-files) on
      # purpose — a ratchet baseline is only meaningful if measured over a
      # scope that doesn't shift under it. The script only imports node:
      # builtins, so it needs no `npm ci` / node_modules at all.
      - name: markdownlint (ratchet)
        id: markdownlint
        continue-on-error: true
        run: node scripts/markdown-lint-ratchet.mjs

      - name: ruff
        id: ruff
        continue-on-error: true
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'tools/*.py' 'tools/**/*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            ruff check "${files[@]}"
          else
            echo "No changed Python files for ruff."
          fi

      - name: pylint
        id: pylint
        continue-on-error: true
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'tools/*.py' 'tools/**/*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            pylint --disable=C,R --exit-zero "${files[@]}" | tee pylint.log
            if grep -E "^[EF][0-9]+" pylint.log; then
              exit 1
            fi
          else
            echo "No changed Python files for pylint."
          fi

      # Same story as markdownlint: a `|| true` lint that could never fail,
      # replaced 2026-08-19 with a full-scope, per-rule count ratchet
      # (scripts/sql-lint-ratchet.mjs) over supabase/migrations/*.sql +
      # supabase/seed/*.sql. The existing backlog (7,649 violations across
      # 264 of 303 files at the time; sqlfluff's own 20KB large-file safety
      # limit skips the other 18) is grandfathered via .sqlfluff-baseline.json,
      # and the step fails only if any rule's count goes UP. Full-scope on
      # purpose, for the same reason.
      - name: sqlfluff (ratchet)
        id: sqlfluff
        continue-on-error: true
        run: node scripts/sql-lint-ratchet.mjs

      - name: hadolint
        id: hadolint
        continue-on-error: true
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '(^|/)Dockerfile[^/]*$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            # Exact release binary, checksum-verified. The SHA-256 is pinned
            # here AND must match the release's own checksums.sha256, and the
            # binary must report the version we asked for.
            # scripts/review-gate-local.mjs swaps everything from the comment
            # above through the `hadolint=` line for a locally installed
            # hadolint; keep that line's shape if you edit this block.
            set -euo pipefail
            hadolint_version=2.15.1
            hadolint_sha256=c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
            hadolint_base="https://github.com/hadolint/hadolint/releases/download/v${hadolint_version}"
            hadolint_dir="$(mktemp -d)"
            curl -fsSL "${hadolint_base}/hadolint-linux-x86_64" -o "${hadolint_dir}/hadolint-linux-x86_64"
            curl -fsSL "${hadolint_base}/checksums.sha256" -o "${hadolint_dir}/checksums.sha256"
            grep -qx "${hadolint_sha256} \*hadolint-linux-x86_64" "${hadolint_dir}/checksums.sha256"
            echo "${hadolint_sha256}  ${hadolint_dir}/hadolint-linux-x86_64" | sha256sum -c -
            chmod +x "${hadolint_dir}/hadolint-linux-x86_64"
            hadolint="${hadolint_dir}/hadolint-linux-x86_64"
            "$hadolint" --version | grep -q " ${hadolint_version}$"
            "$hadolint" "${files[@]}"
          else
            echo "No changed Dockerfiles for hadolint."
          fi

      - name: env-secrets
        id: env_secrets
        continue-on-error: true
        run: node scripts/check-env-secret-fallbacks.mjs

      # `steps` (the context) holds every step above that carries an `id`, with
      # the outcome BEFORE continue-on-error rewrote it. Anything other than
      # `success` — failure, cancelled, or skipped because the install died —
      # fails this job and is printed by name.
      - name: Review Gate checks aggregate (fails if any check failed)
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          bad=0
          while IFS=$'\t' read -r id outcome; do
            if [ "$outcome" = "success" ]; then
              echo "ok      $id"
            else
              echo "FAILED  $id -> $outcome"; bad=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.outcome)"' <<< "$STEP_OUTCOMES")
          exit "$bad"

  semgrep:
    name: semgrep (custom rules)
    # Skip while draft — see `checks` above.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The legacy `returntocorp/semgrep` namespace is deprecated and pinned to
    # an older semgrep that fails to parse `pattern-inside` blocks used by
    # helmv3-server-action-missing-auth-check and helmv3-destructive-write-pattern.
    # Use the modern `semgrep/semgrep` image and pin to a known-good tag.
    # See docs/operations/2026-05-28-coderabbit-fails-investigation.md.
    # 1.178.0 (pushed 2026-09-23) is the newest tag older than the repo's
    # 7-day freshness window; the digest pins the exact multi-arch index so a
    # re-pushed tag cannot change what runs.
    container: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with helmv3 custom rules
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Skip the `.coderabbit/semgrep/__test__/` positive fixtures —
          # they are intentionally broken code that exists only to verify
          # rule-pack behaviour locally. Letting them flow into CI would
          # block every PR that touches the rule pack.
          changed_files="$(bash .github/scripts/changed-files.sh)"
          mapfile -t files < <(printf '%s\n' "$changed_files" \
            | grep -E '\.(ts|tsx|js|jsx|sql|py)$' \
            | grep -vE '^\.coderabbit/(semgrep|ast-grep)/__test__/' \
            || :)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files for semgrep."
            exit 0
          fi
          semgrep --error --config .coderabbit/semgrep/helmv3.yml --skip-unknown-extensions "${files[@]}"
      # The "Scan with default p/ci ruleset" step that used to run here was
      # removed 2026-09-05: it was a bare community ruleset with no
      # repo-specific tuning, redundant with the custom-rules step above (the
      # actual hard-rule enforcement AGENTS.md names) — see the
      # pr-checks-review audit §2(f)/§5. The Semgrep Cloud Platform App is
      # being removed (owner decision 2026-09-06); the custom-rules step
      # above is the only semgrep enforcement in this workflow. The `all`
      # aggregate below reads `needs.*.result` for the whole `semgrep` JOB,
      # not per-step outcomes, so removing a step here needed no change to
      # that logic.

  all:
    # Renamed from the bare `all` (2026-08-19): ci.yml's aggregate job was
    # ALSO named `all`, so both workflows posted an identically-named check
    # run and a single required context "all" could not tell them apart —
    # see .github/branch-protection.md and docs/CI_RUNBOOK.md for the
    # PR #1125 incident this caused. Job id stays `all` (nothing references
    # it via `needs:`); only `name:` — the actual check-run/required-context
    # string — needed to change, and it must stay globally unique across
    # every workflow in this repo.
    name: Review Gate aggregate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - checks
      - semgrep
    steps:
      - name: Fail on a draft PR (full suite runs on ready_for_review)
        # Owner decision 2026-09-23: checks/semgrep skip on a draft, and a
        # green aggregate from that run stayed attached to the head SHA after
        # the PR was marked ready (#2049). Only a real, non-draft run may turn
        # this required check green.
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "Draft PR: review-gate checks were skipped. They run when the PR is marked ready for review."
          exit 1
      # Any failure fails. A cancellation or skip fails too — UNLESS the PR's
      # live head is no longer this run's commit (2026-09-23): a new push
      # cancels the running gate via `concurrency`, and this always() job used
      # to paint that cancellation red on the superseded commit. Fail closed
      # if the live head cannot be read. The draft case is caught above.
      - name: Fail if any required check failed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "needs results: $RESULTS"
          if jq -e 'index("failure")' <<< "$RESULTS" >/dev/null; then
            echo "One or more review-gate checks failed."; exit 1
          fi
          if ! jq -e 'index("cancelled") or index("skipped")' <<< "$RESULTS" >/dev/null; then
            echo "review-gate clean."; exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            live="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha 2>/dev/null || true)"
            if [ -n "$live" ] && [ "$live" != "$RUN_HEAD" ]; then
              echo "::notice::Superseded: PR head is now ${live:0:12}, this run was for ${RUN_HEAD:0:12}."
              exit 0
            fi
          fi
          echo "One or more review-gate checks were cancelled or skipped on the current head."
          exit 1
