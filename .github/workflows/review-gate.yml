name: Review Gate

# Mirrors CodeRabbit's pre-merge gate so devs catch issues before pushing.
# Runs the same toolchain CodeRabbit invokes (ast-grep, semgrep, gitleaks,
# ruff, shellcheck, actionlint, yamllint, markdownlint, sqlfluff, hadolint)
# scoped to changed paths. Each tool runs in parallel.
#
# SECURITY: This workflow consumes ZERO untrusted user input (no
# github.event.*.title, .body, .message, .ref, etc. in any run: block).
# All ${{ }} expressions are either trusted refs (github.ref for
# concurrency), platform tokens (secrets.GITHUB_TOKEN), or job-status
# metadata (needs.*.result).
#
# Required status check: "Review Gate / all" - wire into
# .github/branch-protection.md so it blocks merge alongside `build` and
# the Supabase RLS job.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: review-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ast-grep:
    name: ast-grep (project rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ast-grep
        run: |
          curl -L https://github.com/ast-grep/ast-grep/releases/latest/download/app-x86_64-unknown-linux-gnu.zip -o ast-grep.zip
          unzip -q ast-grep.zip
          sudo mv ast-grep /usr/local/bin/sg
          sg --version

      - name: Scan changed TypeScript with blocking project rules
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '\.(ts|tsx)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed TypeScript files for ast-grep."
            exit 0
          fi

          fail=0
          rules=(
            .coderabbit/ast-grep/no-bare-table-names.yml
            .coderabbit/ast-grep/no-deep-types-import.yml
            .coderabbit/ast-grep/no-process-env-in-edge.yml
            .coderabbit/ast-grep/no-service-role-in-client.yml
          )
          for rule in "${rules[@]}"; do
            echo "::group::$rule"
            sg scan --rule "$rule" --error "${files[@]}" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  semgrep:
    name: semgrep (custom rules)
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan with helmv3 custom rules
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          files="$(bash .github/scripts/changed-files.sh | grep -E '\.(ts|tsx|js|jsx|sql|py)$' || true)"
          if [ -z "$files" ]; then
            echo "No changed files for semgrep."
            exit 0
          fi
          semgrep --error --config .coderabbit/semgrep/helmv3.yml --skip-unknown-extensions $files
      - name: Scan with default p/ci ruleset
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          files="$(bash .github/scripts/changed-files.sh | grep -E '\.(ts|tsx|js|jsx|sql|py|sh|bash|ya?ml)$' || true)"
          if [ -z "$files" ]; then
            echo "No changed files for semgrep p/ci."
            exit 0
          fi
          semgrep --error --config p/ci --skip-unknown-extensions $files

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run actionlint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mapfile -t workflows < <(bash .github/scripts/changed-files.sh '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No changed GitHub workflow files for actionlint."
            exit 0
          fi
          ./actionlint -color "${workflows[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - name: Run yamllint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '\.ya?ml$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed YAML files for yamllint."
            exit 0
          fi
          yamllint -s -d '{extends: default, rules: {line-length: {max: 200}, document-start: disable, truthy: {check-keys: false}}}' "${files[@]}"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run shellcheck
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'scripts/*.sh' 'scripts/*.bash' 'supabase/scripts/*.sh' 'supabase/scripts/*.bash')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed shell scripts for shellcheck."
            exit 0
          fi
          shellcheck --severity=warning --color=always "${files[@]}"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '(^docs/.*\.md$|^(CLAUDE|AGENTS|CLAUDE_CODE_GUIDE)\.md$)' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Markdown files for markdownlint."
            exit 0
          fi
          markdownlint-cli2 "${files[@]}" "!**/node_modules/**" "!**/archive/**" "!**/.full-review*/**" || true

  python:
    name: ruff + pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pylint
      - name: ruff check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'tools/*.py' 'tools/**/*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            ruff check "${files[@]}"
          else
            echo "No changed Python files for ruff."
          fi
      - name: pylint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'tools/*.py' 'tools/**/*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            pylint --disable=C,R --exit-zero "${files[@]}" | tee pylint.log
            if grep -E "^[EF][0-9]+" pylint.log; then
              exit 1
            fi
          else
            echo "No changed Python files for pylint."
          fi

  sqlfluff:
    name: sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlfluff
      - name: Lint Postgres SQL
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'supabase/migrations/*.sql' 'supabase/seed/*.sql')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed SQL files for sqlfluff."
            exit 0
          fi
          sqlfluff lint --dialect postgres --rules core "${files[@]}" || true

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hadolint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '(^|/)Dockerfile[^/]*$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            curl -fsSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
            chmod +x hadolint
            ./hadolint --no-fail "${files[@]}"
          else
            echo "No changed Dockerfiles for hadolint."
          fi

  all:
    name: all
    if: always()
    runs-on: ubuntu-latest
    needs:
      - ast-grep
      - semgrep
      - gitleaks
      - actionlint
      - yamllint
      - shellcheck
      - markdownlint
      - python
      - sqlfluff
      - hadolint
    steps:
      - name: Fail if any required check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more review-gate checks failed."
          exit 1
      - name: All checks green
        run: echo "review-gate clean."
