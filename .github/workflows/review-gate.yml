name: Review Gate

# Mirrors CodeRabbit's pre-merge gate so devs catch issues before pushing.
# Runs the same toolchain CodeRabbit invokes (ast-grep, semgrep, gitleaks,
# ruff, shellcheck, actionlint, yamllint, markdownlint, sqlfluff, hadolint)
# scoped to changed paths. Each tool runs in parallel.
#
# SECURITY: This workflow consumes ZERO untrusted user input (no
# github.event.*.title, .body, .message, .ref, etc. in any run: block).
# All ${{ }} expressions are either trusted refs (github.ref for
# concurrency), platform tokens (secrets.GITHUB_TOKEN), or job-status
# metadata (needs.*.result).
#
# Required status check: "Review Gate / all" - wire into
# .github/branch-protection.md so it blocks merge alongside `build` and
# the Supabase RLS job.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: review-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ast-grep:
    name: ast-grep (project rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ast-grep
        run: |
          curl -L https://github.com/ast-grep/ast-grep/releases/download/0.44.0/app-x86_64-unknown-linux-gnu.zip -o ast-grep.zip
          unzip -q ast-grep.zip
          sudo mv ast-grep /usr/local/bin/sg
          sg --version

      - name: Scan changed TypeScript with blocking project rules
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Exclude rule-pack positive fixtures from CI scans — they exist
          # only to exercise the rules locally and are intentionally broken.
          mapfile -t all_files < <(bash .github/scripts/changed-files.sh \
            | grep -E '\.(ts|tsx)$' \
            | grep -vE '^\.coderabbit/(semgrep|ast-grep)/__test__/' \
            || true)
          if [ "${#all_files[@]}" -eq 0 ]; then
            echo "No changed TypeScript files for ast-grep."
            exit 0
          fi

          # filter_files <include_regex> <exclude_regex>
          # Returns the changed-files list filtered to paths matching the include
          # regex and NOT matching the exclude regex. Both are extended grep
          # regexes; pass "" to skip either filter. Output is one path per line.
          filter_files() {
            local include_re="$1"
            local exclude_re="$2"
            for f in "${all_files[@]}"; do
              if [ -n "$include_re" ] && ! printf '%s\n' "$f" | grep -Eq "$include_re"; then
                continue
              fi
              if [ -n "$exclude_re" ] && printf '%s\n' "$f" | grep -Eq "$exclude_re"; then
                continue
              fi
              printf '%s\n' "$f"
            done
          }

          # Each rule below has a path scope baked in here so the rule fires
          # only on the paths it is meant for. Without this filter the rules
          # ran repo-wide and produced hundreds of false positives. See
          # docs/operations/2026-05-28-coderabbit-fails-investigation.md.
          fail=0

          run_rule() {
            local rule="$1"
            local include_re="$2"
            local exclude_re="$3"
            local label="$4"

            mapfile -t scoped < <(filter_files "$include_re" "$exclude_re")
            echo "::group::$rule (${label})"
            if [ "${#scoped[@]}" -eq 0 ]; then
              echo "No in-scope files for $rule"
              echo "::endgroup::"
              return 0
            fi
            printf '  scope-hit: %s\n' "${scoped[@]}"
            if ! sg scan --rule "$rule" --error "${scoped[@]}"; then
              fail=1
            fi
            echo "::endgroup::"
          }

          # Repo-wide rules — match every changed TS/TSX file.
          run_rule .coderabbit/ast-grep/no-bare-table-names.yml \
            '' '' 'repo-wide'
          run_rule .coderabbit/ast-grep/no-deep-types-import.yml \
            '' '' 'repo-wide'

          # Edge-Functions-only rule — Deno runtime, process.env is undefined.
          # Mirrors .coderabbit.yaml > path_instructions for supabase/functions/.
          run_rule .coderabbit/ast-grep/no-process-env-in-edge.yml \
            '^supabase/functions/.*\.ts$' '' 'supabase/functions/**'

          # Service-role rule — must skip admin-only / server-only / cron /
          # rate-limit / push-notification / Edge Function paths. Mirrors the
          # exclude list in .coderabbit/semgrep/helmv3.yml for the equivalent
          # semgrep rule (helmv3-service-role-outside-admin).
          run_rule .coderabbit/ast-grep/no-service-role-in-client.yml \
            '\.(ts|tsx)$' \
            '^(src/lib/supabase/admin|src/lib/supabase/service|src/lib/auth/supabase-rate-limit|src/lib/notifications/push|src/app/api/admin/|src/app/api/.+/admin/|scripts/|supabase/functions/)' \
            'no-admin/scripts/edge'

          exit $fail

  semgrep:
    name: semgrep (custom rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The legacy `returntocorp/semgrep` namespace is deprecated and pinned to
    # an older semgrep that fails to parse `pattern-inside` blocks used by
    # helmv3-server-action-missing-auth-check and helmv3-destructive-write-pattern.
    # Use the modern `semgrep/semgrep` image and pin to a known-good tag.
    # See docs/operations/2026-05-28-coderabbit-fails-investigation.md.
    container: semgrep/semgrep:1.157.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with helmv3 custom rules
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Skip the `.coderabbit/semgrep/__test__/` positive fixtures —
          # they are intentionally broken code that exists only to verify
          # rule-pack behaviour locally. Letting them flow into CI would
          # block every PR that touches the rule pack.
          changed_files="$(bash .github/scripts/changed-files.sh)"
          mapfile -t files < <(printf '%s\n' "$changed_files" \
            | grep -E '\.(ts|tsx|js|jsx|sql|py)$' \
            | grep -vE '^\.coderabbit/(semgrep|ast-grep)/__test__/' \
            || :)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files for semgrep."
            exit 0
          fi
          semgrep --error --config .coderabbit/semgrep/helmv3.yml --skip-unknown-extensions "${files[@]}"
      - name: Scan with default p/ci ruleset
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changed_files="$(bash .github/scripts/changed-files.sh)"
          mapfile -t files < <(printf '%s\n' "$changed_files" \
            | grep -E '\.(ts|tsx|js|jsx|sql|py|sh|bash|ya?ml)$' \
            | grep -vE '^\.coderabbit/(semgrep|ast-grep)/__test__/' \
            || :)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files for semgrep p/ci."
            exit 0
          fi
          semgrep --error --config p/ci --skip-unknown-extensions "${files[@]}"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run actionlint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pinned to an immutable release tag (was `main`, a mutable branch —
          # a compromised main could inject arbitrary code into this security
          # gate via the piped install).
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash)
          mapfile -t workflows < <(bash .github/scripts/changed-files.sh '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No changed GitHub workflow files for actionlint."
            exit 0
          fi
          ./actionlint -color "${workflows[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - name: Run yamllint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '\.ya?ml$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed YAML files for yamllint."
            exit 0
          fi
          yamllint -s -d '{extends: default, rules: {line-length: {max: 200}, document-start: disable, truthy: {check-keys: false}}}' "${files[@]}"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run shellcheck
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'scripts/*.sh' 'scripts/*.bash' 'supabase/scripts/*.sh' 'supabase/scripts/*.bash')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed shell scripts for shellcheck."
            exit 0
          fi
          shellcheck --severity=warning --color=always "${files[@]}"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
      - run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '(^docs/.*\.md$|^(CLAUDE|AGENTS|CLAUDE_CODE_GUIDE)\.md$)' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Markdown files for markdownlint."
            exit 0
          fi
          markdownlint-cli2 "${files[@]}" "!**/node_modules/**" "!**/archive/**" "!**/.full-review*/**" || true

  python:
    name: ruff + pylint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install ruff pylint
      - name: ruff check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'tools/*.py' 'tools/**/*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            ruff check "${files[@]}"
          else
            echo "No changed Python files for ruff."
          fi
      - name: pylint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'tools/*.py' 'tools/**/*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            pylint --disable=C,R --exit-zero "${files[@]}" | tee pylint.log
            if grep -E "^[EF][0-9]+" pylint.log; then
              exit 1
            fi
          else
            echo "No changed Python files for pylint."
          fi

  sqlfluff:
    name: sqlfluff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install sqlfluff
      - name: Lint Postgres SQL
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh 'supabase/migrations/*.sql' 'supabase/seed/*.sql')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed SQL files for sqlfluff."
            exit 0
          fi
          sqlfluff lint --dialect postgres --rules core "${files[@]}" || true

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run hadolint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t files < <(bash .github/scripts/changed-files.sh | grep -E '(^|/)Dockerfile[^/]*$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64 -o hadolint
            chmod +x hadolint
            ./hadolint --no-fail "${files[@]}"
          else
            echo "No changed Dockerfiles for hadolint."
          fi

  all:
    name: all
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - ast-grep
      - semgrep
      - gitleaks
      - actionlint
      - yamllint
      - shellcheck
      - markdownlint
      - python
      - sqlfluff
      - hadolint
    steps:
      - name: Fail if any required check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more review-gate checks failed."
          exit 1
      - name: All checks green
        run: echo "review-gate clean."
