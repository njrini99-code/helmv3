# Self-heal Repair — the stage that turns a diagnosis into a pull request.
#
# WHY THIS EXISTS (closes #1807)
#
# Repair ran on the owner's laptop via launchd. Bridge's own Self-heal panel
# described the consequence precisely: "Local agent — runs on the owner's
# laptop, outside this deployment — nothing here can watch it fail, only notice
# that it stopped writing a heartbeat." Measured 2026-09-03, its capability read
# UNPROVEN: it has never opened a pull request, while Diagnose (112 analyses in
# 7 days) and Close (83 auto-resolutions) were both PROVEN. A loop whose middle
# stage has never produced its output is not a self-healing loop.
#
# WHY NOT A VERCEL CRON, LIKE DIAGNOSE
#
# Diagnose moved to a Vercel cron in #1775 because it only reads rows, calls
# Anthropic and writes rows — that fits a serverless function. Repair cannot:
# docs/ai-system/selfheal/repair-contract.md has it create a worktree, fetch
# from origin, install dependencies, reproduce the bug with a FAILING test, fix
# it, and open a PR. That needs a filesystem, git, a test runner and minutes of
# runtime. GitHub Actions has all four; a serverless function has none.
#
# The shape is not new here — types-regen.yml is already a scheduled workflow
# holding contents:write + pull-requests:write that opens a PR when production
# drifts. This is that pattern pointed at incidents instead of types.
#
# THE SAFETY BOUND IS THE CONTRACT'S, UNCHANGED
#
# Repair opens pull requests. It never merges and never deploys. `main` requires
# five status checks, so nothing this workflow produces can reach production
# without CI passing AND a human merging. The agent is additionally told
# branch-and-PR-only in its system prompt, and the job holds no deploy
# credential of any kind.
---
name: Self-heal Repair

"on":
  schedule:
    # Daily at 06:40 UTC — the cadence the launchd agent already ran on, so the
    # Bridge "next expected" reading does not move when the runtime does.
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyse and report, but do not open a PR'
        type: boolean
        default: false

# contents: write and pull-requests: write are what create-a-PR needs, and are
# the same two this repo already grants types-regen.yml. Deliberately NOT
# granting `actions: write` or environment access — this job must not be able to
# rewrite CI or reach a deployment.
permissions:
  contents: write
  pull-requests: write
  # Required by claude-code-action: it exchanges a GitHub OIDC token for its
  # own credential, and without this the action fails before Claude ever
  # starts — "Could not fetch an OIDC token", retried 3× then fatal. Learned
  # from the workflow's first-ever run (33821046930), which failed here.
  # This grants an identity assertion, not repository write; it does not widen
  # what the job can change.
  id-token: write

# One Repair at a time. Two concurrent runs would each open a PR for the same
# finding, and the second would branch from a tree the first had already moved.
concurrency:
  group: selfheal-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair
    # Same switch claude-code.yml uses, so the owner can stop every autonomous
    # agent in one place without editing a workflow.
    if: ${{ vars.ENABLE_CLAUDE_CODE_ACTION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # STEP 2 of the contract checks `git log` on the suspect files to see
          # whether the bug was already fixed after the last occurrence. A
          # shallow clone cannot answer that and would have Repair "fix" work
          # that is already merged.
          fetch-depth: 0

      - name: Setup Node
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Invoked through the Claude Code CLI, NOT anthropics/claude-code-action.
      #
      # The action is trigger-driven: its own log shows `trigger_phrase:
      # @claude`
      # and `label_trigger: claude`, and it expects an issue or PR comment
      # event.
      # On a schedule or workflow_dispatch there is no such event, so it SKIPS
      # every internal step and the job still exits 0. Run 33821349146 went
      # green
      # in 56ms having never started Claude — seven skipped sub-actions, no
      # turns, no tokens, no output. A scheduled agent needs an invocation that
      # runs unattended, which is what the CLI does and what the launchd agent
      # this replaces has always used.
      - name: Run Repair
        id: repair
        env:
          # Subscription auth. No ANTHROPIC_API_KEY here on purpose — the owner
          # asked that agent work bill to the subscription, and its absence
          # means there is no path to fall back to metered billing silently.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # TODO(O6): once the owner creates HELM_REPAIR_DB_KEY from the
          # helm_repair_ro role (supabase/migrations/HELD.md action O6(b) —
          # SELECT on background_job_logs/admin_events/admin_error_resolutions,
          # INSERT on only its own heartbeat), drop the SUPABASE_SERVICE_ROLE_KEY
          # fallback below. Repair has never needed more than that scoped
          # access; the full service-role key is wider than this contract uses.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HELM_REPAIR_DB_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELFHEAL_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -uo pipefail
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version

          dry=""
          if [ "${SELFHEAL_DRY_RUN}" = "true" ]; then
            dry="THIS IS A DRY RUN. Do all the analysis, then report what you
          WOULD repair. Do not create a branch and do not open any pull
          request."
          fi

          claude -p "You are the Repair stage of Helm's self-heal loop.
          Follow docs/ai-system/selfheal/repair-contract.md exactly and in
          order,
          including STEP 0b's refusal to run on a stale board and STEP 3's
          requirement to work in a worktree outside the checkout. Follow
          CLAUDE.md and AGENTS.md.
          Hard limits: branch and PR only, never push to main, never merge,
          never deploy. Open at most THREE pull requests. If a finding cannot be
          reproduced with a failing test, do NOT open a PR for it — say so and
          move on. ${dry}
          End your reply with a line of the form
          REPAIR-SUMMARY: <what you did>." \
            --permission-mode bypassPermissions \
            --output-format stream-json --verbose 2>&1 | tee /tmp/repair-out.log
          rc=${PIPESTATUS[0]}

          # A green step must mean Claude actually ran. The action this replaces
          # reported success after skipping everything, which is the exact
          # failure class this loop exists to detect — so the evidence is
          # checked
          # here rather than trusted.
          if ! grep -q "REPAIR-SUMMARY:" /tmp/repair-out.log; then
            echo "::error::Repair produced no REPAIR-SUMMARY line."
            echo "Treating as a failed run, not a quiet success."
            echo "did_work=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "did_work=true" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The Bridge Self-heal panel reads runtime from
      # background_job_logs. Without this the stage would run correctly and
      # still render as silent — the exact
      # failure mode this workflow exists to remove. `if: always()` so a failed
      # Repair records a FAILED heartbeat rather than no heartbeat, because
      # "it broke" and "it never ran" must not look identical.
      - name: Write the Repair heartbeat
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # TODO(O6): same HELM_REPAIR_DB_KEY swap as the "Run Repair" step
          # above — this write is only ever the one heartbeat row STEP 6 of
          # repair-contract.md describes, which the scoped role's INSERT
          # policy already permits.
          SERVICE_KEY: ${{ secrets.HELM_REPAIR_DB_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTCOME: ${{ steps.repair.outcome }}
          # `outcome` alone is not evidence. A skipped action reports success,
          # which is how run 33821349146 wrote a `completed` heartbeat for work
          # that never happened. did_work is set only after the run's own output
          # is checked for a REPAIR-SUMMARY line.
          DID_WORK: ${{ steps.repair.outputs.did_work }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          status="completed"
          [ "$OUTCOME" = "success" ] || status="failed"
          # Both must hold. A step that succeeded without doing the work is a
          # failed Repair, not a completed one.
          [ "${DID_WORK:-false}" = "true" ] || status="failed"
          run_url="$REPO_URL/actions/runs/$RUN_ID"
          jt='"job_type":"selfheal-repair"'
          body=$(printf '{%s,"status":"%s",' "$jt" "$status")
          body="$body$(printf '"error_message":"Actions run: %s",' "$run_url")"
          body="$body$(printf '"metadata":{"runtime":"github-actions"}}')"
          curl -sS -X POST "$SUPABASE_URL/rest/v1/background_job_logs" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$(printf '%s' "$body")" \
            && echo "heartbeat written: $status"

      - name: Bound reminder
        if: always()
        run: |
          echo "Repair is PR-only: it never merges and never deploys."
          echo "main requires five status checks and a human merge."
