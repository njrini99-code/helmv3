name: Repomix Context

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/repomix-context.yml'
      - '.repomixignore'
      - 'repomix.config.json'
      - 'scripts/context/repomix.sh'
      - 'src/**'
      - 'supabase/**'
      - 'docs/**'
      - 'memory/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  context-packs:
    name: Generate context packs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate docs context
        run: npm run ctx:docs

      - name: Generate DB context
        run: npm run ctx:db

      - name: Generate Helm Bridge context
        run: npm run ctx:admin

      - name: Generate changed-files context
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          git diff --name-only "origin/${BASE_REF}...HEAD" |
            bash scripts/context/repomix.sh --stdin --include-diffs \
              --include-logs --include-logs-count 15 \
              --output .repomix/changed-files-context.xml \
              --style xml --top-files-len 40

      - name: Generate compressed repo context
        if: github.event_name == 'workflow_dispatch'
        run: npm run ctx:repo:compressed

      - name: Upload context packs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repomix-context
          path: .repomix/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
