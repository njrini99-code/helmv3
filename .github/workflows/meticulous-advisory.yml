name: Meticulous AI (Advisory)

# Meticulous requires a GitHub App install + project token.
# See docs/operations/integrations/METICULOUS.md for setup.
# This workflow is a placeholder until METICULOUS_API_TOKEN is configured.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  meticulous:
    name: Meticulous visual diff
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Detect Meticulous configuration
        id: cfg
        env:
          METICULOUS_API_TOKEN: ${{ secrets.METICULOUS_API_TOKEN }}
        run: |
          if [ -n "$METICULOUS_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Meticulous AI — skipped"
            echo ""
            echo "No \`METICULOUS_API_TOKEN\` repository secret. See \`docs/operations/integrations/METICULOUS.md\`."
            echo "This job is advisory and does not block merge."
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Meticulous test runner
        if: steps.cfg.outputs.configured == 'true'
        uses: alwaysmeticulous/report-diffs@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          # Uncomment and set METICULOUS_PROJECT_ID secret when project is created:
          # project-id: ${{ secrets.METICULOUS_PROJECT_ID }}
