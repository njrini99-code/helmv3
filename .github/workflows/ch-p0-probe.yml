name: CH P0 probe (temporary, removed before review)
on:
  push:
    branches: [agent/ch-p0-gate]
permissions:
  contents: read
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-presentation-fixture-only
  NEXT_PUBLIC_SUPABASE_ANON_KEY: local-presentation-fixture-only
  NEXT_TELEMETRY_DISABLED: '1'
  CH_QUALITY: '1'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Discover findings on the P0 screens
        continue-on-error: true
        env:
          CH_GATE_DISCOVER: '1'
          CH_GATE_REPORT: probe/report.jsonl
        run: ./node_modules/.bin/playwright test --config playwright.clubhouse.config.ts --project gate-phone --project gate-desktop --grep ' (home-coach|home-coach-stress|home-player|roster|roster-long|team-stress) (light|dark) discover' --reporter line
      - name: Print P0 findings
        if: always()
        run: |
          jq -c '{key, f: [.findings[] | select(.check == "row-inset" or .check == "card-escape" or .check == "cramped-text" or .check == "nested-surface") | "\(.check) @ \(.at): \(.detail)"]}' probe/report.jsonl || true
