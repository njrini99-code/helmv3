name: Database types regen

# THE SELF-HEALING HALF OF THE TYPES-DRIFT GATE.
#
# `Database types drift` (ci.yml) fails every open PR the moment the live
# schema and src/lib/types/database.ts disagree — by design, because MCP-applied
# schema changes are invisible to git. What was missing was the repair arm:
# on 2026-08-20 a single audit table created at 19:00 redded every open PR's
# drift check until a human regenerated types by hand at 20:45. This workflow
# is that human, on a schedule: regenerate from production, and if anything
# changed, open an auto-PR exactly like docs-regen.yml does for inventory.
#
# The drift check stays a PR gate — this just bounds how long a red lasts to
# one cron interval instead of "until someone notices".

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: types-regen
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate database types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate types from production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN unset; cannot regenerate. The drift gate will catch any drift but nothing will self-heal."
            exit 0
          fi
          npx --no-install supabase gen types typescript \
            --project-id "${SUPABASE_PROJECT_REF:-qmnssrrolpinvwjjnufo}" \
            > src/lib/types/database.ts

      - name: Open auto-PR when the types changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # GITHUB_TOKEN CANNOT MAKE THIS PR GO GREEN ON ITS OWN. GitHub
          # suppresses `pull_request`-triggered workflow runs (ci.yml,
          # review-gate.yml) on any PR whose triggering event was itself
          # caused by the repo's default GITHUB_TOKEN — that is the
          # recursion-prevention rule documented at
          # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow.
          # #1544 and #1552 both sat with zero CI runs because of exactly
          # this: required checks never posted, so `gh pr merge --auto`
          # could never fire.
          #
          # Closing and reopening the PR is NOT a fix here: peter-evans/
          # create-pull-request's own docs list that as a workaround only
          # when done MANUALLY by a human — an automated close/reopen using
          # this same GITHUB_TOKEN identity is still "triggered by
          # GITHUB_TOKEN" and is suppressed the same way the original PR was.
          #
          # The token's own docs name a PAT (or a GitHub App installation
          # token) as the standard fix: a token that is NOT GITHUB_TOKEN
          # doesn't trip the suppression, so `pull_request` runs fire
          # normally. `secrets.REGEN_PR_PAT` is checked first with a
          # fallback to the default token, so nothing here breaks before the
          # secret exists — but until an owner adds a fine-grained PAT (repo
          # scope: contents:write, pull-requests:write) as
          # `REGEN_PR_PAT` in repo settings, this workflow keeps producing
          # PRs that never go green. See docs/CI_RUNBOOK.md for how to
          # rerun/rescue an auto-regen PR by hand in the meantime.
          token: ${{ secrets.REGEN_PR_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(types): regen database.ts from production schema"
          branch: types/auto-regen
          delete-branch: true
          title: "chore(types): regen database.ts from production schema"
          body: |
            Automated regeneration — the live schema changed and the committed
            types drifted. Merging this restores the `Database types drift`
            gate to green for every open PR.

            🤖 Opened by `.github/workflows/types-regen.yml`
          add-paths: src/lib/types/database.ts
