name: Database types regen

# THE TYPES-DRIFT CHECK AND ITS REPAIR ARM, IN ONE PLACE (2026-09-23).
#
# `src/lib/types/database.ts` is generated from the PRODUCTION schema. Until
# 2026-09-23 a `Database types drift` step in ci.yml's `Static checks`
# compared every pull request's copy of that file to the live production
# schema. A production apply therefore turned `main` and every open PR red at
# the same instant, for a change none of those PRs made: on 2026-09-23 it was
# 10 of the 16 real first-push failures across open PRs. A PR cannot fix that
# drift except by also carrying an unrelated regen, and a regen PR could not
# land until everyone else's CI had already gone red.
#
# The check now lives here and runs where the drift actually comes from:
#
#   workflow_run (db-apply completed)  right after a production apply, the
#                                      moment the schema can have moved
#   push to main (migrations / types)  a merge that touches either side
#   schedule (every 3h)                MCP/dashboard changes git cannot see
#   workflow_dispatch / repository_dispatch (types-regen)   by hand or API
#
# It runs `npm run check:types-drift` (the same script the PR step ran) and,
# when that fails, regenerates the file from production and opens or updates
# the `types/auto-regen` PR. The job fails only when it could NOT do that —
# drift found and handed to a PR is the repair working, not an error.
#
# What a PR no longer proves: that its database.ts matches production. It
# never could reliably — the file tracks production, not the PR — and a PR
# that adds a migration is compared against its own migrations by
# ci.yml's `Supabase lint + RLS tests` job (squawk, declarative schema,
# schema invariants, pgTAP), which is the check that belongs to the PR.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [types-regen]
  workflow_run:
    workflows: [db-apply]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/lib/types/database.ts'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: types-regen
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate database types
    # A failed or cancelled db-apply changed nothing in production.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # workflow_run / schedule / dispatch all run on the default branch;
          # name it so a push-triggered run and a dispatched one agree.
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Exits 0 with a warning when SUPABASE_ACCESS_TOKEN is unset (see the
      # script), so "no token" never opens an empty PR.
      - name: Database types drift (main vs production)
        id: drift
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run check:types-drift

      - name: Regenerate types from production
        if: steps.drift.outcome == 'failure'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          npx --no-install supabase gen types typescript \
            --project-id "${SUPABASE_PROJECT_REF:-qmnssrrolpinvwjjnufo}" > "$tmp"
          # Never replace the file with an error page or an empty result.
          grep -q 'export type Database' "$tmp"
          mv "$tmp" src/lib/types/database.ts
          # The table/enum inventory blocks are generated FROM database.ts;
          # without this the auto-PR fails `Generated inventory is current`.
          npm run docs:regen
          git --no-pager diff --stat

      - name: Open or update the types auto-PR
        id: cpr
        if: steps.drift.outcome == 'failure'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # GITHUB_TOKEN CANNOT MAKE THIS PR GO GREEN ON ITS OWN. GitHub
          # suppresses `pull_request`-triggered workflow runs (ci.yml,
          # review-gate.yml) on any PR whose triggering event was itself
          # caused by the repo's default GITHUB_TOKEN — that is the
          # recursion-prevention rule documented at
          # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow.
          # #1544 and #1552 both sat with zero CI runs because of exactly
          # this: required checks never posted, so `gh pr merge --auto`
          # could never fire.
          #
          # Closing and reopening the PR is NOT a fix here: peter-evans/
          # create-pull-request's own docs list that as a workaround only
          # when done MANUALLY by a human — an automated close/reopen using
          # this same GITHUB_TOKEN identity is still "triggered by
          # GITHUB_TOKEN" and is suppressed the same way the original PR was.
          #
          # `secrets.REGEN_PR_PAT` is checked first with a fallback to the
          # default token, so nothing here breaks before the secret exists —
          # but until an owner adds a fine-grained PAT (repo scope:
          # contents:write, pull-requests:write) as `REGEN_PR_PAT`, the PR
          # needs a human push (or close/reopen by hand) to get CI. See
          # docs/CI_RUNBOOK.md.
          token: ${{ secrets.REGEN_PR_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(types): regen database.ts from production schema"
          branch: types/auto-regen
          delete-branch: true
          title: "chore(types): regen database.ts from production schema"
          body: |
            Automated regeneration — the production schema changed and the
            committed `src/lib/types/database.ts` no longer matches it.

            Pull requests are no longer gated on this drift (see the header
            of `.github/workflows/types-regen.yml`); merging this brings
            `main` back in line with production.

            🤖 Opened by `.github/workflows/types-regen.yml`
          add-paths: |
            src/lib/types/database.ts
            memory/glossary.md
            memory/projects/golfhelm.md
            memory/context/golfhelm-database.md

      - name: Summary
        if: always()
        env:
          DRIFT: ${{ steps.drift.outcome }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          if [ "$DRIFT" = "success" ]; then
            echo "database.ts matches production." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR_URL" ]; then
            echo "::warning::database.ts drifted from production — auto-PR ${PR_OP:-updated}: $PR_URL"
            echo "database.ts drifted from production — auto-PR ${PR_OP:-updated}: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::database.ts drifted from production and no auto-PR was opened."
            exit 1
          fi
