# Dependabot — grouped, scheduled dependency-update PRs.
#
# Note: SECURITY updates are raised separately and immediately by Dependabot
# regardless of the schedule/groups below. The groups here exist to batch the
# routine version bumps so they arrive as a few reviewable PRs instead of dozens.
#
# Every ecosystem sets a 7-day `cooldown` so freshly published versions (a
# common supply-chain attack window) are not proposed until they have been
# public for a week. Security updates ignore the cooldown and still arrive
# immediately.
#
# Not covered here (extend if/when needed):
#   - Edge Function `npm:` specifiers under supabase/functions (Deno; no
#     manifest Dependabot can read)
version: 2
updates:
  # ── npm (repo root) ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
    groups:
      # ALL dev-dependency bumps (majors included) → one PR.
      dev-dependencies:
        dependency-type: "development"
        # Minor and patch only. A major rides alone as its own PR, so a
        # typescript 5→7 or jsdom 28→30 cannot make a 12-package group
        # unmergeable and unreviewable at once (2026-09-02: #1744 carried
        # four majors and failed lint on "typescript-eslint does not
        # support TS 7.0"; #1745 carried 30 updates).
        update-types:
          - "minor"
          - "patch"
      # ALL production bumps (majors included) → one PR. 2026-07-03 a Monday
      # run opened ~13 individual major PRs, each triggering a billed Vercel
      # preview build; one reviewable PR per dependency-type instead.
      production-dependencies:
        dependency-type: "production"
        # Minor and patch only. A major rides alone as its own PR, so a
        # typescript 5→7 or jsdom 28→30 cannot make a 12-package group
        # unmergeable and unreviewable at once (2026-09-02: #1744 carried
        # four majors and failed lint on "typescript-eslint does not
        # support TS 7.0"; #1745 carried 30 updates).
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # The composite action's own `uses:` pins. Dependabot's "/" entry reads
  # only .github/workflows/, never .github/actions/*/action.yml.
  - package-ecosystem: "github-actions"
    rebase-strategy: "disabled"
    directory: "/.github/actions/local-supabase-stack"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    groups:
      local-supabase-stack-actions:
        patterns:
          - "*"

  # ── Nested npm projects (kept out of the root manifest) ───────────────────
  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/tools/ultra-agent-audit"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      ultra-agent-audit:
        patterns:
          - "*"
        # Minor and patch only. A major rides alone as its own PR, so a
        # typescript 5→7 or jsdom 28→30 cannot make a 12-package group
        # unmergeable and unreviewable at once (2026-09-02: #1744 carried
        # four majors and failed lint on "typescript-eslint does not
        # support TS 7.0"; #1745 carried 30 updates).
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/tools/ux-flow-auditor"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      ux-flow-auditor:
        patterns:
          - "*"
        # Minor and patch only. A major rides alone as its own PR, so a
        # typescript 5→7 or jsdom 28→30 cannot make a 12-package group
        # unmergeable and unreviewable at once (2026-09-02: #1744 carried
        # four majors and failed lint on "typescript-eslint does not
        # support TS 7.0"; #1745 carried 30 updates).
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/.claude/skills/golfhelm-creative-engine/tools"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      golfhelm-creative-engine:
        patterns:
          - "*"
        # Minor and patch only; a major rides alone as its own PR.
        update-types:
          - "minor"
          - "patch"

  # ── iOS native (Swift Package Manager under the Capacitor app) ────────────
  - package-ecosystem: "swift"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/ios/App/CapApp-SPM"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "mobile"

  # ── Android native (Gradle under the Capacitor app) ───────────────────────
  # AGP / Gradle / androidx versions must stay inside what the installed
  # @capacitor/android major supports (its android-template), so majors are
  # ignored here and moved together with a Capacitor upgrade instead.
  - package-ecosystem: "gradle"
    rebase-strategy: "disabled"
    directory: "/android"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "mobile"
    groups:
      android-gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
