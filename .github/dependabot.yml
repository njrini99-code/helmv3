# Dependabot — grouped, scheduled dependency-update PRs.
#
# Note: SECURITY updates are raised separately and immediately by Dependabot
# regardless of the schedule/groups below. The groups here exist to batch the
# routine version bumps so they arrive as a few reviewable PRs instead of dozens.
#
# Every ecosystem sets a 7-day `cooldown` so freshly published versions (a
# common supply-chain attack window) are not proposed until they have been
# public for a week. Security updates ignore the cooldown and still arrive
# immediately.
#
# Not covered here (extend if/when needed):
#   - iOS native deps (CocoaPods/Podfile under the Capacitor app)
version: 2
updates:
  # ── npm (repo root) ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
    groups:
      # ALL dev-dependency bumps (majors included) → one PR.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
          - "major"
      # ALL production bumps (majors included) → one PR. 2026-07-03 a Monday
      # run opened ~13 individual major PRs, each triggering a billed Vercel
      # preview build; one reviewable PR per dependency-type instead.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # ── Nested npm projects (kept out of the root manifest) ───────────────────
  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/helm-website-ui"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      helm-website-ui:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/helm-intelligence/typescript"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      helm-intelligence:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/tools/ultra-agent-audit"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      ultra-agent-audit:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  - package-ecosystem: "npm"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/tools/ux-flow-auditor"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      ux-flow-auditor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # ── iOS native (Swift Package Manager under the Capacitor app) ────────────
  - package-ecosystem: "swift"
    # Stop auto-rebase pushes: old branches carry pre-gating vercel.json,
    # so every rebase push triggered a billed (and failing) preview build.
    rebase-strategy: "disabled"
    directory: "/ios/App/CapApp-SPM"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "mobile"
