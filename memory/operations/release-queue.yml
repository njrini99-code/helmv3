  - id: cron-failure-invisible-to-bridge-2026-08-27
    feature_id: admin_platform
    root_cause: >-
      Promise.allSettled rejection reasons were discarded in event-reminders, so
      a failing send incremented a counter, the route returned 200, recordJobRun
      wrote 'completed', and admin_events never learned of it. Sentry alone saw
      47 escalating occurrences.
    incident_id: memory/incidents/admin_platform/INC-2026-08-27-swallowed-cron-failure-invisible-to-bridge.md
    status: repairing
    risk: R2
    sha: null
    pr: null
    regression_tests:
