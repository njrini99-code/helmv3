  - id: coachhelm-safety-net-anon-client-2026-08-27
    feature_id: coachhelm_ai
    root_cause: >-
      The coachhelm-safety-net path reached from event-reminders reads
      baseball_players and baseball_coaches_public with an anon-scoped client.
      service_role already holds SELECT on both; the shared property of the two
      failing objects is that neither grants anon. NOT to be fixed by granting
      anon — baseball_coaches_public is one of the four ERROR-level
      security_definer_view advisories, so that would expose coach data to
      unauthenticated callers.
    incident_id: memory/incidents/admin_platform/INC-2026-08-27-swallowed-cron-failure-invisible-to-bridge.md
