#   status:              observed | triaging | reproduced | repairing |
#                        verification_failed | verified | queued_for_release |
#                        released | verified_in_production | blocked |
#                        wont_fix | expected | duplicate
#   risk:                R0 | R1 | R2 | R3 (memory/system/golfhelm-engineering-os.md "Risk tiers")
#   sha:                 commit SHA carrying the fix, once merged
#   pr:                  PR URL or number
#   regression_tests:    list of test file paths added/updated to cover this
#   queued_for_release:  boolean — true once prepared for the next release window
#   first_seen:          ISO 8601 timestamp of the first observed occurrence

