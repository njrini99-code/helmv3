        - src/app/api/cron/process-sequences/**
        - src/app/api/cron/ingest-gmail-replies/**
        - src/app/api/cron/refresh-engagement/**
      components:
        - src/app/golf/admin/crm/components/**
      api: null
      actions:
        - src/app/golf/actions/crm-*.ts
        # Both of these break the crm- convention. A sweep keyed on the prefix
        # misses them, which is why they are listed individually.
        - src/app/golf/actions/resend-activity.ts
        - src/app/golf/admin/crm/components/resend/actions.ts
      services:
        - src/lib/crm/**
      db:
        - supabase/migrations/*crm*.sql
      tests: null
    integrations:
      - supabase
      - resend
      - gmail
      - google_calendar
    review:
      required_docs:
        - memory/features/crm_outreach.md
      required_checks:
        - npm run typecheck

