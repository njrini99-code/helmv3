        - docs/v3-design-language.md
      business_logic:
        - memory/context/coachhelm-ai.md
        - docs/v3-decisions.md
        - docs/v3-testing-standards.md
      incidents:
        - docs/operations/2026-05-17-p0-runbook.md
    code:
      routes:
        - src/app/golf/(dashboard)/dashboard/coachhelm/**
        - src/app/golf/(dashboard)/dashboard/analytics/coachhelm/**
      components:
        - src/components/golf/coachhelm/**
      api:
        - src/app/api/coachhelm/**
        - src/app/api/cron/coachhelm-calibration/**
        - src/app/api/cron/coachhelm-insight-lifecycle/**
        - src/app/api/cron/coachhelm-roster-sweep/**
        - src/app/api/cron/coachhelm-safety-net/**
        - src/app/api/cron/coachhelm-validation/**
        - src/app/api/cron/v3/**
      actions:
        - src/app/golf/actions/coachhelm-*.ts
        - src/app/golf/actions/insight-*.ts
        - src/app/golf/actions/player-effectiveness.ts
        - src/app/golf/actions/player-fingerprint.ts
        - src/app/golf/actions/player-fingerprint-types.ts
        # `insight-*.ts` never matched `insights.ts` (no hyphen), so the
        # largest insight action file in the tree — it owns the post-round
        # generation trigger and its coach push — resolved to NO feature and
        # every edit to it hit the guard as an unmapped governed path.
        - src/app/golf/actions/insights.ts
        - src/app/golf/actions/intelligence-dashboard.ts
        - src/app/golf/actions/player-feedback.ts
        - src/app/golf/actions/v3/**
      services:
        - src/lib/coachhelm/**
      db:
        - supabase/migrations/*coachhelm*.sql
        - supabase/migrations/*insight*.sql
        - supabase/migrations/*golf_coachhelm*.sql
      tests:
        - src/test/coachhelm/**
        - src/test/api/cron/coachhelm*.test.ts
        - src/app/golf/actions/player-fingerprint.chart.test.ts
    integrations:
      - supabase
      - sentry
      - datadog
      - llm_provider
    review:
      required_docs:
        - memory/features/coachhelm-ai.md
        - memory/context/coachhelm-ai.md
        - docs/v3-testing-standards.md
      required_checks:
        - npm run typecheck
        - npm run test -- --run src/test/coachhelm
        - npm run build

