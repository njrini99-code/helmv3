  admin_platform:
    name: Admin Platform
    status: active
    owner: platform
    criticality: high
    observability:
      feature_keys: [admin_dashboard]
    docs:
      feature: memory/features/admin-platform.md
      flows:
        - docs/ADMIN_DASHBOARD_UPGRADE_PLAN.md
        - docs/BI_DASHBOARD_ARCHITECTURE.md
        # Literal paths, not a glob: document-inventory.mjs's `routed` check is
        # an exact-string Set membership test against each real file, so a
        # glob string here is never `.has()`-equal to an expanded path and
        # silently reports these docs as unrouted. Listing the two files this
        # change actually touches keeps that check honest.
        - docs/ai-system/selfheal/README.md
        - docs/ai-system/selfheal/repair-contract.md
      ui:
        - memory/projects/golfhelm.md
        - docs/v3-design-language.md
      business_logic:
        - docs/SECURITY_AUDIT.md
        - docs/OBSERVABILITY.md
        - docs/v3-testing-standards.md
      incidents:
        - docs/operations/2026-05-17-p0-runbook.md
    code:
      routes:
        - src/app/admin/**
        - src/app/golf/admin/**
      components:
        - src/app/admin/_components/**
        - src/app/golf/admin/crm/components/**
      api:
        - src/app/api/admin/**
        # Scoped to these two crons rather than src/app/api/cron/** on purpose:
        # the coachhelm-* crons in that directory belong to coachhelm_ai, and a
        # blanket glob would silently hand their ownership to admin_platform.
        - src/app/api/cron/reliability-triage/**
        - src/app/api/cron/selfheal-triage/**
        # The three zero-cost Supabase observability collectors (Phase 1,
        # 2026-09-03) behind /admin/database, same reasoning as the two
        # crons above: src/app/api/cron/** is not a blanket glob here.
        - src/app/api/cron/db-health-sampler/**
        - src/app/api/cron/db-stat-delta/**
        - src/app/api/cron/db-observability-prune/**
      actions:
        - src/app/golf/actions/admin*.ts
        - src/app/golf/actions/admin/**
        - src/app/golf/actions/crm-*.ts
        - src/app/golf/actions/resend-activity.ts
      services:
        - src/lib/supabase/admin*
        - src/lib/cron/**
        # The Bridge's own data and helper layer mapped to NO feature before
        # 2026-08-26: `knowledge:map` resolved a page under src/app/admin/** to
        # admin_platform while resolving the data module that page reads to
        # nothing. The OS contract calls that a system gap to close in the same
        # change rather than merely record.
        - src/lib/admin/**
        - src/lib/reliability/**
        # General Supabase/Postgres observability (Phase 1, 2026-09-03):
        # envelope, classifier, out-of-band DB error writer, health/stat
        # delta collectors. This is a NARROWER, more specific glob than
        # src/lib/observability/** below (owned by shot_tracking for the
        # round-tracking flight recorder) — deliberately, since this
        # subtree is admin/Bridge-facing infrastructure, not round-tracking
        # specific, even though it shares the parent directory.
        - src/lib/observability/supabase/**
        # The self-heal loop's REPAIR-stage runner and its launchd config —
        # mapped here 2026-09-02 after `knowledge:map` resolved these paths to
        # `impactedFeatures: []`. The Bridge (self-heal loop) lives under
        # admin_platform alongside src/lib/admin/** and src/lib/reliability/**
        # above; the runner and its config are the same feature's Repair
        # stage, not a separate one.
        - scripts/run-selfheal-repair.mjs
        - scripts/lib/selfheal-repair-runner.mjs
        - scripts/selfheal-repair-install.sh
        - scripts/selfheal-repair-doctor.mjs
        - config/launchd/**
        # Phase K.4.5 (Engineering OS Intelligence) Janitor generator —
        # mapped here 2026-09-03 after `knowledge:map` resolved
        # scripts/janitor/** to `impactedFeatures: []`. Same precedent as
        # the self-heal REPAIR-stage runner above: this is Bridge/Phase-K
        # engineering-tooling with no better home, not a separate feature.
        # scripts/mutation-gate.mjs and .circleci/config.yml (also Phase K,
        # the mutation-score gate fix) are deliberately NOT added here —
        # they gate src/lib/coachhelm/v2/ test quality, not the Bridge/admin
        # surface, and `knowledge:map` confirms they match no feature at all
        # today; forcing them under admin_platform would be a wrong mapping,
        # not a closed gap.
        - scripts/janitor/**
      db:
        - supabase/migrations/*admin*.sql
        - supabase/migrations/*crm*.sql
        - supabase/migrations/*audit*.sql
      tests:
        - src/test/lib/cron/auth.test.ts
        - src/test/api/cron/shared-auth.test.ts
    integrations:
      - supabase
      - datadog
      - sentry
      - resend
      - crm
    review:
      required_docs:
        - memory/features/admin-platform.md
        - docs/OBSERVABILITY.md
        - docs/SECURITY_AUDIT.md
      required_checks:
        - npm run typecheck
        - npm run test -- --run src/test/lib/cron/auth.test.ts src/test/api/cron/shared-auth.test.ts
        - npm run build

