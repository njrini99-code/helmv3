  crm_outreach:
    name: CRM Outreach (NCAA cold email)
    status: active
    owner: founder
    criticality: medium
    # KNOWLEDGE routing only. src/lib/admin/feature-registry.ts carries an owner
    # directive that CRM is never wrapped, tagged, or shown on the Bridge health
    # board, and its runtime row keeps excluded: 'crm' with an empty actions map.
    # Nothing here changes that: verified 2026-08-30 that memory/registry.yml is
    # read only by scripts/knowledge/**, scripts/repo-doctor and the drift gates,
    # and that src/lib/reliability/collect.ts resolves feature ids from a
    # hardcoded route table because it "cannot read a build-time artifact".
    # This entry exists because AGENTS.md requires a live surface to be mapped
    # or named, and it was named as a gap until the doc below was written from
    # the code.
    observability:
      feature_keys:
        - crm_recruiting_pipeline
    docs:
      feature: memory/features/crm_outreach.md
    code:
      routes:
        - src/app/golf/admin/crm/**
