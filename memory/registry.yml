version: 1

features:
  feature_awareness_system:
    name: Feature Awareness System
    status: active
    owner: platform
    criticality: high
    observability:
      feature_keys: []
      reason: >-
        Agent tooling, not a product surface. Nothing here writes
        admin_events.feature, and no FeatureKey should exist for it.
    docs:
      feature: docs/ai-system/helmv3-ai-codebase-intelligence.md
      flows:
        - docs/ai-system/helmv3-ai-codebase-intelligence.md
      ui:
        - AGENTS.md
        - CLAUDE.md
      business_logic:
        - memory/registry.yml
      incidents: []
    code:
      routes: []
      components: []
      api: []
      actions: []
      services:
        - scripts/knowledge/**
        - scripts/contracts/**
        - memory/journeys/**
        - .devin/wiki.json
        - .github/workflows/feature-awareness.yml
        - package.json
        - AGENTS.md
        - CLAUDE.md
      db: []
      tests: []
    integrations:
      - github_actions
      - codex
    review:
      required_docs:
        - docs/ai-system/helmv3-ai-codebase-intelligence.md
        - memory/registry.yml
        - AGENTS.md
        - CLAUDE.md
      required_checks:
        - npm run knowledge:check
        - node --check scripts/knowledge/workflow-report.mjs

  observability_sentry:
    name: Sentry Observability — Telemetry Vocabulary
    status: active
    owner: platform
    criticality: medium
    observability:
      feature_keys: []
      reason: >-
        This module IS the observability layer (metric/span/log vocabulary
        and the beforeSend*/scrubPii hooks) — instrumenting itself would be
        circular. No admin_events.feature key exists for it by design; see
        classification: observability_only in observability_keys_unowned
        below for the same reasoning applied to a runtime key.
    docs:
      feature: memory/features/observability-sentry.md
      flows:
        - docs/observability/SENTRY_TELEMETRY_TAXONOMY.md
        - docs/observability/SENTRY_SUPABASE_TRACING.md
      ui: []
      business_logic:
        - docs/observability/SENTRY_TELEMETRY_TAXONOMY.md
      incidents: []
    code:
      routes: []
      components: []
      api: []
      actions: []
      services:
        - src/instrumentation*.ts
        - src/lib/observability/**
      db: []
      tests:
        - src/lib/observability/__tests__/**
        - src/test/observability/**
    integrations:
      - sentry
    review:
      required_docs:
        - memory/features/observability-sentry.md
        - docs/observability/SENTRY_TELEMETRY_TAXONOMY.md
      required_checks:
        - npm run typecheck
        - npx vitest run src/lib/observability src/instrumentation.ts src/instrumentation-client.ts src/test/observability

