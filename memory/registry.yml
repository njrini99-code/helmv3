        - src/components/golf/roster/**
        - src/components/fairway/pages/team/**
        - src/components/fairway/pages/team-hub/**
      api:
        - src/app/api/admin/**
        - src/app/api/golf/auth/**
      actions:
        - src/app/golf/actions/auth.ts
        - src/app/golf/actions/roster.ts
        - src/app/golf/actions/teams.ts
        - src/app/golf/actions/onboarding.ts
        - src/app/golf/actions/admin*.ts
      services:
        - src/lib/supabase/**
        - src/lib/auth/**
      db:
        - supabase/migrations/*.sql
        - supabase/tests/rls/*.sql
      tests:
        - src/test/lib/auth/**
        - src/test/lib/cron/auth.test.ts
        - supabase/tests/rls/*.sql
    integrations:
      - supabase
      - github_actions
    review:
      required_docs:
        - memory/features/team-access-control.md
        - memory/glossary.md
        - memory/context/golfhelm-database.md
        - docs/v3-rls-template.md
      required_checks:
        - npm run typecheck
        - npm run test:rls
        - supabase db lint --schema public

  ios_native_shell:
    name: iOS Native Shell
    status: active
    owner: product
    criticality: high
    observability:
      feature_keys: []
      reason: >-
        The Capacitor shell wraps the web app. Telemetry attributes to
        whichever feature the user is in, so a shell-specific key would
        double-count rather than measure anything new.
    docs:
      feature: memory/features/ios-native-shell.md
      flows:
        - docs/audits/IOS_PREMIUM_NATIVE_AUDIT_2026-08-25.md
        - ios/appstore/RELEASE_CANDIDATE_2.0-9.md
      business_logic:
        - docs/plans/IOS_PREMIUM_NATIVE_UPDATE_2026-08-25.md
    code:
      routes:
        - src/app/golf/(dashboard)/dashboard/dev/**
      components:
        - src/components/golf/PushPermissionSoftAsk.tsx
        - src/components/providers/CapacitorProvider.tsx
      services:
        - src/lib/native/**
        - src/lib/utils/capacitor.ts
        - src/lib/utils/push-registration.ts
        - src/lib/utils/haptics-pref.ts
        - src/lib/fairway/haptics.ts
      native:
        - ios/App/App/**
        - ios/App/CapApp-SPM/**
        - capacitor.config.ts
      tests:
        - src/test/lib/native-capabilities.test.ts
        - src/test/lib/haptics-pref.test.ts
        - src/test/lib/push-registration-pending-token.test.ts
    integrations:
      - vercel
      - supabase
    review:
      required_docs:
        - memory/features/ios-native-shell.md
      required_checks:
        - npm run typecheck
        - npm run test -- --run src/test/lib/native-capabilities.test.ts src/test/lib/haptics-pref.test.ts

systems:
  supabase:
    docs: docs/setup/SUPABASE_MCP_SETUP.md
    code:
      - src/lib/supabase/**
      - supabase/**
    criticality: high
  review_gate:
    docs: .github/branch-protection.md
    code:
      - .github/workflows/review-gate.yml
    criticality: high

integrations:
  github_actions:
    docs: .github/branch-protection.md
    code:
      - .github/workflows/**
    criticality: high
  vercel:
    docs: docs/setup/ENVIRONMENT_VARIABLES.md
    code:
      - vercel.json
      - src/app/api/**
    criticality: medium
  sentry:
    docs: docs/guides/SENTRY_SETUP_GUIDE.md
    code:
      - sentry.*
      - src/instrumentation*.ts
      # Client "maximum observability" build (2026-09-02/03): the pure
      # options builder instrumentation-client.ts's Sentry.init() reads
      # (profiling/replay sample rates, ignoreErrors), the in-app feedback
      # button, and the shared breadcrumb helper. `npm run knowledge:map`
      # walks the `features:` map only, not this `integrations:` section —
      # these three files legitimately impacted ZERO product features (they
      # are platform observability infra, same reasoning as
      # `feature_awareness_system` above), which is why they are listed
      # HERE rather than added to an unrelated feature's `code.services`.
      - src/lib/sentry-client-options.ts
      - src/components/fairway/feedback/ReportProblemButton.tsx
      - src/lib/observability/client-breadcrumbs.ts
    criticality: medium
  datadog:
    docs: docs/OBSERVABILITY.md
    code:
      - datadog/**
      - src/instrumentation*.ts
    criticality: medium

# ---------------------------------------------------------------------------
# Runtime FeatureKeys with no semantic owner.
#
# A key that nobody owns has to be SAID to be unowned. Leaving it off every list
# is indistinguishable from an oversight, which is the failure this whole
# reconciliation removes. npm run knowledge:registry-check fails on a runtime
# key that appears neither here nor in a feature's observability block.
#
# classification: observability_only | platform | excluded | feature_awareness_gap
observability_keys_unowned:
  integrations:
    classification: platform
    reason: >-
      Inngest job execution. Infrastructure that carries other features' work,
      not a product feature with behaviour of its own to document.
