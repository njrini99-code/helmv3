  labeling:
    auto_apply_labels: false
    labeling_instructions:
      - label: "feature"
        instructions: "New product behavior, new workflow, new dashboard section, new import pipeline, or new user-facing capability."
      - label: "enhancement"
        instructions: "Improves an existing flow, component, dashboard, query, test, or UX without introducing a brand-new feature."
      - label: "bug"
        instructions: "Fixes incorrect behavior, failed auth, incorrect stats, broken UI, failed import, broken test, or production regression."
      - label: "high-risk"
        instructions: "Touches auth, RLS, migrations, service-role usage, subscriptions, data imports, stat calculations, production data, or core dashboards."
      - label: "security"
        instructions: "Touches auth, secrets, service-role keys, signed URLs, RLS policies, logging, PII, or external callbacks/webhooks."
      - label: "auth"
        instructions: "Login, user session, role-based access, coach/player/team authorization, middleware, or Supabase auth."
      - label: "rls"
        instructions: "Supabase Row Level Security policies, tests, helper functions, team/player/coach row access, or role escalation."
      - label: "database"
        instructions: "Supabase migrations, schema, SQL functions, indexes, constraints, triggers, enums, generated DB types, or seed data."
      - label: "stats"
        instructions: "Golf/baseball stat calculation, rollups, cache tables, analytics, leaderboard logic, or report generation."
      - label: "import"
        instructions: "CSV import, stat import, parser, mapping, dedupe, validation, file upload, or import review workflows."
      - label: "coachhelm"
        instructions: "CoachHelm AI, patterns, predictions, insights, LLM usage, budget controls, coaching philosophy, or generated recommendations."
      - label: "golf"
        instructions: "GolfHelm-specific routes, tables, dashboards, rounds, qualifiers, team management, player hub, or CoachHelm golf intelligence."
      - label: "baseball"
        instructions: "BaseballHelm-specific routes, recruiting pipeline, coach/player profiles, schools, watchlists, evaluations, or baseball stat flows."
      - label: "dashboard"
        instructions: "Coach dashboard, player dashboard, admin dashboard, UI cards, tables, filters, charts, navigation, empty/loading/error states."
      - label: "mobile"
        instructions: "Capacitor, iOS, mobile shell, push notifications, safe areas, app navigation, native permissions, or mobile-specific UI."
      - label: "ci"
        instructions: "GitHub Actions, Vercel build, lint/typecheck/test scripts, Playwright, Lighthouse, or deployment automation."
      - label: "docs"
        instructions: "Documentation-only change, product plan, runbook, architecture note, security/privacy doc, or implementation guide."
      - label: "no-plan"
        instructions: "Tiny chore or doc change where CodeRabbit Plan would be overkill."
      - label: "wip"
        instructions: "Work in progress; do not auto-plan yet."
