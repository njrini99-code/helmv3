# CodeRabbit configuration — Helm Sports Labs (helmv3)
# Max-strictness review profile covering:
#   Next.js 16 (App Router) + TypeScript strict
#   Supabase (Postgres migrations, RLS, Deno edge functions)
#   Capacitor iOS (Swift/Obj-C in ios/App)
#   Python helpers in tools/
#   Vercel deployment, Datadog instrumentation, pgTAP tests
# Docs: https://docs.coderabbit.ai/reference/yaml-template
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# ---------------------------------------------------------------------------
# Core language + tone
# ---------------------------------------------------------------------------
language: en-US

# Be direct, technical, and exhaustive. No filler, no compliments.
tone_instructions: "Be direct and technical. Cite file:line for every finding. Treat security, RLS, type-safety, and accessibility issues as blocking. Prefer concrete code suggestions over prose."

early_access: true

# ---------------------------------------------------------------------------
# Reviews — assertive profile, auto-review on every PR
# ---------------------------------------------------------------------------
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: >
    Conventional Commits style. Format as `<type>(<scope>): <subject>`
    using golf, baseball, coachhelm, supabase, ios, ci, design-system, types,
    deps, docs, or ops as scopes. Imperative mood, no trailing period, <= 72
    chars. Keep this scope list in sync with
    reviews.pre_merge_checks.title.requirements.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  labeling_instructions:
    - label: "security"
      instructions: "Apply when the PR touches auth, RLS, env vars, secrets, signed URLs, or any supabase/migrations/*_rls* file."
    - label: "database"
      instructions: "Apply when the PR adds, alters, or drops SQL objects in supabase/migrations/ or supabase/functions/ that touch tables, enums, or RLS."
    - label: "performance"
      instructions: "Apply when the PR adds queries without indexes, removes useMemo/useCallback boundaries, or adds work to render paths."
    - label: "ios"
      instructions: "Apply when ios/App/, capacitor.config.ts, or push/APNs code changes."
    - label: "ci"
      instructions: "Apply when .github/workflows/, vercel.json, vercel.ts, or scripts/ change."
    - label: "design-system"
      instructions: "Apply when src/components/ui or design tokens change."
  path_filters:
    # Exclude generated, vendored, and binary artifacts from review
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/playwright-report/**"
    - "!**/test-results/**"
    - "!**/.tmp-screenshots/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.ico"
    - "!**/*.svg"
    - "!**/*.pdf"
    - "!**/*.mp4"
    - "!**/*.mov"
    - "!**/*.zip"
    - "!ios/App/Pods/**"
    - "!ios/DerivedData/**"
    - "!supabase/migrations_archive/**"
    - "!archive/**"
    - "!.full-review*/**"
    - "!.full-stack-feature*/**"
    - "!.worktrees/**"
    - "!src/lib/types/database.ts"  # auto-generated by supabase gen types
  path_instructions:
    - path: "src/app/**/*.{ts,tsx}"
      instructions: >
        Next.js 16 App Router. Default to Server Components — flag `'use client'`
        on any file that does not actually use hooks, browser APIs, or event
        handlers. Server components must `await createClient()` from
        `@/lib/supabase/server`. All mutations must run inside a `'use server'`
        action file, call `revalidatePath()` after writes, and verify
        `supabase.auth.getUser()` before any DB access. Never import from
        `@/types/database` or `@/types/supabase` — types live in `@/lib/types`.
        Flag any direct use of `cookies()`/`headers()` outside the canonical
        helpers. Confirm `cache: 'no-store'` or explicit `cacheLife`/`cacheTag`
        where freshness matters; see docs/v3-decisions.md.
    - path: "src/app/**/actions/**/*.ts"
      instructions: >
        Server action files. Every exported function MUST start with auth check
        (`const { data: { user } } = await supabase.auth.getUser(); if (!user) throw …`).
        Validate every input with zod before passing to Supabase. Never trust
        client-supplied user/team/coach IDs — derive from the authenticated
        session. Mutations must `revalidatePath()` the affected routes. Throw on
        error, never silently return `{ success: false }` without a typed reason.
        Flag any `service_role` key usage outside admin-only paths.
    - path: "src/app/golf/**"
      instructions: >
        GolfHelm scope. All tables use the `golf_` prefix (golf_coaches, golf_players,
        golf_teams, golf_rounds, golf_events — never bare names). Coach↔team is
        modeled via golf_team_coach_staff, NOT golf_coaches.team_id. Strokes-gained
        is cached in golf_player_stats_cache. Cross-check feature ownership
        (coach vs player vs team) against CLAUDE.md before suggesting moves.
    - path: "src/app/baseball/**"
      instructions: >
        BaseballHelm scope. Pipeline stages are STRICTLY one of: watchlist,
        high_priority, offer_extended, committed, uninterested. Reject any other
        value. Recruiting is opt-in for players; college players can never
        activate recruiting. Coach types (College, HS, JUCO, Showcase) and player
        types (HS, Showcase, JUCO, College) have asymmetric feature access — see
        CLAUDE.md "Baseball Product: User Types & Roles".
    - path: "src/components/**/*.{ts,tsx}"
      instructions: >
        React + Tailwind. Use design-system tokens only (Kelly green #16A34A,
        cream #FFFEFA, glass `bg-white/70 backdrop-blur-xl`). Reject inline hex
        values, ad-hoc spacing, or radius outside `rounded-2xl`/`rounded-xl`/
        `rounded-lg`. Components handling user input must have visible focus
        rings, aria-labels, and keyboard handlers (Enter/Space for clickable
        non-button elements). Skeleton loaders, not spinners. Empty states must
        be compact: icon + short title + 1-sentence + 1 CTA. Apply
        AGENTS.md mobile rules to anything rendered under `src/app/*/mobile`
        or behind Capacitor.
    - path: "src/components/**/coachhelm/**"
      instructions: >
        CoachHelm V2 UI. Never call the LLM client-side. Surface LLM cost
        ceilings via `golf_coachhelm_settings.llm_budget_usd_per_day` — flag
        any hardcoded $/token math. Loading states must be skeletons that match
        final layout.
    - path: "src/lib/supabase/**"
      instructions: >
        Supabase client wiring. Server: `await createClient()` returns a
        cookie-bound client. Client: `createClient()` runs only in
        `'use client'` files. Never expose `SUPABASE_SERVICE_ROLE_KEY` to a
        browser bundle — flag any `process.env.SUPABASE_SERVICE_ROLE_KEY`
        access in files not under `src/lib/supabase/admin*` or
        `src/app/api/*/admin/*`.
    - path: "src/lib/coachhelm/**"
      instructions: >
        CoachHelm AI engine. The V2 orchestrator, mining, prediction, learning,
        and NLG modules must remain pure (no fetches, no Supabase calls inside
        scoring functions). Surface budget/usage via the per-team settings
        table, not env vars. Prefer typed enums for shot categories and lie
        taxonomy (see docs/v3-research-golf-domain.md).
    - path: "src/lib/types/**"
      instructions: >
        Source of truth for entity types. `database.ts` is auto-generated by
        `npm run db:types`; reject manual edits. All re-exports happen via
        `src/lib/types/index.ts` — flag deep imports.
    - path: "src/hooks/**/*.ts"
      instructions: >
        Custom React hooks. Verify `react-hooks/exhaustive-deps` compliance.
        Realtime hooks must clean up channels on unmount. Flag any hook that
        mutates external state without `useEffect` cleanup.
    - path: "src/stores/**/*.ts"
      instructions: >
        Zustand stores. Persist only what is safe across reload; never persist
        auth tokens (Supabase manages those). Prefer slice composition over
        monolithic stores.
    - path: "src/instrumentation*.ts"
      instructions: >
        Datadog + OpenTelemetry instrumentation. Never log PII (email, phone,
        full name) or Supabase JWTs. Sanitize span attributes before sending.
    - path: "supabase/migrations/*.sql"
      instructions: >
        Postgres migrations. RULES:
        (1) Every new table must have RLS enabled in the same migration and a
            matching policy (SELECT/INSERT/UPDATE/DELETE) — see docs/v3-rls-template.md.
        (2) Use `CREATE TABLE IF NOT EXISTS`, `ALTER TABLE … ADD COLUMN IF NOT EXISTS`,
            `DROP … IF EXISTS` for idempotency.
        (3) Wrap risky renames/drops in `DO $$ … END $$` blocks (project pattern
            after migration 036 — see memory note "GolfHelm CI state 2026-05-21").
        (4) Never use `DROP TABLE` without an `IF EXISTS` and a migration ID
            in the comment.
        (5) Reject `auth.users` direct writes; go through `public.users` mirror.
        (6) Forbid bulk DELETE-then-INSERT in functions/triggers — use
            UPSERT/`ON CONFLICT` (see memory note "GolfHelm — no destructive writes").
        (7) Add indexes on FK columns and on every column used in RLS predicates.
        (8) Forbid `SECURITY DEFINER` functions without an explicit
            `SET search_path = ''` and an inline comment justifying the elevation.
    - path: "supabase/migrations_archive/**"
      instructions: "Archived. Skip review — already applied."
    - path: "supabase/functions/**/*.ts"
      instructions: >
        Supabase Edge Functions (Deno). Use `Deno.env.get(...)` (never
        `process.env`). Validate inputs with zod before any DB call. Wrap
        external fetches in try/catch with structured logging. Never echo
        request bodies back in errors. Verify the function's deno.json/import
        map matches supabase/config.toml's edge_runtime allowlist.
    - path: "supabase/tests/**/*.sql"
      instructions: >
        pgTAP RLS suites. Every new table touched in a migration needs a
        matching test that asserts: (a) anon cannot read, (b) authenticated
        user can read only their team's rows, (c) coach role escalation
        works only for assigned teams via golf_team_coach_staff. Use the
        helpers in supabase/tests/rls/_helpers.sql.
    - path: "supabase/config.toml"
      instructions: >
        Be conservative. Flag any change to [auth], [db.pooler], or
        [edge_runtime] without an accompanying docs/operations/ runbook update.
    - path: "tools/**/*.py"
      instructions: >
        Python helpers (CoachHelm research, overnight builds). Require type
        hints on public functions, prefer pathlib over os.path, use logging
        not print(). Never hardcode Supabase credentials — read from .env via
        python-dotenv. Format with ruff (line length 100). Async I/O uses
        httpx, not requests.
    - path: "scripts/**/*.{ts,mjs,js,sh}"
      instructions: >
        One-off ops scripts. Must be idempotent (re-running is safe). Log
        intent before mutation. Bash scripts: `set -euo pipefail` at top,
        quote all expansions, and avoid `eval`. Node scripts must read env
        from .env.local first, then process.env.
    - path: "ios/App/**/*.{swift,m,mm,h}"
      instructions: >
        Capacitor iOS native layer. Follow Apple HIG. Push notifications must
        request authorization explicitly and handle the
        `UNAuthorizationStatus.denied` path. Never store tokens in
        UserDefaults — use Keychain via the Capacitor Preferences plugin only
        for non-secrets. Background modes must match capacitor.config.ts.
    - path: "capacitor.config.ts"
      instructions: >
        iOS/Android shell config. Any new plugin requires a matching entry in
        ios/App/App/Info.plist (usage descriptions for camera/photo/notifications/
        location). Reject scheme changes without a coordinated TestFlight rollout
        note in docs/operations/.
    - path: ".github/workflows/**/*.yml"
      instructions: >
        GitHub Actions. Pin every action to a full commit SHA (not @v4) for
        third-party actions. Set `permissions:` block at workflow root, default
        to `contents: read`. Never echo secrets. Use `GITHUB_TOKEN` over PATs
        unless cross-repo is required.
    - path: "vercel.{ts,json}"
      instructions: >
        Vercel project config. Prefer vercel.ts over vercel.json (the project
        is on Vercel; see Vercel knowledge update). Validate framework=nextjs,
        confirm cron paths exist as routes, and check function regions match
        Supabase project region (low-latency requirement).
    - path: ".env*"
      instructions: >
        Block any commit that adds real secrets. Allow only `.env.example` /
        documented placeholders. Reference docs/operations/2026-05-17-p0-runbook.md
        when rotation context appears.
    - path: "docs/**/*.md"
      instructions: >
        Docs. Light touch: only flag broken internal links, stale code samples
        that no longer compile against the current schema, and contradictions
        with CLAUDE.md or memory/glossary.md. Do not nitpick prose.
    - path: "docs/v3-*.md"
      instructions: >
        v3 master spec set (plan, wave-sequence, decisions, page-audit, etc.).
        Treat changes as architectural — flag any wave addition/removal,
        dependency change, or RLS-template change. Cross-reference
        memory/projects/golfhelm.md.
    - path: "supabase/seed/**/*.sql"
      instructions: >
        Seed data. Must be safe to run on a clean DB and idempotent under
        re-seed. Never seed real user data — use clearly-fake names/emails
        (@example.com). Wrap each seed in a transaction.
    - path: "**/*.test.{ts,tsx}"
      instructions: >
        Vitest unit + component tests. Use the framer-motion mock with
        `useReducedMotion` included (project gotcha — see memory note
        "GolfHelm CI state 2026-05-21"). Mock Supabase via the test client
        in src/test/. Prefer @testing-library queries (`getByRole`) over
        `getByTestId`. Assert on user-visible state, not implementation.
    - path: "e2e/**/*.{ts,spec.ts}"
      instructions: >
        Playwright E2E. Use `data-testid` only when no accessible role exists.
        Tests must seed via supabase/seed/, not by clicking through onboarding.
        Tag flaky tests with `test.fixme` plus a linked issue — never silently
        retry.
    - path: "src/styles/**/*.{css,scss}"
      instructions: >
        Global styles. Tailwind layer only — no raw selectors that shadow
        component-scoped styles. Verify any new CSS variable is registered in
        the design-system tokens file.

  finishing_touches:
    custom:
      - enabled: true
        name: "helm safety pass"
        instructions: >
          Review the changed files for Helm-specific safety issues:
          service-role leakage, missing auth checks, RLS gaps, destructive
          writes, sport table prefix mistakes, client-side LLM calls, PII
          logging, missing loading/error/empty states, and missing tests.
          Open a stacked PR with minimal targeted fixes only.
      - enabled: true
        name: "dashboard ux pass"
        instructions: >
          Review changed dashboard UI for mobile responsiveness, skeleton
          loading states, empty states, error states, accessibility, keyboard
          navigation, visual consistency with Helm's premium design system, and
          overly dense layouts. Open a stacked PR with minimal fixes only.
      - enabled: true
        name: "rls test pass"
        instructions: >
          For database/RLS-sensitive changes, inspect migrations, server
          actions, and tests. Add or improve tests that prove anon users cannot
          read data, authenticated users can only read their team's rows, and
          coach/player role escalation is impossible without assignment. Open a
          stacked PR with tests only.
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # Auto-review on every push to every PR
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "[skip-review]"
    drafts: true
    base_branches: ["main", "develop", "release/*"]
    labels: []

  # Pre-merge gate: enforce findings + checks before allowing merge
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: >
        Follow Conventional Commits. Required scopes: golf, baseball, coachhelm,
        supabase, ios, ci, design-system, types, deps, docs, ops.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "No service-role in client bundles"
        mode: error
        instructions: >
          Evaluate only files changed by this PR. Fail if changed code outside
          src/lib/supabase/admin* or src/app/api/**/admin/** references
          SUPABASE_SERVICE_ROLE_KEY or creates a Supabase client with the
          service role key. Do not fail this check for pre-existing violations
          in untouched files; surface those as non-blocking findings instead.
      - name: "RLS coverage on new tables"
        mode: error
        instructions: >
          Evaluate only migrations changed by this PR. Fail if a changed
          migration adds a CREATE TABLE without ENABLE ROW LEVEL SECURITY and
          at least one CREATE POLICY in the same migration.
      - name: "Auth check in server actions"
        mode: error
        instructions: >
          Evaluate only files changed by this PR. Fail if a changed file under
          src/app/**/actions/**/*.ts exports an async function that does not
          call supabase.auth.getUser() before any .from()/rpc() call. Do not
          fail this check for pre-existing violations in untouched files;
          surface those as non-blocking findings instead.
      - name: "Sport-prefixed table names"
        mode: error
        instructions: >
          Evaluate only changed *.ts/*.tsx files. Fail if changed code queries
          Supabase tables without the sport prefix (coaches, players, teams,
          rounds, events without golf_/baseball_ prefix).
      - name: "No destructive writes"
        mode: error
        instructions: >
          Evaluate only files changed by this PR. Fail if changed save/submit/
          sync code performs DELETE followed by INSERT on the same table without
          an explicit transaction comment justifying the rebuild.
      - name: "No edits to historical migrations"
        mode: error
        instructions: >
          Fail if the PR modifies any file under supabase/migrations/ whose
          timestamp prefix is less than or equal to 20260527120000 (the
          schema alignment baseline). The correct fix for replay failures is
          a NEW forward-only migration, not editing history. See
          docs/HELM_DATABASE_VERCEL_COACHHELM_DEEP_DIVE_2026-05-27.md and
          docs/superpowers/plans/2026-05-27-helm-database-vercel-alignment.md
          for the rationale. Override token (last resort, requires linked
          run-log entry): `[migration-baseline-change]` in the PR title.
      - name: "Conventional Commits"
        mode: warning
        instructions: >
          PR title and squashed commit subject must match
          `^(feat|fix|chore|docs|refactor|perf|test|ci|build|revert)(\([a-z0-9-]+\))?: .+`.

  # --------------------------------------------------------------------------
  # Static analysis + scanners — enable EVERY tool that applies to this stack.
  # --------------------------------------------------------------------------
  tools:
    # JS / TS
    eslint:
      enabled: true
    biome:
      enabled: true
    oxc:
      enabled: true
    ast-grep:
      essential_rules: true
      packages:
        - "ast-grep-essentials"
      rule_dirs:
        - ".coderabbit/ast-grep"
      util_dirs: []

    # Python
    ruff:
      enabled: true
    pylint:
      enabled: true

    # iOS / Swift
    swiftlint:
      enabled: true

    # Shell + config
    shellcheck:
      enabled: true
    dotenvLint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    languagetool:
      enabled: true
      enabled_only: false
      level: picky
      enabled_rules: []
      disabled_rules:
        - "EN_QUOTES"
        - "EN_DIPLOMATS"
      enabled_categories: []
      disabled_categories: []

    # Containers / IaC
    hadolint:
      enabled: true
    checkov:
      enabled: true

    # Security
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    presidio:
      enabled: true
    semgrep:
      enabled: true
      config_file: ".coderabbit/semgrep/helmv3.yml"

    # React / CSS / agent files
    reactDoctor:
      enabled: true
    stylelint:
      enabled: true
    skillspector:
      enabled: true

    # SQL
    sqlfluff:
      enabled: true

    # Repo health
    github-checks:
      enabled: true
      timeout_ms: 180000
    circleci:
      enabled: false
    buf:
      enabled: false
    detekt:
      enabled: false
    phpstan:
      enabled: false
    pmd:
      enabled: false
    rubocop:
      enabled: false
    golangci-lint:
      enabled: false
    clippy:
      enabled: false
    regal:
      enabled: false
    shopify-theme-check:
      enabled: false
    htmlhint:
      enabled: false
    prismaLint:
      enabled: false

