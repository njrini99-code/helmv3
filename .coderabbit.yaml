  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "CLAUDE_CODE_GUIDE.md"
      - "docs/v3-master-plan.md"
      - "docs/v3-wave-sequence.md"
      - "docs/v3-decisions.md"
      - "docs/v3-design-language.md"
      - "docs/v3-feature-audit.md"
      - "docs/v3-page-audit.md"
      - "docs/v3-research-golf-domain.md"
      - "docs/v3-research-competitive-landscape.md"
      - "docs/v3-rls-template.md"
      - "docs/v3-testing-standards.md"
      - "docs/v3-compatibility-shims.md"
      - "docs/v3-player-transfer-playbook.md"
      - "docs/SECURITY_AUDIT.md"
      - "docs/PRIVACY_AUDIT.md"
      - "docs/IOS_NATIVE_AUDIT.md"
      - "docs/OBSERVABILITY.md"
      - "docs/operations/**/*.md"
      - "docs/architecture/**/*.md"
      - "docs/audits/**/*.md"
      - "docs/security/**/*.md"
      - "docs/setup/**/*.md"
      - "src/app/golf/README.md"
      - "memory/glossary.md"
      - "memory/projects/golfhelm.md"
      - "memory/context/golfhelm-features.md"
      - "memory/context/golfhelm-database.md"
      - "memory/context/coachhelm-ai.md"

# ---------------------------------------------------------------------------
# Generated content (docstrings, unit tests in finishing-touches workflow)
# ---------------------------------------------------------------------------
code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "src/**/*.{ts,tsx}"
        instructions: >
          TSDoc style. One-line summary + @param/@returns only when the type
          alone is not self-documenting. Skip docstrings on trivial getters
          and one-liners. Always document side effects (revalidation,
          analytics, navigation).
      - path: "supabase/functions/**/*.ts"
        instructions: >
          Document the request shape, the expected env vars, the error
          envelope, and the auth assumption (anon vs service role).
      - path: "tools/**/*.py"
        instructions: >
          Google-style Python docstrings. Document Args, Returns, Raises,
          and any external API or credential the function expects.
  unit_tests:
    path_instructions:
      - path: "src/**/*.{ts,tsx}"
        instructions: >
          Vitest. Use @testing-library/react. Cover: happy path, auth-failure,
          empty-state, error rendering. Mock Supabase via src/test/supabase-mock.
      - path: "src/app/**/actions/**/*.ts"
        instructions: >
          Vitest. Always assert the unauthenticated case throws, and the
          authorized case returns the typed success envelope. Include a test
          that the action calls revalidatePath().
      - path: "tools/**/*.py"
        instructions: >
          pytest. Cover happy path + one failure mode per public function.
          Use respx for httpx mocking.

# ---------------------------------------------------------------------------
# Issue enrichment + CodeRabbit Plan — Pro+ planning layer
# ---------------------------------------------------------------------------
issue_enrichment:
  auto_enrich:
    enabled: true

  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - "feature"
        - "enhancement"
        - "bug"
        - "high-risk"
        - "security"
        - "auth"
        - "rls"
        - "database"
        - "stats"
        - "import"
