schema_version: 1
replay_id: shot-tracking-confirmed-recovery-prompt-2026-08-22
incident_id: memory/incidents/shot_tracking/INC-2026-08-22-confirmed-snapshot-recovery-prompt.md
feature_id: shot_tracking
title: >-
  A confirmed, server-acknowledged scorecard was shown as an unsaved
  recovery drawer because a newer local emergency-save timestamp was treated
  as sufficient evidence of unsaved progress on its own.
bad_version: 4fba16c63
fixed_version: 48b41e1c4d8c86f12f5a2becd11454f5bd3899e2
fixture:
  - source: emergency-save.test.ts
    target: src/lib/utils/emergency-save.test.ts
test_command: "./node_modules/.bin/vitest run src/lib/utils/emergency-save.test.ts"
expected:
  bad_version: fail
  fixed_version: pass
expected_failure_mode: missing-export
sanitization:
  reviewed: true
  contains_production_data: false
  notes: >-
    Fixture is the repair commit's own regression test over a pure
    localStorage-backed utility, driven by an in-memory Storage stub with
    synthetic data. No production rows, PII, tokens, or logs.
source_incident_status: released
created_at: "2026-09-03"
notes: >-
  Backfilled per Phase G G.4.2. `clearEmergencySaveThrough` and
  `isEmergencySaveEquivalentToProgress` (the canonicalize-and-compare
  invariant the repair introduced) do not exist in
  src/lib/utils/emergency-save.ts at bad_version — confirmed by
  `git show 4fba16c63:src/lib/utils/emergency-save.ts`, which exports only
  emergencySave/loadEmergencySave/loadLatestEmergencySave/clearEmergencySave/
  isRecoverableRoundSubmitError. Overlaying the fixed_version test therefore
  fails at bad_version with a module-resolution error (no such exported
  member), not an assertion failure — this is the expected and correct
  failure mode for this replay: it proves the safety invariant had no
  enforcement point in the old code at all, matching the incident's own
  "a newer timestamp is never sufficient evidence by itself" finding.
  package-lock.json is byte-identical across all three replays in this
  corpus (sha256:54e0187c...) — see replay/README.md.
