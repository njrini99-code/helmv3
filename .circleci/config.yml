# helmv3 CircleCI pipeline
# Docs: https://circleci.com/docs/reference/configuration-reference
#
# Scope: things GitHub Actions does poorly or doesn't do at all.
#   - weekly heavy jobs (Knip, Stryker, full sqlfluff, npm audit, Squawk)
#   - iOS Capacitor build verification on M-series macOS runners
#
# GitHub Actions still owns: typecheck, lint, vitest, next build, Supabase
# RLS tests, the Review Gate (ast-grep/semgrep/gitleaks/etc.). Don't
# duplicate those here.

version: 2.1

orbs:
  node: circleci/node@5.2.0

# ---------------------------------------------------------------------------
# Parameters — toggled by Scheduled Pipelines (Project Settings > Triggers)
# ---------------------------------------------------------------------------
parameters:
  run-weekly:
    type: boolean
    default: false
    description: "Set true by the weekly scheduled pipeline."

# ---------------------------------------------------------------------------
# Executors
# ---------------------------------------------------------------------------
executors:
  node:
    docker:
      - image: cimg/node:22.13
    resource_class: medium
  node-large:
    docker:
      - image: cimg/node:22.13
    resource_class: large
  python:
    docker:
      - image: cimg/python:3.12
    resource_class: small
  ios:
    macos:
      # Capacitor 8 SwiftPM binaries require Swift 6.2, shipped with Xcode 26+.
      xcode: "26.4.1"
    resource_class: m4pro.medium
  # Linux + Android SDK. Far cheaper than the macOS class the iOS job needs,
  # which is why the Android check can afford to run on every android/** change
  # rather than only on a release branch.
  android:
    docker:
      - image: cimg/android:2025.04
    # `large` (8GB), not `medium`. Two separate OOMs got us here:
    #   1. `large` + `npm run build` -> exit 137. The Next build's
    #      --max-old-space-size=8192 heap against an 8GB container.
    #   2. `medium` + no build -> exit 137 again, this time in `npm ci`.
    #      This dependency tree (promptfoo, onnxruntime, sharp) needs more
    #      than medium's 4GB just to INSTALL.
    # So the build was the memory problem, not the box — but the box still
    # has to be large enough to install.
    resource_class: large

# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------
commands:
  install-node-deps:
    description: "npm ci with CircleCI cache"
    steps:
      - node/install-packages:
          pkg-manager: npm
          cache-version: v1-helmv3

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # ---------- Weekly: dead-code detection ----------
  knip:
    executor: node
    steps:
      - checkout
      - install-node-deps
      - run:
          name: Install Knip
          command: npm install --no-save knip
      - run:
          name: Knip — unused exports, files, deps
          command: npx knip --no-config-hints --reporter compact || true
      - store_artifacts:
          path: knip-report.txt
          destination: knip

  # ---------- Weekly: mutation testing on CoachHelm V2 engine ----------
  stryker-coachhelm:
    executor: node-large
    steps:
      - checkout
      - install-node-deps
      - run:
          name: Install Stryker
          command: |
            npm install --no-save \
              @stryker-mutator/core \
              @stryker-mutator/vitest-runner \
              @stryker-mutator/typescript-checker
      - run:
          name: Mutation test src/lib/coachhelm/v2/
          no_output_timeout: 30m
          command: |
            cat > stryker.conf.json <<'EOF'
            {
              "$schema": "./node_modules/@stryker-mutator/core/schema/stryker-schema.json",
              "packageManager": "npm",
              "reporters": ["html", "clear-text", "progress", "json"],
              "testRunner": "vitest",
              "coverageAnalysis": "perTest",
              "concurrency": 4,
              "timeoutMS": 60000,
              "mutate": ["src/lib/coachhelm/v2/**/*.ts"],
              "ignorePatterns": ["**/*.test.ts", "**/__tests__/**"]
            }
            EOF
            npx stryker run || true
      - store_artifacts:
          path: reports/mutation/
          destination: stryker

  # ---------- Weekly: full-repo SQL lint ----------
  sqlfluff-full:
    executor: python
    steps:
      - checkout
      - run: pip install --quiet sqlfluff
      - run:
          name: sqlfluff lint full migrations + seed
          command: |
            sqlfluff lint \
              --dialect postgres \
              --rules core \
              --processes 4 \
              supabase/migrations supabase/seed || true

  # ---------- Weekly: Postgres migration safety scan ----------
  squawk-migrations:
    executor: node
    steps:
      - checkout
      - install-node-deps
      - run:
          name: Install Squawk
          command: npm install --no-save squawk-cli
      - run:
          name: Squawk migration safety scan
          command: |
            shopt -s nullglob 2>/dev/null || true
            files=(supabase/migrations/*.sql)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No migrations to scan."
              exit 0
            fi
            npx squawk \
              --exclude=prefer-text-field,require-concurrent-index-creation,prefer-bigint-over-int \
              "${files[@]}" || true

  # ---------- Weekly: dependency vulnerability scan ----------
  npm-audit:
    executor: node
    steps:
      - checkout
      - install-node-deps
      - run:
          name: npm audit (high severity and above)
          command: |
            # Don't fail the weekly on audit findings — they're often
            # transitive and need manual triage. The output is the value.
            npm audit --audit-level=high --json > npm-audit.json || true
            npm audit --audit-level=high || true
      - store_artifacts:
          path: npm-audit.json
          destination: npm-audit

  # ---------- On-push: iOS Capacitor compile verification ----------
  # Runs on M-series Mac (~2x faster, ~3x cheaper than GHA macos-13).
  # Compile-only — no signing, no TestFlight. Add Fastlane Match + ASC
  # API key to upgrade this to a real publish pipeline.
  ios-compile:
    executor: ios
    steps:
      - checkout
      - node/install:
          node-version: "22.13"
      - install-node-deps
      - run:
          name: Build web bundle (for Capacitor sync)
          environment:
            NODE_OPTIONS: --max-old-space-size=8192
            NEXT_PUBLIC_SUPABASE_URL: https://dummy-ci-build.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-ci-build-only
          command: |
            # Capacitor needs the web bundle to exist before `cap sync`.
            # Use the prod build so we catch SSR/Server Component breakage
            # that wouldn't show up in dev mode.
            npm run build
      - run:
          name: Capacitor sync iOS
          command: |
            npx cap update ios
            npx cap sync ios
      - run:
          name: Resolve Swift packages
          command: |
            defaults write com.apple.dt.Xcode IDEPackageOnlyUseVersionsFromResolvedFile -bool NO || true
            defaults write com.apple.dt.Xcode IDEDisableAutomaticPackageResolution -bool NO || true
            rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            xcodebuild -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App
            cat ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - run:
          name: xcodebuild compile (no signing, simulator SDK)
          command: |
            cd ios/App
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build | tee xcodebuild.log | xcpretty || (cat xcodebuild.log && exit 1)
      - store_artifacts:
          path: ios/App/xcodebuild.log
          destination: xcodebuild-log

  # ---------- Android compile verification ----------
  # Mirrors ios-compile: prove the native project still assembles after a web,
  # Capacitor or plugin change. NOT a release build — no signing, no bundle.
  #
  # WHY THIS EXISTS. Until now nothing in CI touched Android at all: the only
  # mobile job was `ios-compile`, whose branch filter lists main, release/*,
  # ios/* and capacitor/* and matches no android branch, and no GitHub
  # workflow referenced android either. A PR could add or break the entire
  # Android platform and every check would stay green — which is exactly the
  # state the Play Store scaffold PR shipped in.
  android-compile:
    executor: android
    steps:
      - checkout
      - node/install:
          node-version: "22.13"
      - install-node-deps
      # NO `npm run build` here, deliberately — unlike the iOS job.
      #
      # capacitor.config.ts sets `webDir: 'public'` and
      # `server.url: https://www.helmsportslabs.com/...`, so the native app
      # loads the LIVE SITE rather than an embedded bundle. There are no built
      # web assets for `cap sync` to copy: `public/` is checked in and already
      # present at checkout.
      #
      # The first version of this job did run the build, copied from the iOS
      # job, and died with exit 137 — SIGKILL, an OOM: --max-old-space-size=8192
      # against a `large` container's 8GB. The fix is not a bigger resource
      # class; it is not doing ~10 minutes of work whose output is discarded.
      # `next build` is still verified on every PR by ci.yml's `next-build`.
      - run:
          name: Capacitor sync Android
          command: |
            # `cap sync` == copy + update, in that order, and the COPY step is
            # what creates android/app/src/main/assets — which .gitignore
            # excludes (capacitor.plugins.json, capacitor.config.json,
            # assets/public are all generated). Running `cap update` FIRST
            # therefore ENOENTs writing capacitor.plugins.json into a directory
            # that does not exist yet. The iOS job survives the same ordering
            # because the iOS project layout differs.
            mkdir -p android/app/src/main/assets
            npx cap sync android
      - run:
          name: Gradle assembleDebug (no signing)
          command: |
            cd android
            # Debug variant only: it uses the auto-generated debug keystore, so
            # this never needs the real upload key. Release signing stays a
            # local/manual concern.
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle.log
      - store_artifacts:
          path: android/gradle.log
          destination: gradle-log
      - store_artifacts:
          path: android/app/build/outputs/apk/debug
          destination: debug-apk

  # ---------- On-PR: Lighthouse CI against Vercel preview ----------
  # Polls the Vercel API for the preview deployment matching this PR's
  # commit SHA, then runs lhci against landing + login routes. Asserts
  # in lighthouserc.cjs — a11y + CLS are hard errors, perf is a warning.
  # Required env vars in CircleCI project settings:
  #   VERCEL_TOKEN, VERCEL_PROJECT_ID, (optional) VERCEL_TEAM_ID
  lighthouse-preview:
    executor: node-large
    steps:
      - checkout
      - install-node-deps
      - run:
          name: Install lhci + jq
          command: |
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
            npm install --no-save @lhci/cli
      - run:
          name: Wait for Vercel preview to be READY
          command: |
            set +e
            URL=$(bash .circleci/scripts/wait-for-vercel-preview.sh 2> /tmp/vercel-preview.err)
            status=$?
            set -e
            cat /tmp/vercel-preview.err >&2
            if [ "$status" -eq 0 ]; then
              echo "export PREVIEW_URL='${URL}'" >> "$BASH_ENV"
              echo "export LIGHTHOUSE_PREVIEW_READY='true'" >> "$BASH_ENV"
            elif grep -Eq \
              "(Timeout after|is not configured|No Vercel deployment found|Vercel API call failed|Vercel deployment (ERROR|CANCELED))" \
              /tmp/vercel-preview.err; then
              echo "Vercel preview was unavailable; skipping advisory Lighthouse run."
              echo "export LIGHTHOUSE_PREVIEW_READY='false'" >> "$BASH_ENV"
            else
              echo "Vercel preview lookup failed for a non-timeout reason."
              exit "$status"
            fi
      - run:
          name: Run Lighthouse CI
          command: |
            if [ "${LIGHTHOUSE_PREVIEW_READY:-false}" != "true" ]; then
              echo "Skipping Lighthouse CI: no preview URL available."
              exit 0
            fi
            set +e
            npx lhci autorun --config=lighthouserc.cjs 2>&1 | tee /tmp/lhci.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if grep -Eiq "(assertion|categories:|largest-contentful-paint|cumulative-layout-shift|total-blocking-time|interaction-to-next-paint)" /tmp/lhci.log; then
              echo "Advisory Lighthouse score/assertion findings detected; see artifact for details."
              exit 0
            fi
            echo "Lighthouse CI failed for a runtime/tool/upload reason."
            exit "$status"
      - store_artifacts:
          path: .lighthouseci/
          destination: lighthouse

  # ---------- Weekly: Promptfoo LLM evals ----------
  # Scored evaluation of CoachHelm composer prompts. Catches silent
  # prompt drift between deploys. Requires ANTHROPIC_API_KEY or
  # OPENAI_API_KEY (or both) in CircleCI project env. If neither is
  # set the job no-ops with a clear message.
  promptfoo-evals:
    executor: node
    steps:
      - checkout
      - install-node-deps
      - run:
          name: Run Promptfoo evals
          command: |
            if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "Skipping evals: no LLM API key in env."
              exit 0
            fi
            mkdir -p evals/results
            npx promptfoo eval \
              --config evals/round-review.yaml \
              --output evals/results/round-review.json || true
            # Print the human-readable summary to the job log
            npx promptfoo view --no-open evals/results/round-review.json || true
      - store_artifacts:
          path: evals/results/
          destination: promptfoo

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  # Weekly heavy jobs. Wire via Project Settings > Triggers > Scheduled
  # Pipelines (Mondays 06:00 UTC = 02:00 ET), passing `run-weekly=true`.
  # Docs: https://circleci.com/docs/scheduled-pipelines/
  weekly:
    when: << pipeline.parameters.run-weekly >>
    jobs:
      - knip
      - sqlfluff-full
      - squawk-migrations
      - npm-audit
      - stryker-coachhelm
      - promptfoo-evals

  # iOS compile verification — runs on every PR that touches ios/**,
  # capacitor.config.ts, or any Capacitor plugin in package.json, plus
  # on every push to main. Keeps the iOS app green without paying GHA
  # macOS rates.
  ios:
    when:
      not: << pipeline.parameters.run-weekly >>
    jobs:
      - ios-compile:
          filters:
            branches:
              only:
                - main
                - /release\/.*/
                - /ios\/.*/
                - /capacitor\/.*/
                - /agent\/fix-circleci-ios-.*/

  android:
    when:
      not: << pipeline.parameters.run-weekly >>
    jobs:
      - android-compile:
          filters:
            branches:
              only:
                - main
                - /release\/.*/
                - /android\/.*/
                - /capacitor\/.*/
                - /ci\/android-.*/

  # Lighthouse runs on every push (excluding the scheduled weekly).
  # The wait-for-vercel-preview script returns early with a useful
  # message if Vercel isn't deploying that branch (e.g. main pushes
  # that re-use an existing deployment).
  lighthouse:
    when:
      not: << pipeline.parameters.run-weekly >>
    jobs:
      - lighthouse-preview:
          filters:
            branches:
              ignore:
                - /docs\/.*/
                - /chore\/.*-noop/
