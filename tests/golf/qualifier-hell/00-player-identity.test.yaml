fileType: momentic/test/v2
id: golf-hell-player-identity
name: GolfHelm qualifier hell - identify QA player in UI
url: https://helmsportslabs.com/golf/login
steps:
  - type:
      text: "{{ env.PLAYER_EMAIL }}"
      into: Email
  - type:
      text: "{{ env.PLAYER_PASSWORD }}"
      into: Password
  - click: Sign in
  - waitForUrl: /golf/dashboard
  - navigate: https://helmsportslabs.com/golf/dashboard/settings
  - checkPageContains: Profile
