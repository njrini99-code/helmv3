fileType: momentic/test/v2
id: golf-hell-auth-check
name: GolfHelm qualifier hell - QA account preflight
url: https://helmsportslabs.com/golf/login
steps:
  - type:
      text: "{{ env.COACH_EMAIL }}"
      into: Email
  - type:
      text: "{{ env.COACH_PASSWORD }}"
      into: Password
  - click: Sign in
  - waitForUrl: /golf/dashboard
  - checkPageContains: GolfHelm
  - checkPageDoesNotContain: Log in to GolfHelm
