fileType: momentic/test/v2
id: golf-hell-round-one-recovery
name: GolfHelm qualifier hell - interrupted round recovery proof
url: https://helmsportslabs.com/golf/login
steps:
  - type:
      text: "{{ env.PLAYER_EMAIL }}"
      into: Email
  - type:
      text: "{{ env.PLAYER_PASSWORD }}"
      into: Password
  - click: Sign in
  - waitForUrl: /golf/dashboard
  - navigate: https://helmsportslabs.com/golf/dashboard/rounds
  - checkPageContains: "{{ env.QA_COURSE_R1 }}"
  - click: Continue
  - waitForUrl: /golf/dashboard/rounds/continue/
  - checkPageContains: Hole 3
