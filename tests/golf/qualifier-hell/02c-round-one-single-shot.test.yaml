fileType: momentic/test/v2
id: golf-hell-round-one-single-shot
name: GolfHelm qualifier hell - durable single-shot probe
url: https://helmsportslabs.com/golf/login
steps:
  - type:
      text: "{{ env.PLAYER_EMAIL }}"
      into: Email
  - type:
      text: "{{ env.PLAYER_PASSWORD }}"
      into: Password
  - click: Sign in
  - waitForUrl: /golf/dashboard
  - navigate: https://helmsportslabs.com/golf/dashboard/rounds
  - checkPageContains: "{{ env.QA_COURSE_R1 }}"
  - click: Continue
  - waitForUrl: /golf/dashboard/rounds/continue/
  - checkPageContains: Hole 3
  - act: >-
      Without refreshing, opening another tab, or touching any recovery dialog,
      record exactly one legal tee shot on the current Hole 3: select Driver,
      choose Fairway as the result, advance once only after its server-backed
      acknowledgement, and leave the player at the next shot on the same hole.
      Do not complete the hole, add a second shot, save/exit, submit, or alter
      another round. Fail on any missing acknowledgement, duplicate shot, error,
      or false success.
