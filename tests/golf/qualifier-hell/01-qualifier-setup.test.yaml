fileType: momentic/test/v2
id: golf-hell-qualifier-setup
name: GolfHelm qualifier hell - create four-round QA qualifier
url: https://helmsportslabs.com/golf/login
steps:
  - type:
      text: "{{ env.COACH_EMAIL }}"
      into: Email
  - type:
      text: "{{ env.COACH_PASSWORD }}"
      into: Password
  - click: Sign in
  - navigate: https://helmsportslabs.com/golf/dashboard/qualifiers/new
  - checkPageContains: Create a qualifier.
  - type:
      text: "{{ env.QA_QUALIFIER_NAME }}"
      into: Qualifier name
  - type:
      text: "Automated QA qualifier torture run {{ env.QA_RUN_ID }}. Synthetic data. Do not use for selection."
      into: Description
  # The three dates are calendar pickers, not typed fields: open each picker,
  # then click the day. Start date opens on the current month; End date and
  # Entry deadline open on the start's month. A QA_END_DATE in a later month
  # needs a click on the calendar's next-month arrow before its day.
  - click: the Start date picker button
  - click: "the {{ env.QA_START_DATE }} day in the open calendar"
  - click: the End date picker button
  - click: "the {{ env.QA_END_DATE }} day in the open calendar"
  - click: the Entry deadline picker button
  - click: "the {{ env.QA_START_DATE }} day in the open calendar"
  - click: the plus button in the Rounds control
  - click: the plus button in the Rounds control
  - click: the plus button in the Rounds control
  - checkPageContains: Round 4
  - click: Cole Bennett
  - click: Create qualifier
  - waitForUrl: /golf/dashboard/qualifiers
  - checkPageContains: "{{ env.QA_QUALIFIER_NAME }}"
  - click: "{{ env.QA_QUALIFIER_NAME }}"
  - waitForUrl: /golf/dashboard/qualifiers/
  # A new qualifier's board has no rounds yet: it names the entrant count and
  # the empty scorecard tally, not players or an x/y count.
  - checkPageContains: 0 of 4 scorecards in
  - checkPageContains: No rounds posted yet. 1 player is entered.
