# ast-grep rule: `any` defeats every guarantee TypeScript gives us.
# ESLint already flags it as warn; this rule lets CodeRabbit cite the
# exact location with project context.
id: helmv3-no-explicit-any
language: typescript
severity: warning
message: >
  No `any`. Use `unknown` and narrow, or write the real type. If you
  truly cannot type something (e.g. third-party SDK with broken types),
  add `// eslint-disable-next-line @typescript-eslint/no-explicit-any`
  with a one-line justification.
rule:
  any:
    - pattern: "const $X: any = $$$"
    - pattern: "let $X: any = $$$"
    - pattern: "function $F($$$): any { $$$ }"
    - pattern: "($X: any) => $$$"
    - pattern: "as any"
