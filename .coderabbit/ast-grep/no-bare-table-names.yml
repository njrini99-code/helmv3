# ast-grep rule: forbid Supabase `.from()` calls against unprefixed tables.
# In helmv3 every Supabase table is sport-prefixed (golf_*, baseball_*),
# plus a small allowlist of cross-sport tables (users, organizations,
# memberships, audit_log, feature_flags).
#
# CLAUDE.md "Table Names — ALWAYS Use Sport Prefix" is the source rule.
#
# IMPORTANT: this rule must NOT match `supabase.storage.from('<bucket>')`.
# Storage buckets live in a separate namespace from DB tables, and several
# buckets share their name with the bare-table pattern (e.g. 'documents',
# 'baseball_videos'). We exclude any receiver whose source text ends in
# `.storage` via a metavariable regex constraint on `$X`.
id: helmv3-no-bare-table-names
language: typescript
severity: error
message: >
  Supabase queries must use sport-prefixed table names
  (golf_* or baseball_*). Bare names like "coaches", "players",
  "teams", "rounds", "events" do not exist in production.
note: >
  Allowed unprefixed tables: users, organizations, memberships,
  audit_log, feature_flags. Anything else needs a sport prefix.
  Storage bucket calls (`supabase.storage.from('<bucket>')`) are
  excluded — they reference Supabase Storage buckets, not DB tables.
rule:
  any:
    - pattern: $X.from("coaches")
    - pattern: $X.from('coaches')
    - pattern: $X.from(`coaches`)
    - pattern: $X.from("players")
    - pattern: $X.from('players')
    - pattern: $X.from(`players`)
    - pattern: $X.from("teams")
    - pattern: $X.from('teams')
    - pattern: $X.from(`teams`)
    - pattern: $X.from("rounds")
    - pattern: $X.from('rounds')
    - pattern: $X.from(`rounds`)
    - pattern: $X.from("events")
    - pattern: $X.from('events')
    - pattern: $X.from(`events`)
    - pattern: $X.from("shots")
    - pattern: $X.from('shots')
    - pattern: $X.from(`shots`)
    - pattern: $X.from("qualifiers")
    - pattern: $X.from('qualifiers')
    - pattern: $X.from(`qualifiers`)
    - pattern: $X.from("messages")
    - pattern: $X.from('messages')
    - pattern: $X.from(`messages`)
    - pattern: $X.from("tasks")
    - pattern: $X.from('tasks')
    - pattern: $X.from(`tasks`)
    - pattern: $X.from("documents")
    - pattern: $X.from('documents')
    - pattern: $X.from(`documents`)
    - pattern: $X.from("travel")
    - pattern: $X.from('travel')
    - pattern: $X.from(`travel`)
constraints:
  # Skip `supabase.storage.from(...)` — Storage bucket access lives in a
  # different namespace than DB tables and shares some names with the
  # bare-table pattern (e.g. 'documents'). The regex matches against the
  # source text of the receiver `$X`; `\.storage\b` catches both
  # `supabase.storage` (single-line) and the multi-line `await supabase\n
  # .storage` form because ast-grep flattens AST nodes to source text.
  X:
    not:
      regex: "\\.storage\\b"
