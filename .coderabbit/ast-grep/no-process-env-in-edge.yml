# ast-grep rule: Supabase Edge Functions run on Deno. process.env is
# undefined there — use Deno.env.get(). Catching this at review time
# prevents a class of "works locally, errors in prod" bugs.
id: helmv3-no-process-env-in-edge
language: typescript
severity: error
message: >
  Supabase Edge Functions run on Deno. Use Deno.env.get("KEY") instead
  of process.env.KEY.
note: >
  process.env is undefined in Deno. If you need to share code between
  Node and Deno, isolate the env-reading layer.
# Scope to Deno-runtime code only. Next.js instrumentation, server
# components, and other Node-runtime files are unaffected.
files:
  - 'supabase/functions/**/*.ts'
  - 'supabase/functions/**/*.js'
rule:
  any:
    - pattern: process.env.$KEY
    - pattern: process.env[$KEY]
