title = "GolfHelm gitleaks rules"

# These rules complement the default gitleaks ruleset. Add project-specific
# patterns here so the pre-commit / CI scanner catches GolfHelm-shaped leaks.

[[rules]]
description = "Legacy Supabase dev project DB password (rotated 2026-05-17)"
id = "supabase-dev-db-password-2026-05-17"
regex = '''EHl4yASa9zM1sb1k'''
tags = ["supabase", "leaked-credential", "rotated"]

[[rules]]
description = "Supabase Postgres URL with embedded password"
id = "supabase-db-url-embedded-password"
regex = '''postgres(?:ql)?://postgres:[^@\s]{8,}@db\.[a-z0-9]+\.supabase\.co'''
tags = ["supabase", "credential"]

[[rules]]
description = "PGPASSWORD env-var inline literal"
id = "pgpassword-inline"
regex = '''PGPASSWORD=['"][^'"\s]{8,}['"]'''
tags = ["postgres", "credential"]

[[rules]]
description = "Supabase HS256 JWT (anon/service-role key) committed in source (#380)"
id = "supabase-hs256-jwt"
# Supabase issues all anon/service-role keys as HS256 JWTs, which always share
# the fixed base64url header `{"alg":"HS256","typ":"JWT"}` below. Requiring the
# full three-segment shape (header.payload.signature, each segment long enough
# to be real) avoids matching short/truncated example tokens in docs.
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''
tags = ["supabase", "credential", "jwt"]

[[rules]]
description = "Inline assignment of a Supabase key env var to a JWT literal (#380)"
id = "supabase-key-env-assignment"
# Catches `SUPABASE_SERVICE_ROLE_KEY = 'eyJ...'` / `SUPABASE_ANON_KEY=eyJ...`
# style assignments regardless of the local variable name used to hold the
# value, so a future seeder that copies the value into e.g. `const key = ...`
# is still caught by the JWT-shape rule above.
regex = '''(?i)(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_ANON_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY)\s*[:=]\s*['"]?eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["supabase", "credential", "jwt", "env"]

# Allowlist for the audit and plan documents that intentionally reference
# the rotated credential to document the finding.
[[rules]]
description = "Supabase personal/access token (sbp_ prefix)"
id = "supabase-access-token-sbp"
regex = '''sbp_[a-f0-9]{40,}'''
tags = ["supabase", "access-token"]
# Added 2026-08-19. There was NO rule for this shape, so `sbp_`-prefixed
# tokens were invisible to the scanner — verified with `grep -c sbp_` on this
# file returning 0. One such token lives in .cursor/mcp.json, which is
# correctly gitignored and has never been committed (verified via
# `git ls-files` + `git check-ignore`), but nothing would have caught it if it
# ever were. A scanner that cannot see a token shape reports clean for the
# same reason it reports clean when there is nothing there.

[allowlist]
paths = [
  '''docs/superpowers/plans/2026-05-17-.*\.md''',
  '''\.full-review-2026-05-17-golfhelm-audit/.*\.md''',
  '''docs/operations/2026-05-17-p0-runbook\.md''',
  '''docs/operations/2026-06-30-baseball-stats-seed-key-rotation\.md''',
  '''\.gitleaks\.toml''',
  # The Supabase error-envelope privacy test asserts that a JWT appearing as
  # PLAIN TEXT (not only inside a URL) is redacted before it can reach
  # telemetry. Proving that requires a JWT literal in the test. The value is
  # the canonical jwt.io HS256 example token — signature SflKxwR..., secret
  # 'your-256-bit-secret' — published in jwt.io's own documentation and not a
  # Helm credential. The test itself asserts the string does NOT survive
  # sanitizeSupabaseFreeText, so removing it would delete the proof that
  # plain-text JWT redaction works.
  '''src/lib/observability/supabase/__tests__/envelope\.test\.ts''',
]
