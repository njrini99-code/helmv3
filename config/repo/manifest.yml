# Repository control-plane manifest — the DESIRED state repo:doctor checks against.
#
# This file is the single source of project identity and invariants. `repo:doctor`
# compares it against the ACTUAL repository/local state and reports PASS / WARN /
# FAIL / DRIFT / UNKNOWN. It never mutates anything.
#
# Keep desired values here, not observed platform state. When an invariant
# changes deliberately, change it here in the same PR — the doctor then makes any
# other representation that disagrees (a doc, a machine-local file) fail loudly.

repository:
  # Matched against `git remote get-url origin` (host/owner/name, ignoring
  # protocol and .git suffix). This is what makes "am I in the right repo"
  # deterministic instead of assumed.
  remote: njrini99-code/helmv3

authority:
  constitution: AGENTS.md            # the vendor-neutral repo constitution
  claude_adapter: CLAUDE.md          # must import the constitution (@AGENTS.md)
  feature_registry: memory/registry.yml

workspace:
  # A worktree whose path is INSIDE the repo root poisons file search (two
  # copies of every file) — still forbidden, but repo:doctor
  # (scripts/repo-doctor/checks/workspace.mjs) now grades the violation by
  # whether the worktree carries the .helm/workspace.json marker every
  # workspace made through the door (scripts/lib/create-workspace.mjs) has:
  #
  #   nested,   marked    -> WARN  mis-placed, but tooling can account for it
  #   nested,   unmarked  -> FAIL  mis-placed AND untracked
  #   external, unmarked  -> FAIL  every worktree must carry the marker,
  #                                wherever it lives — see
  #                                docs/operations/WORKSPACES.md
  #   canonical, absent   -> WARN  the marker is gitignored/machine-local;
  #                                absence on a fresh clone is expected
  #
  # A marker is not optional decoration: it is what lets the mutation budget
  # and scripts/worktree-lifecycle.mjs tell a governed workspace from one that
  # bypassed the door.
  nested_worktrees: warn_if_marked
  worktree_marker_required: true

scratch:
  # Gitignored top-level dirs that are legitimately allowed to be large.
  allowlist:
    - .next
    - node_modules
    - playwright-report
    - test-results
    - coverage
    - .git
    - .dev-artifacts
    - .turbo
    - dist
    - .vercel
  warn_file_count: 5000
  warn_bytes: 262144000   # 250 MB

# npm scripts the standard workflow depends on. A missing one means a documented
# workflow cannot actually be run.
required_scripts:
  - repo:doctor
  - typecheck
  - lint
  - build
  - docs:check

supabase:
  # The one expected Supabase project root (holds config.toml). An unexpected
  # second root is how "which database am I targeting" becomes ambiguous.
  root: supabase

ci:
  # Check-run names that must be produced by EXACTLY ONE workflow job. Two jobs
  # posting the same name is the phantom-required-context trap (PR #1125).
  unique_check_names:
    - CI aggregate
    - Review Gate aggregate

vercel:
  # Paths that must NEVER be in a Vercel upload. `.vercelignore` REPLACES the
  # default ignore set, so `.gitignore` protects none of these once that file
  # exists — the .env family shipped in every upload until #1714 for exactly
  # that reason. `npm run check:vercelignore` (also `repo:doctor` →
  # config.vercelignore-coverage, and CI's control-plane job) asserts each of
  # these is matched by `.vercelignore`. A trailing slash means directory.
  #
  # Adding a secret-bearing gitignored path to `.gitignore` without adding it
  # here is how the next one leaks. Keep the two in step.
  must_ignore:
    # Live credentials
    - .env
    - .env.local
    - .env.development.local
    - .env.production.local
    - .cursor/mcp.json                 # sbp_ Supabase access token (.gitleaks.toml)
    - context7.json                    # Context7 api_key
    - playwright/.auth/                # Supabase session cookies (storage state)
    - momentic/auth/                   # test-account auth
    - .momentic-mcp/                   # captured environment values incl. credentials
    - android/keystore.properties      # upload keystore password
    - android/upload.keystore          # representative of *.keystore
    - probe.jks                        # representative of *.jks
    - probe.pem                        # representative of *.pem
    - .claude/settings.local.json      # per-machine allowlist, once leaked to this repo
    - .claude/session-state/           # per-session ledgers, machine state
    - .vercel/                         # project link + org id
    - supabase/.temp/                  # linked project ref + CLI scratch
    # Tracked or local artifacts that are never a build input
    - .momentic/
    - .dev-assets/
    - .dev-screenshots/
    - .codex/
    - .design-sync/
    - .ultracode/
    - .vscode/
    - .idea/
    - .agents/
    - .playwright-mcp/
    - .ruff_cache/
    - .deepsec/
    - .worktrees/
    - .claude/worktrees/
    - audit/
    - tools/
    - routes/
    # docs/ was one wholesale entry until 2026-09-03. It stopped being true when
    # /admin/engineering began reading three generated files at request time, so
    # `.vercelignore` now excludes `docs/*` and carves those three back in. The
    # directory-wide exclusion still holds for everything else — a new docs
    # subdirectory is excluded the moment it appears, without an entry here —
    # and these three are named because they carry ~97% of the weight and a
    # future carve-out must not quietly re-include them.
    - docs/qa/
    - docs/archive/
    - docs/audits/
    - deno.lock
    - node_modules/
    - .next/
    - coverage/
    - test-results/
    - playwright-report/
