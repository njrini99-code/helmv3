version: 1

production:
  # The one linked helmv3 Vercel project. Git deployments are disabled
  # (vercel.json), so production changes only when an agent deploys:
  # `./node_modules/.bin/vercel deploy --prod` (AGENTS.md "Production").
  # Deploys MUST run from the checkout linked to this project
  # (.vercel/project.json projectId == this id). `vercel deploy` from an
  # unlinked directory does not fail: it silently creates a NEW project named
  # after the cwd (that is how helmv3-golf-reliability-release-20260825 and
  # helmv3-main-release-c350 came to exist). Verify the link before deploying.
  vercel_project_id: prj_qPgC4eErTUsaSmv40EiQMNuTpuEV

# Vocabulary reused by src/lib/admin/autonomy/policy.ts (AUTONOMY_TIERS and
# AUTONOMY_CEILING): which steps the reliability loop may take on its own.
daily_reliability:
  may_observe: true
  may_investigate: true
  may_reproduce: true
  may_write_tests: true
  may_prepare_repairs: true
  may_open_or_update_repair_prs: true
  may_merge_verified_low_risk_repairs: true

security:
  # Read by .github/workflows/control-plane-weekly.yml's hard check: the
  # weekly run fails when open Dependabot alerts at severity high or
  # critical exceed this number. Not zero — a hard gate that can never be
  # green while an alert is triaged-but-unfixed just gets ignored; this is a
  # ceiling on how much can accumulate before it becomes a required action,
  # not a claim that this many is fine to carry indefinitely.
  max_open_high_dependabot: 5
