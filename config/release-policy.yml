version: 1

production:
  routine_max_deploys_per_calendar_week: 2
  timezone: America/New_York
  # calendar week = ISO week: Monday 00:00:00 through Sunday 23:59:59 in this timezone
  # The one linked helmv3 Vercel project (Vercel audit §1). scripts/deploy-prod.sh
  # refuses to deploy from any directory whose .vercel/project.json names a
  # different id — this is what stopped helmv3-golf-reliability-release-20260825
  # and helmv3-main-release-c350 from being createable by accident again: both
  # were `vercel deploy` runs from an unlinked directory, which silently creates
  # a NEW project named after the cwd instead of failing.
  vercel_project_id: prj_qPgC4eErTUsaSmv40EiQMNuTpuEV

daily_reliability:
  may_observe: true
  may_investigate: true
  may_reproduce: true
  may_write_tests: true
  may_prepare_repairs: true
  may_open_or_update_repair_prs: true
  may_merge_verified_low_risk_repairs: true
  may_deploy_production: false

release:
  human_approval_required: true
  automatic_production_deploy: false
  deploy_from_verified_sha_only: true
  require_release_candidate_report: true
  require_production_budget_check: true

emergency:
  automatic_override: false
  owner_decision_required: true

security:
  # Read by .github/workflows/control-plane-weekly.yml's hard check: the
  # weekly run fails when open Dependabot alerts at severity high or
  # critical exceed this number. Not zero — a hard gate that can never be
  # green while an alert is triaged-but-unfixed just gets ignored; this is a
  # ceiling on how much can accumulate before it becomes a required action,
  # not a claim that this many is fine to carry indefinitely.
  max_open_high_dependabot: 5
