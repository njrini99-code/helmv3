# Feature flag + kill-switch registry.
#
# Source of truth for `src/lib/flags/registry.generated.ts` (regenerate with
# `npm run flags:generate`; `npm run flags:check` is the CI governance gate —
# see docs/ai-system/FEATURE_FLAGS.md for the full schema, the NEVER-GATE
# list, and how to add/expire a flag).
#
# Owner decision: ADR 2026-09-03-control-plane-owner-decisions.md
# (`FEATURE_FLAG_INFRASTRUCTURE_NET_NEW` = "Flags yes";
# `CANARY_ROLLOUT_MECHANISM` = "Canary later" — `environment` below is
# booleans ONLY, never a percentage/cohort. Percentage rollout is explicitly
# deferred, not built here.
#
# Schema per flag (all fields required unless noted):
#   feature_id             stable id; also the string passed to isFlagEnabled()
#   owner                  who to ask before flipping/removing this flag
#   purpose                one sentence: what it controls and why it exists
#   type                   release | experiment | operations_kill_switch | temporary_migration
#   status                 active | archived
#   created_at             ISO date
#   expires_at             ISO date or null — required for temporary_migration;
#                          optional (norm: set one) for release/experiment;
#                          may be null for a permanent operations_kill_switch
#   default                boolean fallback when an environment key is absent
#   environment            { production, preview, development } — booleans only
#   kill_switch_behavior   required (non-empty) when type is operations_kill_switch;
#                          null otherwise. What turning it off disables, what
#                          keeps running, who may change it, how it's audited.
#   cleanup_plan           required for every flag — how/when it gets removed
#                          ("no planned removal" is a valid, honest answer for
#                          a permanent operations_kill_switch)

version: 1

flags:
  # Describes an EXISTING env-driven toggle. Does not change its runtime
  # behavior: src/app/golf/actions/golf.ts:1210 and
  # src/lib/observability/helm-flight-recorder.ts:194 (both owned by the
  # parallel Sentry session per
  # docs/ai-system/HANDOFF_BRIDGE_CONTROL_PLANE_2026-09-03.md's ownership
  # table) still read process.env.HELM_FLIGHT_RECORDER_ENABLED directly.
  # src/lib/flags/__tests__/is-enabled.test.ts proves isFlagEnabled('flight_recorder')
  # returns exactly what that raw read returns across the same env matrix, so
  # the owning session can swap the call site later with a parity guarantee
  # already in place.
  - feature_id: flight_recorder
    owner: platform (Bridge)
    purpose: >-
      Arms per-request golf round mutation tracing (client to server action
      to RPC to in-transaction checkpoints) so /admin/traces has data to
      show. An operability lever only — disabling it stops the mutation
      from being observed, never stops the mutation from running.
    type: operations_kill_switch
    status: active
    created_at: "2026-09-03"
    expires_at: null
    default: true
    environment:
      # Real code: `!isProduction || traceId != null || HELM_FLIGHT_RECORDER_ENABLED === 'true'`.
      # The `!isProduction` half is exactly what production=false/preview=
      # true/development=true encodes here. The `traceId != null` half is a
      # per-request override this boolean rollout model cannot express — a
      # caller with an explicit trace id is force-armed regardless of this
      # column, unchanged by this registry entry.
      production: false
      preview: true
      development: true
    kill_switch_behavior: >-
      Off: no helm_debug_start_trace / helm_debug_record_trace_step /
      helm_debug_finalize_trace RPCs are called from the golf round action
      path. The round mutation itself is unaffected — this switch only
      controls whether it is observed. Changed by setting
      HELM_FLIGHT_RECORDER_ENABLED at the environment level (deploy-time,
      not a runtime toggle); auditable via the Vercel environment-variable
      change log.
    cleanup_plan: >-
      No planned removal — permanent ops tooling. This registry entry
      documents the existing toggle; it does not wire the call sites, which
      sit outside this PR's file-ownership boundary. Wiring is left to the
      Sentry session that owns those two files.

  # Describes an EXISTING env-driven toggle. Does not change its runtime
  # behavior: src/lib/coachhelm/v2/gate.ts's isCoachHelmEnabled() still
  # reads process.env.NEXT_PUBLIC_COACHHELM_ENABLED directly — not wired
  # through this library. Included so the registry has one real example of
  # a `release`-shaped entry alongside the operations_kill_switch example
  # above, and so a future removal/rewrite of that toggle has a governance
  # record to update rather than a bare env read to rediscover.
  - feature_id: coachhelm_v2_availability
    owner: golf/coachhelm
    purpose: >-
      Global product-availability switch for the CoachHelm V2 AI layer. Off
      disables the whole surface for every coach and player account; the
      underlying check is a fail-open string comparison (any value except
      the literal string "false" leaves it on).
    type: release
    status: active
    created_at: "2026-09-03"
    expires_at: null
    default: true
    environment:
      production: true
      preview: true
      development: true
    kill_switch_behavior: null
    cleanup_plan: >-
      No planned removal — this has been the live product-availability
      switch for CoachHelm V2 since its rollout; this registry entry
      documents it without wiring the call site, which lives outside this
      PR's scope. A future session may wire src/lib/coachhelm/v2/gate.ts
      through isFlagEnabled('coachhelm_v2_availability') as a small,
      independent follow-up.

  # Phase J remainder (docs/ai-system/CONTROL_PLANE_IMPLEMENTATION_PLAN_2026-09-03.md
  # §6 J.4.2). Owner decision: ADR 2026-09-03-control-plane-owner-decisions.md
  # (VERIFICATION_ENSEMBLE_MODEL_COST = "No cost" — same Anthropic account,
  # no second provider, no recurring spend; runs only when explicitly
  # invoked, never on a schedule). Wired: src/lib/admin/ensemble/
  # verification-ensemble.ts checks isFlagEnabled('verification_ensemble')
  # before its first model call and is proven inert when off
  # (src/lib/admin/ensemble/__tests__/verification-ensemble.test.ts asserts
  # zero generateObject calls with the flag off).
  - feature_id: verification_ensemble
    owner: platform (Bridge)
    purpose: >-
      Runs a multi-pass adversarial/security/product review chain over an
      already-produced root-cause analysis before it reaches the repair
      queue; default off, no recurring cost.
    type: operations_kill_switch
    status: active
    created_at: "2026-09-03"
    expires_at: null
    default: false
    environment:
      production: false
      preview: false
      development: false
    kill_switch_behavior: >-
      Off (the default everywhere): runVerificationEnsemble returns
      status: 'disabled' immediately, before resolving a model provider or
      calling generateObject — zero additional model calls beyond today's
      single Diagnose call. On: adds up to four more model calls
      (ADVERSARY, conditional SECURITY, PRODUCT, JUDGE) per invocation, on
      the same Anthropic account Diagnose already uses. Changed by editing
      this file's environment block and running npm run flags:generate;
      auditable via git history on config/feature-flags.yml.
    cleanup_plan: >-
      No planned removal — permanent ops lever gating a genuinely optional
      verification pass, not a migration bridge.

  # v3 insight ranking's coach-weight multiplier (loadCoachWeightsForPlayer,
  # score.ts). Split 2026-09-23 from a flag this id used to share with the
  # unrelated v2 alert-threshold consumer below (now its own
  # coachhelm_v2_alert_personalization id) — the two were independently
  # flippable behaviors hiding behind one switch, so turning on the v3
  # coach-weight read would have silently turned on v2 alert
  # personalization too. This id keeps its exact value/environment
  # (false everywhere) so the split is a no-op for runtime behavior.
  - feature_id: coachhelm_learned_personalization
    owner: golf/coachhelm
    purpose: >-
      Gates whether v3 insight ranking's loadCoachWeightsForPlayer applies
      stored golf_coachhelm_coach_weights instead of neutral 1.0 defaults;
      default off because production's weights were computed under v1's
      broken outcome-attribution math (see score.ts's own docblock), not
      because of any evidence problem with this flag.
    type: experiment
    status: active
    created_at: "2026-09-22"
    expires_at: null
    default: false
    environment:
      production: false
      preview: false
      development: false
    kill_switch_behavior: null
    cleanup_plan: >-
      Flip on once golf_coachhelm_coach_weights has accumulated enough
      post-fix (corrected v2 causality attribution) samples to trust the
      persisted weights, or remove the coach-weight read entirely if
      that ranking signal is abandoned.

  # CoachHelm learning-loop wiring: BehaviorLearner.getLearnedPreferences()'s
  # result was previously computed and immediately discarded in
  # orchestrator.ts's generateAlerts() (dead work, not dead code — it ran a
  # query every call and threw the result away). Wired: with this flag off
  # (the default everywhere), generateAlerts() still computes the learned
  # thresholds but only logs when they would have differed from the
  # coach's persisted CoachPhilosophy thresholds (shadow) — `philosophy` is
  # never mutated, so alert output is unchanged from before this flag
  # existed. On: the learned, ack/dismiss-adjusted per-type thresholds
  # (BehaviorLearner.getPersonalizedThreshold, bounded to +/-25%) replace
  # the coach's raw declineThreshold/pressureGapThreshold before
  # applyPhilosophyThresholds runs.
  #
  # Split 2026-09-23 from coachhelm_learned_personalization, which this
  # consumer used to share with the unrelated v3 coach-weight read in
  # score.ts. Value/environment copied exactly from that id at the moment
  # of the split (false everywhere), so this change is a no-op for runtime
  # behavior.
  - feature_id: coachhelm_v2_alert_personalization
    owner: golf/coachhelm
    purpose: >-
      Adjusts a coach's v2 alert-generation thresholds (decline, pressure
      gap) using their own ack/dismiss history instead of only the
      coach-set CoachPhilosophy values; default off pending real-world
      evidence that this improves alert relevance.
    type: experiment
    status: active
    created_at: "2026-09-23"
    expires_at: null
    default: false
    environment:
      production: false
      preview: false
      development: false
    kill_switch_behavior: null
    cleanup_plan: >-
      Either promote to a permanent `release` flag once shadow-log data
      shows the learned thresholds track real coach preference (fewer
      dismissed alerts without missing real declines), or remove the
      wiring and this flag entirely if the evidence doesn't support it.

  # Package 8 slice 2 (repair plan 14.10): round-recap is the only live,
  # persisted (golf_rounds.ai_recap) LLM-text surface among those surveyed
  # (composeRoundReview/hero-narrative/practice-rx all have zero production
  # callers), so it is the wiring target for claim-validator.ts's typed
  # gate. This flag controls ONLY whether generateLLMRecap builds and
  # passes an evidence_packet — compose()'s existing flat numeric scan
  # (citations.ts) runs either way, unaffected by this flag.
  - feature_id: coachhelm_recap_claim_packet
    owner: golf/coachhelm
    purpose: >-
      Gates whether the round recap's compose() call also receives a
      typed EvidencePacket (Package 8), engaging claim-validator.ts's
      wrong-metric/wrong-player/wrong-window/unsupported-cause checks for
      this one LLM surface, on top of the existing flat numeric scan;
      default off pending real-world evidence this doesn't over-reject
      otherwise-good recaps into the deterministic fallback. A recap
      discarded to the fallback is cached forever (round-recap.ts only
      ever generates once per round; there is no regenerate path) — this
      flag must stay off in production until one exists, so a
      false-positive rejection isn't permanent for that round.
    type: experiment
    status: active
    created_at: "2026-09-23"
    expires_at: null
    default: false
    environment:
      production: false
      preview: false
      development: false
    kill_switch_behavior: null
    cleanup_plan: >-
      Either promote to a permanent `release` flag once shadow data (the
      recap's fallback rate with the packet engaged vs. without) shows the
      typed gate isn't discarding good recaps, or remove the packet
      wiring entirely if it is.

  - feature_id: coachhelm_focus_area_evidence_revision
    owner: golf/coachhelm
    purpose: >-
      Gates stamping computeEvidenceRevision()'s fingerprint onto
      golf_player_focus_areas.evidence_revision when a focus area is
      approved from a source insight (A8 slice 1). Requires migration
      20260923090000_golf_focus_area_evidence_revision applied in prod —
      until then the column does not exist there, and turning this on
      would make every insight-sourced focus-area create fail outright
      (the insert would include a key the live table doesn't have). Off
      by default in every environment for exactly that reason; this is a
      migration-sequencing gate, not a rollout decision the flag itself
      makes on the feature's merits.
    type: temporary_migration
    status: active
    created_at: "2026-09-23"
    expires_at: "2026-10-23"
    default: false
    environment:
      production: false
      preview: false
      development: false
    kill_switch_behavior: null
    cleanup_plan: >-
      Flip on (development, then preview, then production) only after the
      owner applies migration 20260923090000_golf_focus_area_evidence_revision
      to each environment and `information_schema.columns` confirms
      evidence_revision exists there. expires_at is a review reminder, not
      an automatic kill — if the migration still hasn't landed by then,
      re-date it rather than silently expiring. Once on everywhere and
      stable, remove this flag and the branch in createFocusAreaFromInsight
      / createFocusAreaFromInsightV2 that reads it (stamp unconditionally).
      DB-review follow-up (#2004): once db:types is regenerated against the
      applied migration, also restore the two now-untyped
      golf_player_focus_areas inserts (development.ts's
      createFocusAreaFromInsightV2Impl and createFocusAreaFromInsightImpl)
      to plain typed `.from('golf_player_focus_areas')` calls — they were
      routed through fromUntyped only because evidence_revision didn't
      exist in generated types yet, and that escape hatch should not
      outlive the reason it was needed.

  - feature_id: coachhelm_a4_sequence_attribution_surface
    owner: golf/coachhelm
    purpose: >-
      Gates whether the Round Review page renders the new per-hole
      sequence-attribution rollup (loadSequenceAttribution +
      computeSequenceAttribution + SequenceAttributionSection) below the
      existing stat breakdown; default off pending a design/product review
      of the section's placement, copy, and the observed-strokes-gained
      wording against a busy round.
    type: experiment
    status: active
    created_at: "2026-09-23"
    expires_at: null
    default: false
    environment:
      production: false
      preview: false
      development: false
    kill_switch_behavior: null
    cleanup_plan: >-
      Either promote to a permanent `release` flag once the section has
      been reviewed, or remove the section and its wiring if the review
      asks for a different surface/placement instead.
