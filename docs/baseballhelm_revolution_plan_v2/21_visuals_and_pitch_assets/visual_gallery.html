<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BaseballHelm Visual Gallery</title>
  <style>
    body {
      margin: 0;
      background: #f7f4ee;
      color: #17212b;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 28px 80px;
    }
    h1 {
      font-size: 44px;
      margin: 0 0 8px;
      letter-spacing: 0;
    }
    p {
      color: #5b6470;
      font-size: 18px;
      line-height: 1.55;
      margin: 0 0 28px;
    }
    section {
      margin: 34px 0 56px;
      background: #fff;
      border: 1px solid #ddd6ca;
      border-radius: 14px;
      padding: 22px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #ebe5dc;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>BaseballHelm Visual Gallery</h1>
    <p>PNG versions are used here for maximum compatibility. Editable SVG sources remain in the assets folder.</p>

    <section>
      <h2>BaseballHelm Program OS</h2>
      <img src="assets/baseballhelm_program_os_map.png" alt="BaseballHelm Program OS map">
    </section>

    <section>
      <h2>Source To Action Loop</h2>
      <img src="assets/source_to_action_loop.png" alt="Source to action loop">
    </section>

    <section>
      <h2>Import Dossier Flow</h2>
      <img src="assets/import_dossier_flow.png" alt="Import Dossier flow">
    </section>

    <section>
      <h2>Baseball CoachHelm Engine</h2>
      <img src="assets/coachhelm_engine_map.png" alt="Baseball CoachHelm engine map">
    </section>

    <section>
      <h2>Coach Command Center Concept</h2>
      <img src="assets/coach_command_center_mock.png" alt="Coach Command Center concept mock">
    </section>

    <section>
      <h2>Player Today Mobile Concept</h2>
      <img src="assets/player_today_mobile_mock.png" alt="Player Today mobile concept mock">
    </section>
  </main>
</body>
</html>
