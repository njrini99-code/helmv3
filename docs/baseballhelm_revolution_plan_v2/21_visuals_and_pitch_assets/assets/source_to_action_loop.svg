<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fbfaf7"/>
  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#18222c">Source To Action Loop</text>
  <text x="82" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#59636f">The product advantage: data does not stop at charts. It becomes staff action and measured improvement.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="95" y="345" width="210" height="130" rx="18" fill="#fff" stroke="#d8d2c7"/>
    <text x="200" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#17212b">Sources</text>
    <text x="200" y="425" text-anchor="middle" font-size="16" fill="#5b6470">stats, video, lifts</text>
    <text x="200" y="452" text-anchor="middle" font-size="16" fill="#5b6470">classes, sensors</text>

    <rect x="365" y="345" width="210" height="130" rx="18" fill="#fff" stroke="#d8d2c7"/>
    <text x="470" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#17212b">Trust</text>
    <text x="470" y="425" text-anchor="middle" font-size="16" fill="#5b6470">official, vendor</text>
    <text x="470" y="452" text-anchor="middle" font-size="16" fill="#5b6470">coach, unverified</text>

    <rect x="635" y="345" width="210" height="130" rx="18" fill="#17212b"/>
    <text x="740" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Signals</text>
    <text x="740" y="425" text-anchor="middle" font-size="16" fill="#cdd6df">what changed</text>
    <text x="740" y="452" text-anchor="middle" font-size="16" fill="#cdd6df">why it matters</text>

    <rect x="905" y="345" width="210" height="130" rx="18" fill="#fff" stroke="#d8d2c7"/>
    <text x="1010" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#17212b">Actions</text>
    <text x="1010" y="425" text-anchor="middle" font-size="16" fill="#5b6470">tasks, practice</text>
    <text x="1010" y="452" text-anchor="middle" font-size="16" fill="#5b6470">lift, video, meeting</text>

    <rect x="1175" y="345" width="210" height="130" rx="18" fill="#fff" stroke="#d8d2c7"/>
    <text x="1280" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#17212b">Outcomes</text>
    <text x="1280" y="425" text-anchor="middle" font-size="16" fill="#5b6470">did it work?</text>
    <text x="1280" y="452" text-anchor="middle" font-size="16" fill="#5b6470">learn + adjust</text>
  </g>
