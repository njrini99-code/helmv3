  <rect x="470" y="675" width="660" height="76" rx="18" fill="#fff3ed" stroke="#f0b099"/>
  <text x="800" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#a63a20">This is why BaseballHelm beats static dashboards.</text>
