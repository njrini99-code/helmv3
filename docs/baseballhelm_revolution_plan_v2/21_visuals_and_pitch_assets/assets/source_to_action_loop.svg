    <path d="M625 410 l-16 -9 v18 z"/>
    <path d="M895 410 l-16 -9 v18 z"/>
    <path d="M1165 410 l-16 -9 v18 z"/>
    <path d="M205 486 l-6 -17 l18 5 z"/>
