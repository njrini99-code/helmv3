<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <rect width="1600" height="950" fill="#f7f4ee"/>
  <text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17212b">Import Dossier Flow</text>
  <text x="82" y="125" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5b6470">A professional pipeline for messy baseball data: vendor exports, XML, CSV, XLSX, PDFs, manual entry, and rollback.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="220" width="230" height="120" rx="16" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="205" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#17212b">Upload</text>
    <text x="205" y="296" text-anchor="middle" font-size="15" fill="#5b6470">XML, CSV, XLSX</text>
    <text x="205" y="320" text-anchor="middle" font-size="15" fill="#5b6470">PDF, manual</text>

    <rect x="380" y="220" width="230" height="120" rx="16" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="495" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#17212b">Detect + Parse</text>
    <text x="495" y="296" text-anchor="middle" font-size="15" fill="#5b6470">source, grain</text>
    <text x="495" y="320" text-anchor="middle" font-size="15" fill="#5b6470">raw rows saved</text>

    <rect x="670" y="220" width="230" height="120" rx="16" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="785" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#17212b">Map Fields</text>
    <text x="785" y="296" text-anchor="middle" font-size="15" fill="#5b6470">saved profiles</text>
    <text x="785" y="320" text-anchor="middle" font-size="15" fill="#5b6470">units + aliases</text>

    <rect x="960" y="220" width="230" height="120" rx="16" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="1075" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#17212b">Match Players</text>
    <text x="1075" y="296" text-anchor="middle" font-size="15" fill="#5b6470">external IDs</text>
    <text x="1075" y="320" text-anchor="middle" font-size="15" fill="#5b6470">fuzzy + manual</text>

    <rect x="1250" y="220" width="230" height="120" rx="16" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="1365" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#17212b">Validate</text>
    <text x="1365" y="296" text-anchor="middle" font-size="15" fill="#5b6470">duplicates</text>
    <text x="1365" y="320" text-anchor="middle" font-size="15" fill="#5b6470">impossible values</text>

    <rect x="235" y="510" width="260" height="130" rx="16" fill="#17212b"/>
    <text x="365" y="558" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Preview</text>
    <text x="365" y="592" text-anchor="middle" font-size="16" fill="#cdd6df">diffs, warnings</text>
    <text x="365" y="618" text-anchor="middle" font-size="16" fill="#cdd6df">affected players</text>

    <rect x="670" y="510" width="260" height="130" rx="16" fill="#17212b"/>
    <text x="800" y="558" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Commit</text>
    <text x="800" y="592" text-anchor="middle" font-size="16" fill="#cdd6df">official + development</text>
    <text x="800" y="618" text-anchor="middle" font-size="16" fill="#cdd6df">source stamped</text>

    <rect x="1105" y="510" width="260" height="130" rx="16" fill="#17212b"/>
    <text x="1235" y="558" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Recalculate</text>
    <text x="1235" y="592" text-anchor="middle" font-size="16" fill="#cdd6df">stats, signals</text>
    <text x="1235" y="618" text-anchor="middle" font-size="16" fill="#cdd6df">timelines, CoachHelm</text>

    <rect x="535" y="765" width="530" height="78" rx="20" fill="#fff3ed" stroke="#f0b099"/>
    <text x="800" y="812" text-anchor="middle" font-size="24" font-weight="700" fill="#a63a20">Rollback is always possible because every row knows its import run.</text>
  </g>

  <g stroke="#d94f2b" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M320 280 L380 280"/>
    <path d="M610 280 L670 280"/>
    <path d="M900 280 L960 280"/>
    <path d="M1190 280 L1250 280"/>
    <path d="M1365 340 C1365 425 365 425 365 510"/>
    <path d="M495 575 L670 575"/>
    <path d="M930 575 L1105 575"/>
    <path d="M1235 640 C1235 720 930 730 800 765"/>
  </g>
</svg>

