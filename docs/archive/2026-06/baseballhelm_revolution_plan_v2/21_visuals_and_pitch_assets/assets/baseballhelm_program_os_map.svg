<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f7f4ee"/>
  <text x="80" y="95" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#1f2933">BaseballHelm Program OS</text>
  <text x="82" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5b6470">A baseball-specific operating layer connecting sources, staff decisions, player work, and measurable outcomes.</text>

  <rect x="545" y="330" width="510" height="245" rx="18" fill="#17212b"/>
  <text x="800" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff">BaseballHelm</text>
  <text x="800" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#cdd6df">Source Trust + Signals + Actions</text>
  <text x="800" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#96a4b3">The connective tissue between baseball tools</text>
  <rect x="675" y="505" width="250" height="38" rx="19" fill="#d94f2b"/>
  <text x="800" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">Program Operating System</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="220" width="280" height="115" rx="14" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="110" y="260" font-size="24" font-weight="700" fill="#17212b">Staff Ops</text>
    <text x="110" y="292" font-size="16" fill="#5b6470">calendar, tasks, travel, docs</text>
    <text x="110" y="318" font-size="16" fill="#5b6470">acknowledgements, meetings</text>

    <rect x="80" y="390" width="280" height="115" rx="14" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="110" y="430" font-size="24" font-weight="700" fill="#17212b">Stats + Imports</text>
    <text x="110" y="462" font-size="16" fill="#5b6470">GameChanger, StatCrew, XML</text>
    <text x="110" y="488" font-size="16" fill="#5b6470">CSV, XLSX, rollback</text>

    <rect x="80" y="560" width="280" height="115" rx="14" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="110" y="600" font-size="24" font-weight="700" fill="#17212b">Video Evidence</text>
    <text x="110" y="632" font-size="16" fill="#5b6470">Synergy, AWRE, OnForm</text>
    <text x="110" y="658" font-size="16" fill="#5b6470">clips, tags, annotations</text>

    <rect x="1240" y="220" width="280" height="115" rx="14" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="1270" y="260" font-size="24" font-weight="700" fill="#17212b">Development Data</text>
    <text x="1270" y="292" font-size="16" fill="#5b6470">TrackMan, Rapsodo, Blast</text>
    <text x="1270" y="318" font-size="16" fill="#5b6470">pitch, swing, batted ball</text>

    <rect x="1240" y="390" width="280" height="115" rx="14" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="1270" y="430" font-size="24" font-weight="700" fill="#17212b">Strength + Ready</text>
    <text x="1270" y="462" font-size="16" fill="#5b6470">lifts, soreness, workload</text>
    <text x="1270" y="488" font-size="16" fill="#5b6470">pitcher/two-way risk</text>

    <rect x="1240" y="560" width="280" height="115" rx="14" fill="#ffffff" stroke="#d8d2c7"/>
    <text x="1270" y="600" font-size="24" font-weight="700" fill="#17212b">Classes + Availability</text>
    <text x="1270" y="632" font-size="16" fill="#5b6470">conflicts, travel, lifts</text>
    <text x="1270" y="658" font-size="16" fill="#5b6470">player daily schedule</text>

    <rect x="400" y="765" width="240" height="100" rx="14" fill="#fff" stroke="#d8d2c7"/>
    <text x="520" y="806" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">Coach Cockpit</text>
    <text x="520" y="836" text-anchor="middle" font-size="15" fill="#5b6470">what changed + what to do</text>

    <rect x="680" y="765" width="240" height="100" rx="14" fill="#fff" stroke="#d8d2c7"/>
    <text x="800" y="806" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">Player Today</text>
    <text x="800" y="836" text-anchor="middle" font-size="15" fill="#5b6470">schedule + tasks + development</text>

    <rect x="960" y="765" width="240" height="100" rx="14" fill="#fff" stroke="#d8d2c7"/>
    <text x="1080" y="806" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">CoachHelm</text>
    <text x="1080" y="836" text-anchor="middle" font-size="15" fill="#5b6470">evidence-backed intelligence</text>
  </g>

  <g stroke="#d94f2b" stroke-width="4" fill="none" opacity="0.85">
    <path d="M360 278 C440 310 480 345 545 385"/>
    <path d="M360 448 C440 448 480 448 545 448"/>
    <path d="M360 618 C440 585 480 552 545 515"/>
    <path d="M1240 278 C1160 310 1120 345 1055 385"/>
    <path d="M1240 448 C1160 448 1120 448 1055 448"/>
    <path d="M1240 618 C1160 585 1120 552 1055 515"/>
    <path d="M680 575 C620 650 565 710 520 765"/>
    <path d="M800 575 L800 765"/>
    <path d="M920 575 C980 650 1035 710 1080 765"/>
  </g>
</svg>

